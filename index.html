rces to which the assigned\npermissions apply. Scope follows a strict top-down inheritance hierarchy: any role granted at a\nparent level automatically flows downward to every child inside it, following the principle of Least\nPrivilege (assign roles at the narrowest scope needed, such as a single Resource Group rather\nthan an entire Subscription).\nE0416B Cloud Computing Lab • Lab 6 Beginner’s Step-by-Step Guide   Page 8 of 10\n\n────────────────────────────────────────\n\n1. Management Group — Broadest scope; permissions apply to all Subscriptions under that\nmanagement group.\n2. Subscription — Permissions apply to all Resource Groups and resources inside that\nsubscription.\n3. Resource Group — Permissions apply to all resources inside one folder (e.g., rg-\nlab6-ROLLNO used in Lab 6).\n4. Resource — Narrowest scope; permissions apply to one single resource (e.g., a\nsingle Storage Account).\nQuestion 3: How does Conditional Access support the Zero Trust principle “verify\nexplicitly”?\nThe Zero Trust principle “Verify explicitly” states that you must never trust a user or connection\nautomatically (even inside a corporate network)—every access request must be continuously\nauthenticated and authorized using all available real-time data points. Conditional Access\nenforces this principle dynamically at every sign-in by acting as an automated policy engine:\nEvaluates Live Signals: Before granting access, it inspects multiple signals—who the\nuser/group is (grp-lab-readers), which sensitive app they are opening (Microsoft Azure\nManagement), their device compliance, IP location, and real-time sign-in risk.\nEnforces Adaptive Decisions: Based on those signals, it explicitly demands stronger\nverification—such as Require multifactor authentication—or blocks risky/uncompliant access\nentirely instead of relying on a static username and password alone.\nQuestion 4: Name two passwordless authentication methods.\n1. Windows Hello for Business: Replaces passwords on Windows PCs with device-bound\ncryptographic keys unlocked locally using biometrics (fingerprint or facial recognition) or a\ndevice PIN.\n2. FIDO2 Security Keys (Passkeys): Standards-based physical hardware keys (such as a\nUSB/NFC YubiKey) or synced device passkeys that use public-key cryptography to sign in\nwithout typing any password (phishing-resistant).\nThird valid method (useful for Viva): Microsoft Authenticator Phone Sign-in (passwordless push\nnotification with number matching directly on a registered smartphone).\n8. Clean-up (Mandatory Before Closing Portal)\nFirst delete the resource group and storage account using Cloud Shell (Bash) in your Admin window\n(replace ROLLNO with your roll number):\naz group delete --name rg-lab6-ROLLNO --yes --no-wait\nE0416B Cloud Computing Lab • Lab 6 Beginner’s Step-by-Step Guide   Page 9 of 10\n\n────────────────────────────────────────\n\nNext, clean up the Microsoft Entra ID objects (especially important if working in a shared tenant):\n1. Delete Conditional Access Policy: Open Microsoft Entra ID → Security → Conditional\nAccess → Policies → click the ... menu on CA-Require-MFA-Lab → click Delete → Yes.\n2. Delete Security Group: Open Microsoft Entra ID → Groups → check grp-lab-readers →\nclick Delete → Yes.\n3. Delete Test User: Open Microsoft Entra ID → Users → check labuser1 → click Delete → OK.\n9. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\n+ New user or + New group is   Your college IT manages your university tenant and restricts student\ngrayed out   accounts from creating directory users. Use a personal free Azure\naccount/tenant, or document the instructor’s live demo as instructed in the\nmanual.\nCannot find Contributor role   Azure moved Owner, Contributor, and User Access Administrator to the\nunder Add role assignment   second tab labeled Privileged administrator roles (right next to Job\nfunction roles).\nlabuser1 still cannot create a   RBAC change I + Portal ReadOnly Test)\nNow you will create a compliant storage account inside rg-lab7-ROLLNO, lock the resource group\nagainst deletion via CLI, prove that deletion fails with ScopeLocked, and then test a ReadOnly lock\nin the Portal.\nStep 1: Create Storage Account & Apply CanNotDelete Lock (Cloud Shell)\n1. Click the Cloud Shell icon (>_) in the top-right blue bar of the Azure Portal and select Bash.\n2. Run these four commands one by one (replace ROLLNO with your lowercase roll number):\nE0416B Cloud Computing Lab • Lab 7 Beginner’s Step-by-Step Guide   Page 4 of 9\n\n────────────────────────────────────────\n\naz storage account create --name stlab7$RANDOM --resource-group rg-lab7-ROLLNO --\nlocation centralindia --sku Standard_LRS --tags Course=E0416B\naz lock create --name lock-nodelete --lock-type CanNotDelete --resource-group rg-\nlab7-ROLLNO\naz group delete --name rg-lab7-ROLLNO --yes\naz lock list --resource-group rg-lab7-ROLLNO --output table\nCommand 1: Creates a storage account with a random unique name (stlab7xxxxx) and\nattaches --tags Course=E0416B so it passes Policy #2! Wait ~25 seconds for it to finish.\nCommand 2: Attaches a CanNotDelete lock named lock-nodelete to the entire resource\ngroup rg-lab7-ROLLNO.\nCommand 3: Attempts to delete rg-lab7-ROLLNO. Because of the lock, Azure immediately\nrejects it with a red error message: (ScopeLocked) The scope\n'/subscriptions/.../resourceGroups/rg-lab7-ROLLNO' cannot perform delete operation\nbecause following scope(s) are locked... Please remove the lock and try again.\nCommand 4: Displays a clean table listing lock-nodelete with level CanNotDelete.\nTake Screenshot #3 of your Cloud Shell terminal showing the ScopeLocked error and the\naz lock list table!\nStep 2: Inspect Locks & Test a ReadOnly Lock in the Azure Portal\n1. Minimize Cloud Shell and navigate to Resource groups → click rg-lab7-ROLLNO.\n2. In the left vertical menu of rg-lab7-ROLLNO, scroll down to the Settings section and click Locks.\nNotice that lock-nodelete (Type: Delete) is listed here—and notice the Delete button on the\nresource group Overview will also fail if clicked!\n3. Now click Overview on rg-lab7-ROLLNO and open your storage account (stlab7xxxxx).\n4. In the left vertical menu of the storage account, scroll down to Settings and click Locks. (Notice\nyou already see lock-nodelete inherited from the parent resource group!)\n5. Click + Add at the top-left of the storage account’s Locks page:\nLock name: Type lock-readonly.\nLock type: Select Read-only.\nNotes: Type Lab 7 read-only test.\nClick OK.\n6. Observe what actions are blocked by a Read-only lock:\nTry modifying Tags: Click Tags in the storage account’s left menu, try adding a new tag (e.g.,\nTest=1), and click Apply → blocked with ScopeLocked!\nTry viewing Access Keys or Containers: Click Security + networking → Access keys (or\nData storage → Containers). Surprisingly, Azure even blocks listing storage access keys and\ncreating containers because Azure implements those operations as HTTP POST write-style\nactions!\nTry deleting the storage account: Also blocked with ScopeLocked.\nE0416B Cloud Computing Lab • Lab 7 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\n7. Record the blocked actions in Section 4 below, then immediately delete lock-readonly right\nnow so you don’t forget during Clean-up: go back to the storage account → Settings → Locks →\nclick Delete on the right side of the lock-readonly row.\n4. Lab Record Table (Fill During Practical)\nLab Item to Record   Your Recorded Value / Observation\nEffect Used by Policy #1 & Policy\n#2\nExact Error Code When Creating\nStandard_D4s_v3\nPolicy Compliance State\nObserved\nActions Blocked by ReadOnly\nLock\n5. Verification & Screenshot Checklist\nCapture and paste these three screenshots (with date and CLI commands used) into your lab journal\nbefore running Clean-up:\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n1   Policy denial message   Create VM Validation screen showing red Validation failed and\nthe error details displaying RequestDisallowedByPolicy\nfor Standard_D4s_v3.\n2   Compliance dashboard   Azure Portal → Policy → Compliance showing both policy\nassignments scoped to rg-lab7-ROLLNO and their\ncompliance states.\n3   ScopeLocked error   Cloud Shell terminal showing az group delete --name\nrg-lab7-ROLLNO --yes failing with (ScopeLocked)\nalongside az lock list (plus optional Portal screenshot of\nReadOnly lock blocking a tag update).\n6. Observation Questions & Complete Answers\nUse these structured, exam-ready answers for your lab journal and viva preparation:\nE0416B Cloud Computing Lab • Lab 7 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\nQuestion 1: Distinguish an Azure Policy from RBAC. Which one answers the question\n“what can this user do”?\nAzure RBAC (Role-Based Access\nAspect   Azure Policy\nControl)\nCore Focus   Focuses on user/identity actions (who is   Focuses on resource properties &\nallowed to perform operations at a given   compliance during deployment and on\nscope).   existing resources.\nQuestion   “What can this user do?”   “Does this resource comply with our\nAnswered   organizational rules and standards?”\nHow It Works   Grants permissions through roles like   Evaluates rules using effects like Deny,\nReader, Contributor, and Owner.   Audit, Modify, or\nDeployIfNotExists—applies even to\nOwners!\nLab Example   Allowing labuser1 to create VMs as a   Blocking even an Owner from creating a\nContributor (Lab 6).   Standard_D4s_v3 VM or deploying\nwithout tag Course=E0416B (Lab 7).\nDirect Answer: Azure RBAC answers the question “What can this user do?”\nQuestion 2: What is a policy initiative and when would you use one?\nA Policy Initiative (also called a Policy Set Definition) is a grouped collection of multiple\nindividual Azure Policy definitions combined together toward a single overarching governance\nor compliance goal. Instead of assigning and tracking 20 or 100 policies one by one, you assign\none single initiative at a Management Group, Subscription, or Resource Group scope.\nWhen to use one: You use a policy initiative whenever you need to enforce a multi-rule standard\nor regulatory compliance framework as a single unified package—for example, grouping VM size\nlimits, required billing tags, allowed regions, and storage encryption into a single “CFIS Lab\nGovernance” initiative, or applying built-in regulatory initiatives like ISO 27001, NIST SP 800-53,\nPCI-DSS, or the Microsoft Cloud Security Benchmark to monitor overall compliance percentage\non one dashboard.\nQuestion 3: Compare the CanNotDelete and ReadOnly lock types.\nAction / Aspect   CanNotDelete (Delete Lock)   ReadOnly (Read-only Lock)\nRead / View Resource Allowed   Allowed (strictly GET read operations\nonly)\nModify / Update   Allowed (e.g., edit tags, resize VM,   Blocked! (Prevents changes to tags,\nResource   upload blobs)   settings, and even some POST read\nactions like listing storage keys)\nDelete Resource   Blocked! (Returns ScopeLocked)   Blocked! (Returns ScopeLocked)\nE0416B Cloud Computing Lab • Lab 7 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nAction / Aspect   CanNotDelete (Delete Lock)   ReadOnly (Read-only Lock)\nBest Use Case   Production VMs, databases, and VNets   Immutable forensic evidence archives,\nthat still need routine updates/patching   finalized compliance configurations, or\nbut must never be deleted accidentally.   critical master templates that must never\nbe altered.\nQuestion 4: Can a user with the Owner role delete a locked resource? Explain.\nNo — not directly while the lock is in place. Resource locks override every user’s RBAC\npermissions, including an Owner or Contributor. If an Owner runs a delete command on a locked\nresource or resource group, Azure blocks the operation and returns a ScopeLocked error. This\nprevents accidental human mistakes even by top administrators.\nHow an Owner proceeds intentionally: Only users who hold the Owner or User Access\nAdministrator role (which include Microsoft.Authorization/locks/* permissions) have\npermission to explicitly delete the lock first, and only after removing the lock can they delete the\nunderlying resource. (A regular Contributor cannot even remove locks!)\n7. Clean-up (Mandatory — 3 Important Steps!)\nDo not skip Step 3 below—leaving Policy assignments active can cause confusing errors in future\nlabs!\nStep 1: Delete the Locks\nFirst ensure you deleted lock-readonly on the storage account in the Portal (from Part B, Step 2).\nThen open Cloud Shell (Bash) and delete lock-nodelete:\naz lock delete --name lock-nodelete --resource-group rg-lab7-ROLLNO\nStep 2: Delete the Resource Group\naz group delete --name rg-lab7-ROLLNO --yes --no-wait\nStep 3: Remove Both Policy Assignments in the Portal\n1. In the top-center Global Search Bar, search for Policy and open it.\n2. In the left vertical menu of Azure Policy (under Authoring), click Assignments.\n3. Locate your two assignments scoped to rg-lab7-ROLLNO:\nAllowed virtual machine size SKUs\nRequire a tag and its value on resources\n4. For each assignment, click the ... (three dots) on the far right of its row → click Delete\nassignment → click Yes.\nE0416B Cloud Computing Lab • Lab 7 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\n8. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\nCreating Standard_D4s_v3   Azure Policy takes 5–30 minutes to propagate. Do NOT click Create!\nsays Validation passed instead of   Double-check that your assignment Scope is rg-lab7-ROLLNO and\nfailing   Enforcement is Enabled, wait 5 more minutes, and retry Validation.\nPart B storage account creation fails You left out --tags Course=E0416B (or misspelled Course /\nwith   E0416B—tag names sorship portal, so standard Cost Analysis inside\nthe Azure Portal may display a sponsorship notice. Follow the exact Portal steps in Part C\nfirst—and if Cost Analysis shows a sponsorship redirect, capture that screen and check your\nSponsorship credit breakdown alongside creating your budget.\nClean-up is completely risk-free: Deleting budget-lab8 at the end simply removes the\nemail notification rule—it never deletes any cloud resources.\n1. Plain-English Overview: Cloud Financial Governance & Reliability\nIn cloud computing, you pay only for what you configure and run. Lab 8 teaches you how to predict\ncosts before deploying, track spending while running, and calculate application uptime guarantees:\nLab Part & Tool   Plain-English Purpose   What You Do in Lab 8\nPart A: Pricing   An online shopping cart for Azure   Price a 5-component web solution,\nCalculator   services that estimates your monthly   compare Central India vs. East US,\nbill before you create anything.   compare Pay-as-you-go vs. Reserved &\nSpot, and export Excel files.\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 1 of 9\n\n────────────────────────────────────────\n\nLab Part & Tool   Plain-English Purpose   What You Do in Lab 8\nPart B: TCO Calculator Compares the 3-to-5-year cost of   Model 10 on-premises servers (8 cores,\nrunning your own physical server room   32 GB RAM) + 5 TB storage and inspect\nvs. migrating to Azure.   savings in hardware, electricity, IT labor,\nand space.\nPart C: Cost   Tracks actual spending by tag/group,   Group costs by Resource Group, Tag\nManagement &   sends budget warning emails, and flags   (Course), and Service; create\nAdvisor   idle resources.   budget-lab8 (80% Actual / 100%\nForecasted alerts); check Advisor Cost\ntips.\nPart D: Composite   Calculates combined uptime percentage Multiply App Service (99.95%) × Azure\nSLA   and allowed monthly downtime when   SQL (99.99%) × a third service\nmultiple services depend on each other.   (99.9%) and convert to allowed\nminutes of downtime.\n2. Part A: Azure Pricing Calculator (Browser Walkthrough)\nStep 1: Open the Calculator & Build the 5-Item Web Solution Estimate\n1. Open a new browser tab, search Google/Bing for Azure Pricing Calculator, and open the\nofficial Microsoft page (azure.microsoft.com/pricing/calculator).\n2. Click Clear estimate (if any sample items are already loaded at the bottom) so you start with a\nclean $0 estimate.\n3. Add and configure each of the five required components using the search box under Products:\nComponent   How to Add & Configure in Calculator   Key Settings to Verify\n1. Windows VM   Click Virtual Machines in Products → scroll   Region: Central India | OS:\n(Standard_B2s)   down to its card.   Windows | Type: OS only | Tier:\nStandard | Instance: B2s (2\nvCPUs, 4 GiB RAM) | VMs: 1 ×\n730 hrs | Savings: Pay-as-you-\ngo.\n2. Managed Disk   Inside the same VM card, expand Managed   Tier: Standard SSD (or Standard\nDisks (or search and add Storage Accounts → HDD) | Disk size: E10 (128 GiB)\nManaged Disks separately).   (or S10) | Number of disks: 1.\n3. Storage Account   Search Storage Accounts in Products → Region: Central India | Type:\n(100 GB, LRS, Hot)   click to add its card below.   Block Blob Storage (or General\nPurpose v2) | Redundancy: LRS |\nAccess Tier: Hot | Capacity:\n100 GB.\n4. App Service Plan   Search App Service in Products → click to Region: Central India | OS:\n(Basic B1)   add its card below.   Windows (or Linux) | Tier: Basic\n| Instance: B1 (1 Core, 1.75 GB\nRAM) | Instances: 1 × 730\nhrs.\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 2 of 9\n\n────────────────────────────────────────\n\nComponent   How to Add & Configure in Calculator   Key Settings to Verify\n5. Outbound Data   Search Bandwidth in Products → click to   Source Region: Central India |\nTransfer (50 GB)   add its card below.   Data transfer type: Internet\negress | Outbound Data Transfer:\n50 GB (note: first 100\nGB/month is free = $0.00!).\nStep 2: Record Central India Total, Switch to East US & Export\n1. Scroll to the bottom of the Pricing Calculator page and note the Estimated monthly cost for\nCentral India. Write it into your Lab Record Table (Section 5).\n2. Click the Export button at the bottom of the page to download an Excel spreadsheet\n(ExportedEstimate.xlsx). Rename this downloaded file to Estimate_CentralIndia.xlsx so\nyou can attach it to your lab journal.\n3. Now scroll back up through each item card and change the Region dropdown from Central India\nto East US.\n4. Scroll down to the bottom and record the new East US monthly total in Section 5. Notice that East\nUS is slightly lower than Central India because US flagship regions have massive scale and\nlower local power/infrastructure costs.\n5. Change the regions back to Central India before doing Step 3.\nStep 3: Compare VM Billing Options (Pay-as-you-go vs. 1-Year Reserved vs. Spot)\n1. Scroll to your Windows Virtual Machine (B2s) card and look at the Savings options (billing)\nsection on the right side of the VM card:\nBaseline — Pay-as-you-go: Note the VM’s standalone monthly price (e.g., ~$30–$36/month\ndepending on OS license inclusion).\n1-year reserved: Click the 1 year reserved radio button. Record the new monthly VM price\nand calculate the percentage/dollar saving (typically ~30% to 41% cheaper than Pay-as-you-\ngo in exchange for a 1-year commitment).\nSpot (where offered): Click the Azure Spot radio button (if offered for B2s in that region; if\ngrayed out for B2s, temporarily check East US or a D-series SKU to observe Spot pricing).\nSpot uses spare Azure capacity at massive discounts (often ~60% to 80% cheaper), with the\ntrade-off that Azure can evict (stop) the VM whenever capacity is needed elsewhere.\n2. Set the VM back to 1 year reserved, click Export at the bottom of the page, and save that second\nspreadsheet as Estimate_Reserved_Comparison.xlsx for your Verification submission!\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 3 of 9\n\n────────────────────────────────────────\n\n3. Part B: Azure TCO (Total Cost of Ownership) Calculator\n1. Open a new browser tab, search for Azure TCO Calculator, and open Microsoft’s Total Cost of\nOwnership Calculator (azure.microsoft.com/pricing/tco/calculator).\n2. Step 1 of Wizard — Define your workloads:\nUnder Servers, click + Add server workload and enter: Workload = General | Environment =\nVirtual Machines (or Physical Servers) | OS = Windows | VMs/Servers = 10 | Virtualization =\nHyper-V (or VMware) | Cores = 8 | RAM (GB) = 32.\nUnder Storage, click + Add storage and enter: Storage type = Local Disk/SAN | Disk type =\nHDD | Capacity = 5 TB (verify the unit dropdown says TB, or enter 5000 if set to GB).\nClick the blue Next button at the bottom.\n3. Step 2 of Wizard — Adjust assumptions: Review the default industry assumptions for electricity\ncost per kWh, storage maintenance, and IT labor hourly rates, then click Next.\n4. Step 3 of Wizard — View report:\nAt the top of the report, set Timeframe to 3 Years and Region to Central India (or East US).\nExamine the big comparison chart showing Estimated On-Premises Cost vs. Estimated\nAzure Cost and the Total 3-Year Savings.\nScroll down to the Cost Breakdown table and note which on-premises categories drop to $0\nin Azure: Compute/Server Hardware (buying/replacing physical servers), Electricity (Power\n& Cooling), and Datacenter Space / Facilities (rack floor space), alongside major reductions\nin IT Labor (hardware maintenance/patching) and Networking!\nClick Download (or Print to PDF / take a screenshot) at the top-right of the report to save your\nTCO Summary for your lab journal.\n4. Part C: Cost Management, Budgets, Alerts & Advisor (Azure Portal)\nStep 1: Analyze Costs in Cost Analysis (Group by Resource Group, Tag & Service)\n1. Sign in at portal.azure.com.\n2. Click the top-center Global Search Bar, type al | % of budget = 80 (Azure automatically calculates the dollar/rupee\nthreshold).\nRow 2: Type = Forecasted | % of budget = 100.\n6. Scroll down to Alert recipients (email), type your personal/college email address, and press\nEnter (or Tab) so it locks into the box.\n7. Take Screenshot #2 right now showing the budget alert conditions (80% Actual & 100%\nForecasted) and your email recipient! Then click the blue Create button.\nStep 4: Review Cost Recommendations in Azure Advisor\n1. Click the top-center Global Search Bar, type Advisor, and click Advisor under Services.\n2. In the left vertical menu of Azure Advisor (or by clicking the Cost summary card on the Overview\npage), click Cost.\n3. Review any active recommendations (such as Right-size or shut down underutilized virtual\nmachines, Delete unattached disks, or Consider Reserved Instances). If all previous lab VMs were\nproperly cleaned up, Advisor will display “No recommendations” (confirming good cost hygiene!).\nRecord what you see in Section 5.\n5. Part D: Composite SLA & Allowed Downtime Calculation\nWhen multiple cloud services work together in series so that all of them must stay up for your web\napplication to work, you multiply their individual availability percentages (expressed as decimals) to\nfind the Composite SLA:\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\nGiven Individual Service SLAs:\nService 1 — Azure App Service: 99.95% = 0.9995\nService 2 — Azure SQL Database: 99.99% = 0.9999\nService 3 — Third Dependent Service: 99.9% = 0.999\nStep 1 — Calculate the 3-Service Composite SLA:\nComposite SLA = 0.9995 × 0.9999 × 0.999\nComposite SLA = 0.99940005 × 0.999 = 0.99840065 → 99.84% (exact: 99.8401%)\nStep 2 — Calculate Allowed Monthly Downtime:\nUnavailability fraction = 1 − 0.99840065 = 0.00159935 (or 0.1599% downtime)\nUsing a standard 30-day month (30 × 24 × 60 = 43,200 minutes):\nAllowed Downtime = 43,200 × 0.00159935 = 69.09 minutes → ~69.1 minutes (1 hour 9\nminutes) per month.\nUsing an average 30.44-day month (365 ÷ 12 × 24 × 60 = 43,830 minutes):\nAllowed Downtime = 43,830 × 0.00159935 = 70.10 minutes → ~70.1 minutes (1 hour\n10 minutes) per month.\n6. Lab Record Table (Fill During Practical)\nLab Item to Record   Your Recorded Value / Observation\nPricing Calculator: Central India\nMonthly Total\nPricing Calculator: East US Monthly\nTotal & Difference\nVM Savings: 1-Year Reserved vs. Spot\nPricing\nTCO Calculator: 3-Year On-Premises\nvs. Azure Cost\nAdvisor → Cost Recommendation\nObserved\n7. Verification & Screenshot Checklist\nAttach these exported files and screenshots (with date) to your lab journal before running Clean-up:\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\nNo.   Manual Verification Requirement   Exact File / Screenshot to Capture\n1   Exported Pricing Calculator estimates Both downloaded Excel/PDF exports:\nEstimate_CentralIndia.xlsx (region comparison) and\nEstimate_Reserved_Comparison.xlsx (reserved\ncomparison).\n2   TCO Calculator summary   Downloaded PDF or full-page screenshot of the 3-year TCO\ncomparison report showing reduced hardware, electricity, IT\nlabor, and datacenter space costs.\n3   Cost analysis grouped by tag   Azure Portal → Cost Management → Cost analysis\ngrouped by Tag (Course) (or Sponsorship usage\nbreakdown if on Student offer).\n4   Budget with alert conditions   Azure Portal → Cost Management → Budgets showing\nbudget-lab8 with 80% Actual and 100% Forecasted\nemail alerts configured.\n8. Observation Questions & Complete Answers\nUse these structured, exam-ready answers for your lab journal and viva preparation:\nQuestion 1: List four factors that affect the cost of Azure resources.\n1. Resource Type & Tier / SKU Size: Choosing higher compute capacity (e.g.,\nStandard_D4s_v3 vs. Standard_B1s), premium SSD storage over standard HDD, or higher\nApp Service tiers (S1 vs. B1) directly increases hourly/monthly rates.\n2. Usage Meter & Duration: How long a resource runs (billed per second/hour for VMs) and how\nmuch capacity or transactions it consumes (GB stored, function executions, or operations).\n3. Azure Region (Location): Infrastructure, power, tax, and real estate costs differ by geography\n—for example, deploying in East US costs slightly less than Central India for the same SKU.\n4. Bandwidth (Outbound Data Transfer / Egress): Inbound traffic (ingress) into Azure\ndatacenters is free, whereas outbound data leaving Azure datacenters over the internet (beyond\nthe monthly free tier) or across regions incurs per-GB egress charges.\nAdditional factors (useful for Viva): Billing/Purchasing Model (Pay-as-you-go vs. Reserved vs.\nSpot) and Storage Redundancy Level (LRS vs. ZRS vs. GRS/GZRS).\nQuestion 2: Compare Pay-as-you-go, Reserved Instances and Spot pricing, with a suitable\nworkload for each.\nPricing Model   How It Works & Discount   Commitment / Risk   Suitable Workload\nPay-as-you-go   Pay standard list rate per   No long-term   Short-term student labs,\n(PAYG)   second/hour with 0% upfront   commitment; highest   unpredictable traffic\ncommitment; start or stop   unit price.   spikes, or new dev/test\nanytime.   apps with unknown\nruntime.\nE0416B Cloud Computing Lab • Lab 8 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nPricing Model   How It Works & Discount   Commitment / Risk   Suitable Workload\nReserved   Commit to a specific VM   1- or 3-year financial   Steady-state, 24×7\nInstances (RIs)   family/region for 1 year or 3   commitment;   production workloads such\nyears for up to ~72% savings. guaranteed capacity.   as core databases,\ndomain controllers, or\nalways-on web servers.\nAzure Spot VMs   Purchase unused Azure   Can be evicted   Stateless, fault-tolerant\ndatacenter capacity at steep   (interrupted) with 30   batch jobs, video\ndiscounts (up to ~90% off).   seconds notice   rendering, big-data\nwhenever Azure needs   analytics, or CI/CD build\ncapacity back.   agents.\nQuestion 3: How do tags help with chargeback and billing?\nAzure Tags are customizable Name=Value metadata pairs (such as Course=E0416B,\nDept=CFIS, or CostCenter=IT-101) attached to resources and resource groups. In Azure Cost\nManagement, every billing line item records the tags attached to that resource, enabling two key\nfinancial governance practices:\nShowback & Chargeback: Finance and IT teams can filter, group, and export monthly\nspending by department, project, or cost center tag—allowing an organization to transparently\nreport usage (showback) or accurately bill internal departments for the exact cloud resources\nthey consumed (chargeback).\nCross-Group Cost Visibility & Budgets: Even when a single project’s VMs, storage accounts,\nand databases span multiple resource groups or subscriptions, filtering by a shared tag\naggregates total project spend in one view and allows setting tag-scoped budgets and alerts.\nQuestion 4: Does adding more dependent services increase or decrease the composite\nSLA? Why?\nAdding more dependent services in series decreases the composite SLA. Mathematically,\navailability is represented as a probability strictly less than 1 (for example, 0.9995 and 0.9999),\nand multiplying numbers less than 1 always yields a smaller product (0.9995 × 0.9999 × 0.999\n= 0.9984, or 99.84%). Architecturally, when services are chained sequentially, each service\nbecomes a potential single point of failure—if any one of the dependent services experiences\nan outage, the entire application fails, increasing total allowed downtime.\n9. Clean-up (Mandatory Before Closing Portal)\n1. Delete budget-lab8: In the Azure Portal, open Cost Management + Billing → Cost\nManagement → Budgets → click the ... menu (or open budget-lab8 and click Delete\nbudget at the top toolbar) → confirm Yes.\n2. Verify zero leftover resource  Estimated Time: 3 Hours\nAim: Monitor a VM with Azure Monitor metrics and alerts, review Advisor and Service Health, and\ndeploy resources declaratively with an ARM template.\nPrerequisites: Lab 2 skills (Ubuntu VM creation and SSH); access to the Azure Portal and Cloud\nShell.\nBefore You Start: 4 Essential Beginner Tips for Lab 9\nCreate the Alert Rule BEFORE running the CPU load command: Azure Monitor evaluates\nCPU over a 5-minute window. Set up the alert rule and email Action Group first, then run the\n5-minute stress command (`sleep 300`) inside vm-mon so the alert fires reliably.\nCheck your Spam / Promotions folder for the Azure Monitor email: The alert email\narrives from azure-noreply@microsoft.com about 5 to 8 minutes after CPU crosses 80%.\nDo NOT forget kill %1 after sleep 300 finishes: Running yes > /dev/null & pins\nthe VM’s CPU at 100% until you run kill %1 to stop it.\nSwitch back to Bash before Part D: Part C asks you to switch Cloud Shell from Bash to\nPowerShell—remember to switch the dropdown back to Bash before running the az\ndeployment commands in Part D!\n1. Plain-English Overview: Monitoring, Operations & Automation\nIn this final lab of the course, you learn how cloud engineers keep running applications healthy and\nautomate deployments using code instead of manual portal clicks:\nLab Part & Tool   Plain-English Purpose   What You Do in Lab 9\nPart A: Azure Monitor   Collects live performance graphs   Launch vm-mon, graph Percentage\n(Metrics), records who did what (Activity CPU, create an Alert Rule (> 80% for 5\nLog), and sends email/SMS alerts on   min) + Action Group ag-lab9, stress-\nspikes.   test CPU, and inspect Activity Log.\nPart B: Advisor &   Advisor gives personalized best-   Check Advisor’s 5 pillars and check\nService Health   practice tips; Service Health reports   Service Health → Health history for\noutages in Microsoft’s own datacenters.   Central India.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide ocal time: Last 24\nhours), click it, select Last hour, and click Apply.\n4. Observe the flat baseline CPU line (around 1%–5%) currently running on your idle VM.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 2 of 10\n\n────────────────────────────────────────\n\nStep 3: Create an Alert Rule (> 80% CPU) and Email Action Group ag-lab9\n1. In the left vertical menu of vm-mon (under Monitoring), click Alerts.\n2. At the top-left toolbar of the Alerts page, click + Create → select Alert rule.\n3. Tab 1 — Condition:\nUnder Signal name, click See all signals (or click directly on Percentage CPU if already\nlisted). In the side panel, select Percentage CPU and click Apply.\nScroll down to the Alert logic section and set:\nThreshold: Static\nOperator: Greater than\nAggregation type: Average\nThreshold value: Type 80 (for 80%).\nCheck every (Frequency): 1 minute.\nLookback period (Aggregation granularity): 5 minutes.\nClick Next : Actions > at the bottom-left.\n4. Tab 2 — Actions (Create Action Group ag-lab9):\nClick the + Create action group button.\nBasics tab: Resource group = rg-lab9-ROLLNO | Action group name = ag-lab9 | Display\nname = aglab9. Click Next : Notifications >.\nNotifications tab: Open the Notification type dropdown → select Email/SMS\nmessage/Push/Voice.\nIn the right-hand slide-out panel, check the Email checkbox, enter your email address, click\nOK, and enter Name = EmailMe.\nClick Review + create → Create. Confirm ag-lab9 now appears selected under Actions!\n5. Tab 3 — Details:\nSeverity: Select 2 - Warning (or 1 - Error).\nAlert rule name: Type High-CPU-Alert-Lab9.\n6. Click Review + create → Create. Wait ~30 seconds until the alert rule finishes saving. Take a\nscreenshot of the Alert rule summary (or Alerts → Alert rules list) for Verification!\nStep 4: SSH into vm-mon, Generate a 5-Minute CPU Spike & Check Email\n1. Restore your Cloud Shell (>_) terminal at the bottom of the screen and SSH into vm-mon using\nits Public IP from Step 1:\nssh azureuser@VM_PUBLIC_IP\n(Type yes if asked about the host fingerprint.)\n2. Once your prompt says azureuser@vm-mon:~$, run these three lines from your manual to\ngenerate 100% CPU load for 5 minutes (300 seconds) and then stop it:\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 3 of 10\n\n────────────────────────────────────────\n\nyes > /dev/null &\nsleep 300\nkill %1\nWhat each line does:\nyes > /dev/null & starts the Linux yes command in the background (&), continuously\nwriting output to /dev/null and driving CPU usage to 100%.\nsleep 300 pauses the terminal for exactly 300 seconds (5 minutes) while the CPU spike\nbuilds up across the 5-minute alert window.\nOnce 5 minutes pass and your prompt returns, run kill %1 to terminate the background CPU\nstress job cleanly, then type exit to leave SSH.\nWatch the Metrics graph rise: While sleep 300 is running, look at vm-mon → Monitoring →\nMetrics (with Percentage CPU and Last hour selected) and click Refresh every minute. You will\nsee the blue line jump sharply from ~2% up to ~100%! Take Screenshot #1 of this CPU spike\ngraph!\nCheck your Email Inbox (and Spam folder): Within 5–8 minutes, you will receive an automated\nemail from Microsoft Azure with subject “Azure: Activated Severity: 2 High-CPU-Alert-Lab9”.\nTake Screenshot #2 of this alert email!\nInspect the Activity Log: In the left vertical menu of vm-mon, scroll near the top and click\nActivity log. Expand the operation entries (such as Create or Update Virtual Machine /\nMicrosoft.Compute/virtualMachines/write) to see who created the VM, its timestamp, and\nstatus (Succeeded).\nOptional Step 5 (Log Analytics Workspace & KQL Query): If you have extra time, search for Log\nAnalytics workspaces → + Create inside rg-lab9-ROLLNO. Then open your Subscription (or VM) →\nActivity log → Export Activity Logs → + Add diagnostic setting, check Administrative, and send to your\nLog Analytics workspace. After ~10 minutes, open the workspace → Logs and run AzureActivity |\ntake 10 to query live activity events using Kusto Query Language (KQL).\n3. Part B: Review Azure Advisor & Service Health (Portal)\nStep 1: Review the 5 Pillars of Azure Advisor\n1. In the top-center Global Search Bar, type Advisor and click Advisor under Services.\n2. On the Advisor Overview dashboard, examine the five recommendation pillars and click into each\none in the left vertical menu:\nCost: Identifies idle/underutilized VMs, unattached disks, or Reserved Instance savings\nopportunities.\nSecurity: Integrates with Microsoft Defender for Cloud to flag open ports, missing MFA, or\nunencrypted storage.\nReliability: Recommends Availability Zones, VM backups, or disk redundancy to prevent\ndowntime.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 4 of 10\n\n────────────────────────────────────────\n\n3. Operational excellence: Suggests process improvements like Azure Policy governance,\ntagging, and Service Health alerts.\nPerformance: Flags CPU/memory bottlenecks, slow storage tiers, or database index\nimprovements.\nStep 2: Check Service Health & Health History for Central India\n1. In the top-center Global Search Bar, type Service Health and click Service Health under\nServices.\n2. In the left vertical menu of Service Health (under Active events), check Service issues, Planned\nmaintenance, and Health advisories.\n3. Next, under History in the left vertical menu, click Health history.\n4. Use the Region filter dropdown at the top to filter specifically for Central India and record any\nrecent incidents, planned maintenance, or advisories (or “No recent events”) in Section 6.\n4. Part C: Switch Between Bash and PowerShell in Cloud Shell\nAzure Cloud Shell lets you manage Azure using either Bash (Azure CLI) or PowerShell (Az\nPowerShell module) inside the exact same browser window:\n1. Open Cloud Shell (>_) at the top-right bar of the Portal. Confirm the top-left dropdown of the\nterminal toolbar currently shows Bash.\n2. Run the Azure CLI command to list all your resource groups:\naz group list --output table\n3. Now click the Bash dropdown at the top-left corner of the Cloud Shell toolbar and select\nPowerShell. Click Confirm in the popup dialog.\n4. Wait ~10 seconds until the prompt changes to PS /home/user>, then run the equivalent Azure\nPowerShell cmdlet:\nGet-AzResourceGroup | Format-Table ResourceGroupName, Location\n5. Compare both outputs—they query the exact same Azure Resource Manager backend and list the\nsame resource groups in different formats!\n6. Important: Click the PowerShell dropdown at the top-left of Cloud Shell and switch back to Bash\nbefore starting Part D.\n5. Part D: Declarative Deployment with an ARM Template (CLI + Portal)\nInstead of clicking through the Portal to build a Storage Account, you will now write an Azure\nResource Manager (ARM) JSON template and deploy it twice to observe idempotency.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 5 of 10\n\n────────────────────────────────────────\n\nStep 1: Create storage.json in the Cloud Shell Code Editor\n1. In Cloud Shell (Bash mode), run this command to open the built-in browser code editor:\ncode storage.json\n2. A visual text editor panel opens inside Cloud Shell. Copy and paste this exact JSON template into\nthe editor:\n{\n\"$schema\": \"https://schema.management.azure.com/schemas/2019-04-\n01/deploymentTemplate.json#\",\n\"contentVersion\": \"1.0.0.0\",\n\"parameters\": {\n\"storagePrefix\": { \"type\": \"string\", \"defaultValue\": \"stlab9\", \"maxLength\": 11\n}\n},\n\"variables\": {\n\"storageName\": \"[concat(parameters('storagePrefix'),\nuniqueString(resourceGroup().id))]\"\n},\n\"resources\": [\n{\n\"type\": \"Microsoft.Storage/storageAccounts\",\n\"apiVersion\": \"2023-01-01\",\n\"name\": \"[variables('storageName')]\",\n\"location\": \"[resourceGroup().location]\",\n\"sku\": { \"name\": \"Standard_LRS\" },\n\"kind\": \"StorageV2\",\n\"tags\": { \"Course\": \"E0416B\" }\n}\n],\n\"outputs\": {\n\"storageAccountName\": { \"type\": \"string\", \"value\": \"\n[variables('storageName')]\" }\n}\n}\n3. How to save and close the editor: Press Ctrl + S (to save), then press Ctrl + Q (to close\nthe editor)—or click the ... (three dots) icon at the top-right corner of the editor panel → click Save\n→ click Close Editor.\n4. Verify the file saved cleanly by running cat storage.json in Bash.\nStep 2: Deploy the ARM Template Twice & Verify Deployment History\nRun the deployment command the first time (replace ROLLNO with your roll number):\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 6 of 10\n\n────────────────────────────────────────\n\naz deployment group create --resource-group rg-lab9-ROLLNO --template-file\nstorage.json\nWait ~30 seconds. Azure generates a deterministic unique storage name starting with stlab9...\n(using uniqueString(resourceGroup().id)), creates the Storage Account with tag\nCourse=E0416B, and prints the generated name in the outputs section at the bottom of the\nJSON response!\nNow run the exact same deployment command a second time and list the deployments:\naz deployment group create --resource-group rg-lab9-ROLLNO --template-file\nstorage.json\naz deployment group list --resource-group rg-lab9-ROLLNO --output table\nObserve Idempotency: The second deployment finishes in just a few seconds with\nProvisioningState: Succeeded, and it does NOT create a second duplicate storage\naccount—because ARM checks the current state, sees the exact desired storage account already\nexists, and leaves it intact!\nVerify in the Azure Portal:\n1. Open Resource groups → rg-lab9-ROLLNO.\n2. On the Overview blade, verify your newly created stlab9... storage account appears\nalongside vm-mon.\n3. In the left vertical menu of rg-lab9-ROLLNO, click Deployments (under Settings) to view the\ndeployment history showing storage with Status: Succeeded. Take Screenshot #3 right\nhere!\n4. (Optional — Export template): Open vm-mon → scroll down the left menu to Automation →\nclick Export template to inspect the full ARM JSON blueprint Azure automatically generates\nfor any existing resource!\n6. Lab Record Table (Fill During Practical)\nLab Item to Record   Your Recorded Value / Observation\nvm-mon Public IP & Peak CPU %\nObserved\nAlert Rule Name & Action Group\nEmail\nService Health History (Central India)\nARM Template Output Storage\nAccount Name\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 7 of 10\n\n────────────────────────────────────────\n\n7. Verification & Screenshot Checklist\nCapture and paste these screenshots (with date and CLI commands used) into your lab journal\nbefore running Clean-up:\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n1   CPU metric spike & Alert rule   Portal → vm-mon → Monitoring → Metrics showing the\nPercentage CPU spike jumping near 100%, plus screenshot\nof the High-CPU-Alert-Lab9 rule in Alerts.\n2   Alert email received   Your email inbox showing the fired Azure Monitor alert\nnotification email triggered by Action Group ag-lab9.\n3   Successful ARM deployment &   Portal → rg-lab9-ROLLNO → Deployments showing\ncreated storage account   Succeeded (and Overview showing the stlab9...\nstorage account created by storage.json).\n8. Observation Questions & Complete Answers\nUse these structured, exam-ready answers for your lab journal and viva preparation:\nQuestion 1: What is Infrastructure as Code? List two benefits of ARM templates over\nclicking through the portal.\nInfrastructure as Code (IaC) is the practice of defining, provisioning, and managing cloud\ninfrastructure (networks, VMs, storage accounts, security rules) using human-readable, machine-\nexecutable configuration files (such as JSON or Bicep) rather than manual interactive clicks in a\nweb portal.\nTwo key benefits of ARM templates over clicking through the Portal:\n1. Consistency & Repeatability (Eliminates Human Error): The exact same template can\ndeploy identical Dev, Test, and Production environments hundreds of times without anyone\nforgetting a tag, region, or security setting.\n2. Version Control & Automated CI/CD Integration: Templates can be stored in Git repositories\nfor peer code review, change history tracking, rollback, and automated deployment via Azure\nDevOps or GitHub Actions—plus Azure orchestrates parallel resource creation automatically.\nQuestion 2: Why does deploying the same template twice not create duplicate resources\n(idempotency)?\nARM templates use a declarative model rather than an imperative script. Instead of telling Azure\n“step 1: create a new storage account”, the template declares the desired end state (“ensure a\nstorage account with this exact name, SKU, and tags exists in this resource group”). Because ARM\ndeployments are idempotent, when you run the template a second time, Azure Resource Manager\ncompares the template’s declared state against the resources already existing in the resource\ngroup. Seeing that the storage account already exists and matches the specification, Azure leaves\nit untouched (or applies only changed properties) instead of creating a duplicate.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 8 of 10\n\n────────────────────────────────────────\n\nQuestion 3: Compare Azure Monitor, Azure Advisor and Azure Service Health in one line\neach.\nAzure Service   One-Line Comparison\nAzure Monitor   Collects, analyzes, and alerts on real-time telemetry (metrics, logs, and activity\nlogs) from your own deployed Azure applications and resources.\nAzure Advisor   Analyzes your resource configurations and usage to provide personalized best-\npractice recommendations across Cost, Security, Reliability, Operational\nExcellence, and Performance.\nAzure Service Health   Provides personalized notifications and status reports about outages, planned\nmaintenance, and health advisories affecting Microsoft’s underlying global Azure\nplatform and regions.\nQuestion 4: What does Azure Arc add for servers running on-premises or in another\ncloud?\nAzure Arc extends the Azure Resource Manager (ARM) control plane outside of Azure so that\nphysical servers and VMs running in your on-premises datacenter, on edge devices, or in other\npublic clouds (such as AWS or Google Cloud) appear as first-class projected resources inside\nthe Azure Portal. Once connected via the lightweight Azure Connected Machine agent, you can\norganize, tag, govern with Azure Policy, monitor with Azure Monitor / Log Analytics, manage\nupdates, and apply RBAC across hybrid and multi-cloud servers from one unified Azure\ndashboard.\n9. Clean-up (Mandatory Before Closing Portal)\nOnce all screenshots are saved in your lab journal, run this command in Cloud Shell (Bash) (replace\nROLLNO with your roll number):\naz group delete --name rg-lab9-ROLLNO --yes --no-wait\nBecause both High-CPU-Alert-Lab9 and ag-lab9 were created inside rg-lab9-ROLLNO,\ndeleting the resource group removes the VM, storage account, alert rule, and action group\ntogether!\nDouble-check: Open Monitor → Alerts → Alert rules and Action groups in the Portal to confirm\nno leftover alert rules or action groups remain in any other resource group, and run az group\nlist --output table to confirm your subscription is completely clean.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 9 of 10\n\n────────────────────────────────────────\n\n10. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\nAlert email does not arrive after 5   Check two things: (1) Look in your email’s Spam / Junk folder for\nminutes   azure-noreply@microsoft.com; (2) Confirm you created the Alert\nrule before running yes > /dev/null & and let sleep 300 run for\nthe full 5 minutes.\ncode storage.json shows   Make sure every opening brace { and bracket [ was copied intact\nJSON syntax error on deploy   from Part D, Step 1, and that you pressed Ctrl + S before closing the\neditor.\naz deployment group   You forgot to switch Cloud Shell back from PowerShell to Bash after Part\ncreate says command not found   C! Click the top-left dropdown in Cloud Shell and select Bash.\nkill %1 says no such job   The background yes job already stopped or you opened a new terminal\nsession. Run pkill yes inside vm-mon (or exit SSH) to be 100%\nsure CPU load has stopped.\nE0416B Cloud Computing Lab • Lab 9 Beginner’s Step-by-Step Guide   Page 10 of 10"}</script>
