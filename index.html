  <script id="labs-data" type="application/json">{"1": "COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)\nLab 1: Azure Portal, Subscriptions, Resource\nGroups & Tags\nComplete Beginner’s Step-by-Step Practical Guide & Observation Solutions\nOutcome: CO1  |  Theory Alignment: Unit 2 & Unit 4  |  Estimated Time: 2 Hours\nAim: Explore the Azure Portal and organize resources using the Azure hierarchy and tags.\nPrerequisites: A working Microsoft Azure account (Azure for Students or Free account), a modern\nweb browser (Chrome or Edge), and access to Azure Cloud Shell.\nBefore You Start: 4 Golden Rules for Total Beginners\nReplace ROLLNO everywhere: Whenever a step or command shows ROLLNO, replace it\nwith your own lowercase roll number (for example, cfis042).\nStorage Account names are strict: Storage account names can contain only lowercase\nletters and numbers (3 to 24 characters, no hyphens or spaces) and must be globally\nunique across all Azure users worldwide.\nAlways choose Central India: Select Central India as your region unless your instructor\nspecifies a different region.\nTake screenshots & always clean up: Capture a screenshot at every verification\ncheckpoint for your lab journal, and run the Clean-up commands at the end so your free\ncredit is never wasted.\n1. Quick Orientation to the Azure Portal Screen\nIf this is your very first time opening Microsoft Azure, spend one minute learning where the main\ncontrols live on screen. Every step in this lab refers to these exact areas:\nScreen Element   Exact Location on Screen   What You Use It For\nPortal Menu (☰ )   Very top-left corner of the blue   Opens the slide-out navigation menu with\nheader bar (three horizontal lines)   Home, All services, Resource groups, and\nSubscriptions.\nGlobal Search Bar   Top center of the blue header bar   Fastest way to jump directly to any Azure\n(says Search resources, services,   service without hunting through menus.\nand docs)\nCloud Shell Icon (>_)   Top-right area of the blue header   Opens the built-in browser terminal (Bash /\nbar (square terminal icon)   PowerShell) used in Part B and Clean-up.\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 1 of 9\n\n────────────────────────────────────────\n\nScreen Element   Exact Location on Screen   What You Use It For\nNotifications Bell   Top-right area of the blue header   Shows live progress (“Deployment in\nbar (bell icon next to Settings gear)   progress” → “Deployment succeeded”) and\nquick links to newly created resources.\nLeft Resource Menu   Vertical sidebar along the left edge   Holds settings for that specific item, such\nwhenever you open a resource or   as Overview, Tags, Activity log, and\ngroup   Access control (IAM).\n2. Part A: Azure Portal (Click-by-Click Walkthrough)\nStep 1: Sign In and Locate Services Under All Services\n1. Open your web browser, type portal.azure.com in the address bar, and press Enter.\n2. Sign in with your Azure for Students (or free) email ID and password. Once signed in, you will land\non the Azure Home screen.\n3. Click the Portal Menu (☰) in the top-left corner, then click All services (alternatively, click the\ngreen All services icon in the top row of the Home page).\n4. On the All services page, look at the left category list under General (or use the filter box at the\ntop of the page) and locate these three core organizational services:\nSubscriptions (key icon)\nResource groups (blue cube icon)\nManagement groups (hierarchy folder icon)\nBeginner Tip: Hovering over any service in All services lets you click the star icon to pin it to your left menu\nfor quick access later.\nStep 2: Open Subscriptions and Record Your Account Details\n1. Click Subscriptions from the All services list (or type Subscriptions in the top-center Global\nSearch Bar and click Subscriptions under Services).\n2. You will see a table listing your active subscription (for example, Azure for Students or Azure\nsubscription 1).\n3. Click directly on your subscription name to open its Overview page.\n4. Find and write down the four required fields in the table below (and in your lab journal). Look in the\nEssentials panel at the top of the page; click Offer or check the right-hand column if Offer Type is\nshown there.\nField to Record   Where to Find It   Your Recorded Value\nSubscription Name   Top title of the page / first column in\nSubscriptions list\nSubscription ID   Essentials panel (long letters-and-\nnumbers code; click the copy icon to\ncopy it)\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 2 of 9\n\n────────────────────────────────────────\n\nField to Record   Where to Find It   Your Recorded Value\nOffer Type   Essentials panel (e.g., Azure for\nStudents / Free Trial)\nStatus   Essentials panel (should show\nActive)\nStep 3: Create Resource Group rg-lab1-ROLLNO with Tags\nA Resource Group is like a project folder in Azure that holds all related cloud resources together.\n1. Click the top-center Global Search Bar, type Resource groups, and click Resource groups.\n2. Near the top-left of the Resource groups page, click the + Create button.\n3. On the Basics tab, fill in these three fields:\nSubscription: Leave your active subscription selected.\nResource group: Type rg-lab1-ROLLNO (replace ROLLNO with your roll number, e.g., rg-\nlab1-cfis042).\nRegion: Open the dropdown, scroll to Asia Pacific, and select (Asia Pacific) Central India.\n4. Click the Next : Tags > button at the bottom-left (or click the Tags tab near the top).\n5. Enter the three exact Name–Value pairs below. After typing a row, a blank row automatically\nappears underneath:\nName (Key)   Value   Purpose\nCourse   E0416B   Identifies the Cloud Computing Lab\ncourse\nDept   CFIS   Identifies your department for\nreporting/cost grouping\nOwner   [Your Roll Number]   Identifies who owns this resource\ngroup\n6. Click Review + create at the bottom. Wait 2 seconds for the green Validation passed banner to\nappear at the top.\n7. Click Create. Your resource group is created almost instantly and appears in the Resource groups\nlist (click Refresh at the top if you do not see it immediately).\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 3 of 9\n\n────────────────────────────────────────\n\nStep 4: Create a Storage Account Inside Your Resource Group\n1. In the Resource groups list, click on your newly created rg-lab1-ROLLNO to open it.\n2. Inside the resource group page, click the + Create button near the top-left toolbar. This opens the\nAzure Marketplace.\n3. In the Marketplace search bar, type Storage account and press Enter.\n4. Find the card titled Storage account (published by Microsoft) and click Create → Storage\naccount.\n5. On the Basics tab, verify and enter the following settings carefully:\nSubscription: Your active subscription (auto-filled).\nResource group: Confirm it says rg-lab1-ROLLNO (auto-filled because you clicked Create\nfrom inside the group).\nStorage account name: Type an all-lowercase name such as stlab1rollno (no hyphens, no\nuppercase, no spaces). If Azure shows a red message saying the name is already taken, add\ntwo extra digits at the end (e.g., stlab1rollno99).\nRegion: Select (Asia Pacific) Central India.\nPerformance: Select Standard.\nRedundancy: Open the dropdown and select Locally-redundant storage (LRS).\n6. Leave all other tabs (Advanced, Networking, Data protection, Encryption, Tags) at their default\nvalues—do not add tags here so you can test tag inheritance in Step 5.\n7. Click the blue Review (or Review + create) button at the bottom-left.\n8. Once validation succeeds, click Create. Deployment takes about 30 to 60 seconds. Watch the\nNotifications Bell at the top-right until it says Your deployment is complete.\nStep 5: Compare Tags on the Resource Group vs. the Storage Account\n1. Go back to your resource group: click Resource groups from the search bar (or breadcrumb trail\nat the top-left) and click rg-lab1-ROLLNO.\n2. In the left vertical menu of rg-lab1-ROLLNO, click Tags. You will clearly see all three tags you\nadded: Course = E0416B, Dept = CFIS, and Owner = [Your Roll Number]. Take a\nscreenshot here for Verification.\n3. In the left vertical menu, click Overview. Scroll down slightly to the Resources list and click your\nstorage account (stlab1rollno).\n4. Now, in the left vertical menu of your storage account, click Tags.\n5. Observe the result: The Tags list on the storage account is completely empty!\nKey Concept to Remember for Viva: Tags applied to a Resource Group are not automatically inherited by\nthe resources inside it. If you want resources to have tags, you must tag them individually (or enforce tags\nautomatically using Azure Policy in Lab 7).\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 4 of 9\n\n────────────────────────────────────────\n\nStep 6: Open Management Groups and Observe Tenant Root Group\n1. Click the top-center Global Search Bar, type Management groups, and click Management\ngroups under Services.\n2. Look at the hierarchy displayed on screen and note the Tenant Root Group (the top-most parent\ncontainer above your subscription).\n3. If you see an access/permission message instead: Many student or university-managed\naccounts do not grant permission to view or create Management Groups. That is completely\nnormal—read the exact message shown on screen (for example, “You do not have permission to\nview management groups” or “Start using Management Groups”) and write it down in the box\nbelow for your journal.\nStep 6 Observation Record (Tenant Root Group Name or Permission Message Seen)\n3. Part B: Azure CLI in Cloud Shell (Step-by-Step)\nInstead of clicking buttons in the Portal, cloud engineers often manage Azure by typing short\ncommands in the Azure CLI (Command-Line Interface). You do not need to install anything on your\nlaptop—Azure provides a built-in terminal called Cloud Shell right inside your browser.\nFirst-Time Setup: How to Open Azure Cloud Shell\n1. Look at the top-right corner of the blue Azure Portal header bar and click the Cloud Shell icon\n(>_) (a small square icon with a greater-than sign and underscore).\n2. A dark terminal panel will slide up from the bottom half of your browser window.\n3. If asked to choose between Bash and PowerShell, click Bash.\n4. If a popup asks about mounting storage (first time only), select your subscription and choose No\nstorage account required (if available) or click Mount storage account / Create storage and\npick Central India. Wait 15–60 seconds until you see a prompt like user@Azure:~$.\n5. How to paste commands into Cloud Shell: Standard Ctrl+V sometimes fails in browser\nterminals. Use Right-click → Paste inside the black terminal area, or press Ctrl + Shift + V\n(Windows/Linux) / Cmd + V (Mac).\nRun the 5 Lab Commands One by One\nRemember to replace ROLLNO with your own lowercase roll number before pressing Enter after each\ncommand.\nCommand 1: Display Your Current Subscription Information\naz account show --output table\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\nWhat it does: Shows the active Azure subscription currently linked to your Cloud Shell session in a\nclean, readable table format (Name, CloudName, SubscriptionId, State, IsDefault).\nCommand 2: Create a Second Resource Group Using CLI\naz group create --name rg-lab1b-ROLLNO --location centralindia --tags\nCourse=E0416B Dept=CFIS\nWhat it does: Creates a new resource group named rg-lab1b-ROLLNO in the centralindia\nregion and attaches two tags (Course=E0416B and Dept=CFIS) in a single command. You will see\nJSON output with \"provisioningState\": \"Succeeded\".\nCommand 3: List All Resource Groups in Your Subscription\naz group list --output table\nWhat it does: Lists every resource group in your account as a table. Confirm that both rg-lab1-\nROLLNO (from Part A) and rg-lab1b-ROLLNO (from Command 2) appear with location\ncentralindia.\nCommand 4: List All Resources Inside rg-lab1-ROLLNO\naz resource list --resource-group rg-lab1-ROLLNO --output table\nWhat it does: Displays all Azure services inside your Part A resource group. You should see your\nstorage account (stlab1rollno) with Type Microsoft.Storage/storageAccounts.\nCommand 5: Apply the Tag Env=Lab to Your Storage Account\naz resource tag --tags Env=Lab --ids $(az storage account list --resource-group\nrg-lab1-ROLLNO --query [0].id --output tsv)\nHow this command works (plain English):\nThe inner part inside $( ... ) runs first: it finds the first storage account ([0]) inside rg-\nlab1-ROLLNO and returns its exact internal Azure Resource ID as plain text (--output tsv).\nThe outer command az resource tag --tags Env=Lab --ids ... takes that ID and attaches\nthe tag Env=Lab directly to your storage account.\nExpected output: JSON text showing your storage account details with \"tags\": { \"Env\":\n\"Lab\" }.\nVerify Command 5: Re-run az resource list --resource-group rg-lab1-ROLLNO --output\ntable (or refresh the Tags blade of your storage account in the Portal) to see Env=Lab now attached!\nTake a screenshot of your Cloud Shell output here.\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\n4. Verification & Screenshot Checklist\nYour lab evaluation rubric awards 20% of marks specifically for verification evidence. Capture and\npaste these screenshots (with date and commands used) into your lab journal before running Clean-\nup:\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n1   Resource group appears under   Portal screen showing rg-lab1-ROLLNO in Resource groups\nResource groups with all three tags and its Tags blade displaying Course=E0416B,\nDept=CFIS, and Owner=[ROLLNO].\n2   Tag non-inheritance comparison   Storage account (stlab1rollno) Tags blade before CLI\n(Part A, Step 5)   tagging (showing no tags) to prove group tags did not auto-copy.\n3   az resource list shows your Cloud Shell terminal showing Commands 1–5 output,\nstorage account and its tags now   specifically the az resource tag result showing \"Env\":\ninclude Env = Lab   \"Lab\" and the storage account listed via az resource\nlist.\n5. Observation Questions & Complete Answers\nUse these complete, concept-accurate answers to write your lab journal responses and prepare for\nyour viva.\nQuestion 1: Draw the Azure resource hierarchy (Management group, Subscription,\nResource group, Resource) using what you saw.\nLevel 1 — Management Group (e.g., Tenant Root Group)\nTop-level organizational container that groups multiple subscriptions to apply enterprise-wide\npolicies and governance.\n↓ contains one or more\nLevel 2 — Subscription (e.g., Azure for Students / Free Account)\nLogical billing and access boundary associated with your Azure account and credits.\n↓ contains one or more\nLevel 3 — Resource Group (e.g., rg-lab1-ROLLNO, rg-lab1b-ROLLNO)\nLogical folder grouping related resources that share a common lifecycle (Tags:\nCourse=E0416B, Dept=CFIS, Owner=ROLLNO).\n↓ contains one or more\nLevel 4 — Resource (e.g., Storage Account stlab1rollno)\nIndividual Azure service instance deployed and managed inside a resource group\n(Tag added via CLI: Env=Lab).\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nHierarchy Rule Note: Permissions (RBAC) and Azure Policies flow downward from parent levels to child\nlevels, whereas Tags do not inherit automatically.\nQuestion 2: Why must every resource belong to exactly one resource group?\nEvery Azure resource must belong to exactly one resource group to establish a single,\nunambiguous management and lifecycle boundary. If a resource could belong to multiple\nresource groups at once, deleting or modifying one group could accidentally break another project,\nand conflicting access permissions or cost reports would occur. Having a strict one-to-one\nownership rule ensures clean deployment, clear Role-Based Access Control (RBAC), organized\nmonitoring, and predictable bulk deletion. (Note: A resource can be moved to another resource\ngroup later, and resources inside one group can reside in different Azure regions if needed.)\nQuestion 3: What happens to the resources when a resource group is deleted?\nWhen a resource group is deleted, every resource inside that resource group is permanently\ndeleted along with it. Because a resource group acts as a shared lifecycle container, Azure\ncascades the deletion to all contained services—such as storage accounts, virtual machines,\ndisks, and networks—and stops any ongoing billing charges for those resources. This operation\ncannot be undone, which is why Azure asks for confirmation before deleting a resource group and\nwhy deleting the resource group is the fastest, safest way to clean up at the end of a lab.\nQuestion 4: List two factors that influence your choice of region.\n1. Proximity to Users (Network Latency): Selecting a region geographically close to your end\nusers—such as Central India for users in India—minimizes network travel distance, resulting in\nlower latency and faster response times.\n2. Pricing (Cost Differences): Azure service costs vary across regions due to differences in local\nelectricity, real estate, infrastructure, and tax rates. Choosing a cost-effective region helps\nreduce cloud spend.\nAdditional factors (useful for Viva): Data Residency & Compliance (laws requiring data to remain\nwithin a specific country) and Service Availability (certain specialized VM sizes or new Azure\nfeatures are available only in specific regions).\n6. Clean-up (Mandatory Before Closing Portal)\nAlways run these two commands in Cloud Shell (Bash) once you have taken all verification\nscreenshots. Replace ROLLNO with your roll number:\naz group delete --name rg-lab1b-ROLLNO --yes --no-wait\naz group delete --name rg-lab1-ROLLNO --yes --no-wait\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\nWhat --yes means: Skips the “Are you sure you want to perform this operation? (y/n)” prompt.\nWhat --no-wait means: Starts deleting the resource group in the background and immediately\ngives you back your terminal prompt instead of making you wait 1–2 minutes.\nConfirm Clean-up: After 2 minutes, run az group list --output table (or refresh the\nResource groups page in the Portal) to verify that neither rg-lab1-ROLLNO nor rg-lab1b-\nROLLNO remains.\n7. Beginner Troubleshooting Quick Reference\nCommon Beginner Error   Why It Happens & How to Fix It\n“Storage account name is already   Storage names must be unique across all Azure users globally. Add 2–4\ntaken”   random numbers to the end (e.g., stlab1cfis0429).\n“Name can only contain lowercase   Remove any capital letters, hyphens (-), underscores (_), or spaces\nletters and numbers”   from the storage account name.\nResourceGroupNotFound in   You either typed ROLLNO literally instead of your roll number, or had a\nCLI   small spelling typo. Run az group list --output table to see\nexact names.\nCommand 5 fails with --ids error Make sure your storage account finished deploying inside rg-lab1-\nROLLNO first, and copy the entire command on one single line.\nPermission denied on Management   Normal on university/student accounts. Simply record the exact message\nGroups   shown in Step 6—no points are deducted.\nE0416B Cloud Computing Lab • Lab 1 Beginner’s Step-by-Step Guide   Page 9 of 9", "2": "COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)\nLab 2: Deploying Windows and Linux Virtual\nMachines\nComplete Beginner’s Step-by-Step Practical Guide & Observation Solutions\nOutcome: CO2  |  Theory Alignment: Unit 2  |  Estimated Time: 3 Hours\nAim: Deploy a Windows Server VM and an Ubuntu Linux VM, connect to them, and install web\nservers.\nPrerequisites: Lab 1 completed; an RDP client (Windows Remote Desktop Connection is already\nbuilt into Windows; Mac users can install Windows App from the App Store) and an SSH client (Azure\nCloud Shell already has ssh built in).\nBefore You Start: Crucial Credit & Security Tips for Lab 2\nVirtual Machines consume free credits every minute they run: Never close your browser\nat the end of this lab without running the Clean-up step (deallocate and delete rg-lab2-\nROLLNO).\nWrite down your Windows VM username and password: You will need them 5 minutes\nlater to log into the Windows VM via Remote Desktop (RDP). Do not share VM passwords\nwith anyone.\nIf Standard_B2s or Standard_B1s shows unavailable in Central India: Click See all\nsizes and choose another available B-series size (such as Standard_B2ls_v2 or\nStandard_B2ms) as permitted by your lab manual.\nUse http:// (not https://) when testing your web servers: Port 80 serves plain\nHTTP. If your browser auto-redirects to https://, manually edit the address bar to start\nwith http://.\n1. Plain-English Overview of What You Will Build\nA Virtual Machine (VM) is a complete computer (CPU, RAM, hard disk, and operating system)\nrunning inside Microsoft’s data center in Central India. In this lab you will build two cloud computers\ninside one resource group (rg-lab2-ROLLNO):\nLab Part   Virtual Machine   How You Connect   Web Server Installed & Test\nPart A (Portal)   Windows Server 2022   RDP (Remote Desktop,   IIS (Internet Information Services)\n(Standard_B2s)   Port 3389) — full   via PowerShell → open\ngraphical Windows   http://PUBLIC_IP\ndesktop\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 1 of 9\n\n────────────────────────────────────────\n\nLab Part   Virtual Machine   How You Connect   Web Server Installed & Test\nPart B (CLI)   Ubuntu 22.04 Linux   SSH (Secure Shell, Port   Apache2 via apt → open\n(Standard_B1s)   22) — text command-   http://PUBLIC_IP\nline login from Cloud Shell\n2. Part A: Deploy & Configure Windows Server VM (Azure Portal)\nStep 1: Create Resource Group rg-lab2-ROLLNO\n1. Sign in at portal.azure.com.\n2. Click the top-center Global Search Bar, type Resource groups, and click Resource groups.\n3. Click + Create near the top-left.\n4. Set Resource group to rg-lab2-ROLLNO (replace ROLLNO with your lowercase roll number,\ne.g., rg-lab2-cfis042) and Region to (Asia Pacific) Central India.\n5. Click Review + create, then click Create.\nStep 2: Create the Windows Server 2022 Virtual Machine\n1. In the top-center Global Search Bar, type Virtual machines and click Virtual machines under\nServices.\n2. At the top-left of the Virtual machines page, click + Create, then select Azure virtual machine\nfrom the dropdown menu.\n3. Fill in the Basics tab carefully from top to bottom:\nSubscription: Keep your active Azure for Students / Free subscription selected.\nResource group: Open the dropdown and select rg-lab2-ROLLNO.\nVirtual machine name: Type a clean name such as vm-win-ROLLNO (must be 15 characters\nor fewer for Windows!).\nRegion: Select (Asia Pacific) Central India.\nAvailability options: Leave default (No infrastructure redundancy required is fine for lab\npractice; take a quick look at the dropdown options because Question 3 asks about them!).\nSecurity type: Leave default (Trusted launch virtual machines or Standard).\nImage: Click the dropdown and select Windows Server 2022 Datacenter: Azure Edition -\nx64 Gen2. (If it is not in the short list, click “See all images” and search for it.)\nSize: Click the dropdown (or See all sizes) and select Standard_B2s (2 vCPUs, 4 GiB\nmemory). (If unavailable, choose another B-series size.)\n4. Scroll down to the Administrator account section on the same Basics tab:\nUsername: Enter a simple admin username such as azureadmin (do not use admin or\nadministrator—Azure blocks those common names).\nPassword & Confirm password: Enter a strong password that is at least 12 characters long\nand includes uppercase, lowercase, a number, and a symbol. Write it down in your lab record\ntable below.\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 2 of 9\n\n────────────────────────────────────────\n\n5. Scroll down to Inbound port rules:\nPublic inbound ports: Select Allow selected ports.\nSelect inbound ports: Open the dropdown and check ONLY RDP (3389). Do not check HTTP\n(80) yet—you will open Port 80 manually in Step 6 to practice firewall rules.\n6. Click Next : Disks > at the bottom-left (or click the Disks tab at the top).\nUnder OS disk type, verify that Standard SSD (locally-redundant storage) is selected.\n7. Click the blue Review + create button at the bottom-left. Wait for the green Validation passed\nbanner at the top, then click Create.\n8. Wait 2 to 4 minutes while Azure builds the VM. When the page says Your deployment is\ncomplete, click the blue Go to resource button.\nStep 3: Connect to the Windows VM Using RDP\n1. You are now on your Windows VM’s Overview blade. Look at the right side of the Essentials\npanel and note down the Public IP address (you will need it for Step 6). Keep this Overview\nscreen in mind—you will screenshot it for Verification.\n2. Look at the top toolbar of the Overview page and click Connect → Connect (or click Connect in\nthe left vertical menu under Connect).\n3. In the Connect screen, locate the Native RDP card and click the blue Select button (or click the\nRDP tab if using the classic Connect layout).\n4. Click Download RDP File. A small .rdp file downloads to your computer.\n5. Double-click the downloaded .rdp file to launch Remote Desktop Connection:\nIf a popup says “The publisher of this remote connection can’t be identified”, click Connect.\nWhen asked for credentials, click More choices → Use a different account, type the\nUsername and Password you created in Step 2, and click OK.\nIf a certificate warning appears (“The identity of the remote computer cannot be verified”), click\nYes.\n6. Wait 15–30 seconds for the Windows Server desktop to load inside the Remote Desktop window.\nIf a blue side popup asks about Networks, click No. If Server Manager opens automatically, you\ncan minimize it.\nStep 4: Install the IIS Web Server Inside the Windows VM\n1. Inside the remote Windows Server desktop, click the Start button (Windows icon at the bottom-\nleft corner of the remote screen).\n2. Type PowerShell on your keyboard. Right-click Windows PowerShell in the search results and\nselect Run as administrator.\n3. In the blue PowerShell window, type (or copy-paste) this exact command and press Enter:\nInstall-WindowsFeature -Name Web-Server -IncludeManagementTools\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 3 of 9\n\n────────────────────────────────────────\n\n4. Wait 1 to 2 minutes as a progress bar fills up across the top of the PowerShell window. When\nfinished, confirm the output table shows Success: True and Exit Code: Success.\n5. You can now close the Remote Desktop window (click the X on the blue top RDP bar and click\nOK)—your Windows VM continues running in the cloud.\nStep 5: Open Port 80 (HTTP) in Azure Portal and Test IIS\nRight now, IIS is running inside your Windows VM, but Azure’s virtual firewall (Network Security\nGroup) blocks web traffic on Port 80. Let us allow Port 80:\n1. Return to the Azure Portal browser tab showing your Windows VM.\n2. In the left vertical menu of your VM, look under the Networking group and click Network settings\n(labeled Networking in older portal layouts).\n3. In the main area under the Rules tab, click the + Create port rule button on the right, then click\nInbound port rule.\n4. A panel slides out from the right edge. Fill in only these key fields (leave Source, Source port\nranges, and Destination as Any for this lab step):\nDestination port ranges: Delete 8080 and type 80.\nProtocol: Select TCP.\nAction: Confirm Allow is selected.\nPriority: Keep the suggested number (for example, 310 or 1010).\nName: Type Allow-HTTP-80.\n5. Click Add at the bottom of the panel and wait ~15 seconds for the rule to save.\n6. Open a new browser tab, type http://PUBLIC_IP (replacing PUBLIC_IP with your Windows\nVM’s Public IP from Step 3), and press Enter.\n7. Success check: You should see the blue Internet Information Services (IIS) welcome banner!\nTake a screenshot of this browser window (including the IP in the address bar) for\nVerification.\n3. Part B: Deploy & Configure Linux VM (Azure CLI in Cloud Shell)\nNow you will deploy an Ubuntu 22.04 Linux VM into the exact same resource group (rg-lab2-\nROLLNO) using just a few fast commands in Cloud Shell.\nStep 1: Open Azure Cloud Shell (Bash)\n1. Click the Cloud Shell icon (>_) at the top-right of the blue Azure Portal header bar.\n2. Confirm the dropdown at the top-left of the terminal panel says Bash.\nStep 2: Create the Ubuntu Linux VM and Open Port 80\nRun the following three commands one at a time (replace ROLLNO with your roll number):\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 4 of 9\n\n────────────────────────────────────────\n\naz vm create --resource-group rg-lab2-ROLLNO --name vm-linux --image Ubuntu2204 --\nsize Standard_B1s --admin-username azureuser --generate-ssh-keys --public-ip-sku\nStandard\nWait 1–2 minutes while Azure creates the VM, generates an SSH key pair inside your Cloud\nShell home directory (~/.ssh/id_rsa), and prints JSON output containing publicIpAddress.\nNote: If Azure reports that Standard_B1s is unavailable in Central India, change --size\nStandard_B1s to another available B-series size such as Standard_B2s or Standard_B2ls_v2.\naz vm open-port --resource-group rg-lab2-ROLLNO --name vm-linux --port 80\nWhat it does: Automatically creates an inbound Network Security Group rule allowing HTTP traffic\non Port 80 to vm-linux (doing in 1 second what took several clicks in Part A!).\naz vm list-ip-addresses --resource-group rg-lab2-ROLLNO --output table\nWhat it does: Prints a clean table listing both your Windows VM and vm-linux along with their\nPublic IP and Private IP addresses. Copy the PublicIPAddresses value for vm-linux.\nStep 3: Connect to the Linux VM via SSH and Install Apache\n1. In Cloud Shell, run the SSH command below, replacing PUBLIC_IP with the Public IP of vm-\nlinux:\nssh azureuser@PUBLIC_IP\n2. The first time you connect, Linux displays: “Are you sure you want to continue connecting\n(yes/no/[fingerprint])?” Type yes and press Enter.\n3. Your prompt will change from user@Azure:~$ to azureuser@vm-linux:~$ — you are now\nlogged inside your cloud Ubuntu server!\n4. Run these three commands inside the Linux VM one by one:\nsudo apt update\nsudo apt install apache2 -y\nsystemctl status apache2\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\nWhat each command does: sudo apt update refreshes Ubuntu’s package list; sudo apt\ninstall apache2 -y downloads and installs the Apache web server without asking for\nconfirmation; systemctl status apache2 checks that Apache is running (look for green text\nsaying active (running)).\nHow to exit the status screen: Press the letter q on your keyboard to return to the prompt, then\ntype exit and press Enter to leave SSH and return to Cloud Shell.\nStep 4: Test the Apache Web Page in Your Browser\n1. Open a new browser tab, type http://PUBLIC_IP (using vm-linux’s Public IP), and press\nEnter.\n2. Success check: You will see the red-and-white Apache2 Default Page (“It works!”). Take a\nscreenshot for Verification.\nOptional Step (Connect via PuTTY): If your instructor asks you to connect from Windows using PuTTY\ninstead of Cloud Shell, run cat ~/.ssh/id_rsa in Cloud Shell to view your private key, save it on your PC\nas a .pem file, convert it to a .ppk file using PuTTYgen, and load it under PuTTY → Connection → SSH\n→ Auth → Credentials before connecting to azureuser@PUBLIC_IP.\n4. Lab Record Table (Fill During Practical)\nRecord your live deployment details below before taking screenshots and running Clean-up:\nWeb Server\nVM Name   OS / Image   VM Size   Public IP Address\nStatus\nWindows VM   Win Server 2022\nvm-linux   Ubuntu 22.04\n5. Verification & Screenshot Checklist\nBefore running Clean-up, verify and capture these four screenshots for your lab journal (include the\ndate and CLI commands used):\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n1   IIS page loads from the Windows   Browser window showing http://[Windows_PUBLIC_IP]\nVM   and the blue IIS Welcome page.\n2   Apache page loads from the Linux   Browser window showing http://[Linux_PUBLIC_IP]\nVM   and the Apache2 Default Page.\n3   Windows VM Overview blade   Azure Portal → Virtual machines → your Windows VM →\nOverview showing Size, Public IP address, and Status:\nRunning.\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n4   Linux VM Overview blade   Azure Portal → Virtual machines → vm-linux → Overview\nshowing Size, Public IP address, and Status: Running (plus\noptional Cloud Shell output of systemctl status\napache2).\n6. Observation Questions & Complete Answers\nUse these detailed answers for your lab journal and viva preparation:\nQuestion 1: Which service model (IaaS, PaaS or SaaS) are VMs? Who is responsible for\nOS patching?\nVirtual Machines belong to the Infrastructure as a Service (IaaS) cloud service model. Under\nMicrosoft Azure’s Shared Responsibility Model for IaaS, Microsoft manages the physical\ndatacenter, physical network, physical hosts, and virtualization hypervisor, whereas the customer\n(user) is responsible for OS patching, updating installed applications (such as IIS and Apache),\nconfiguring firewall/NSG rules, and securing the data inside the VM.\nQuestion 2: Compare Stopped and Stopped (deallocated). Which one stops compute\ncharges?\nAspect   Stopped (OS Shutdown)   Stopped (Deallocated)\nHow it happens   Shutting down from inside the VM OS   Clicking Stop in the Azure Portal or\n(e.g., Windows Start → Shut down or   running az vm deallocate in Azure\nsudo shutdown).   CLI.\nHardware allocation   Azure keeps physical CPU and RAM   Azure releases the physical compute\nhardware reserved for your VM.   hardware back to its shared pool.\nCompute charges   Still billed! Compute charges continue   Compute charges stop! Only minimal\neven though the OS is off.   storage/disk (and static IP) charges\nremain.\nDynamic Public IP   Retained while in Stopped state.   Released unless a Static Public IP is\nassigned.\nDirect Answer: Stopped (deallocated) is the state that stops compute (CPU/RAM) billing charges.\nQuestion 3: In the Availability options of the Create VM page, what is the difference\nbetween Availability zone, Availability set and Virtual Machine Scale Set?\nAvailability Option   How It Works   What Failure / Need It Solves\nAvailability Zone   Places VMs across physically separate   Protects against an entire\ndatacenters within the same Azure region, each datacenter outage (highest high-\nwith independent power, cooling, and   availability SLA, 99.99% with 2+\nnetworking.   zones).\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nAvailability Option   How It Works   What Failure / Need It Solves\nAvailability Set   Logically groups VMs inside a single datacenter Protects against rack hardware\nacross separate Fault Domains (different   failures and planned Microsoft\nserver racks/power) and Update Domains   maintenance inside one\n(staggered maintenance reboots).   datacenter.\nVirtual Machine Scale   Automatically creates, manages, and load-   Provides elasticity, auto-scaling,\nSet (VMSS)   balances a group of identical VMs that scale out and centralized management\n(add VMs) or scale in (remove VMs) based on   for variable workloads.\nCPU/traffic demand.\nQuestion 4: Why is opening RDP or SSH to Any source risky?\nRDP (TCP Port 3389) and SSH (TCP Port 22) are administrative management ports that grant\ndirect system login access. Allowing Any source IP (0.0.0.0/0) exposes those ports to the entire\npublic internet, where automated bots continuously scan cloud IP ranges within minutes of a VM\nlaunching. This creates high risk of brute-force and credential-stuffing attacks, exploitation of\nunpatched remote-access vulnerabilities, ransomware deployment, or cryptojacking. Best practice\n(especially in cybersecurity) is to restrict the source IP to your own IP address, use SSH keys\ninstead of passwords, or use Azure Bastion / Just-In-Time (JIT) VM access.\n7. Clean-up (Mandatory Before Closing Portal)\nOnce all four screenshots are saved in your lab journal, run both commands below in Cloud Shell\n(Bash) (replace ROLLNO with your roll number):\naz vm deallocate --resource-group rg-lab2-ROLLNO --name vm-linux\naz group delete --name rg-lab2-ROLLNO --yes --no-wait\nWhy two commands? The first command practices properly deallocating a running VM (Stopped\n(deallocated)) so compute billing stops immediately. The second command deletes the entire\nresource group—removing both VMs, their managed disks, public IPs, virtual network, and NSGs\ncleanly in one shot.\nConfirm Clean-up: After 2–3 minutes, check Virtual machines in the Azure Portal or run az\ngroup list --output table in Cloud Shell to confirm rg-lab2-ROLLNO is gone.\n8. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\nSkuNotAvailable when   Your chosen size (Standard_B2s or Standard_B1s) is temporarily\ncreating VM   out of capacity in Central India. Select another available B-series size\n(e.g., Standard_B2ls_v2).\nBrowser times out on   Check two things: (1) You typed http:// and not https://; (2) Port\nhttp://PUBLIC_IP   80 is actually allowed in the VM’s Networking / Network settings\ninbound rules.\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\nCommon Beginner Issue   Why It Happens & How to Fix It\nRDP login says “Credentials did not   Click More choices → Use a different account and type only your VM\nwork”   username (e.g., .\\azureadmin) instead of your Microsoft email\naddress.\nWindows VM name rejected   Windows computer names cannot exceed 15 characters and cannot\ncontain spaces or special symbols (use a short name like vm-win-\n042).\nStuck on systemctl status   The output viewer pauses at the bottom (lines 1-14/14 (END)).\napache2   Simply press the q key on your keyboard to quit back to the command\nprompt.\nE0416B Cloud Computing Lab • Lab 2 Beginner’s Step-by-Step Guide   Page 9 of 9", "3": "COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)\nLab 3: Virtual Networks, Subnets and Network\nSecurity Groups\nComplete Beginner’s Step-by-Step Practical Guide & Observation Solutions\nOutcome: CO2  |  Theory Alignment: Unit 2  |  Estimated Time: 3 Hours\nAim: Build a Virtual Network (VNet) with two subnets, place VMs in them, and control traffic with\nNetwork Security Group (NSG) rules.\nPrerequisites: Labs 1 and 2 completed; basic idea of IP addressing and CIDR notation (explained\nsimply below).\nBefore You Start: 4 Essential Beginner Tips for Lab 3\nReplace ROLLNO in every command: Use your lowercase roll number (for example, rg-\nlab3-cfis042).\nKeep TWO areas visible during Part C: You can minimize/resize Cloud Shell at the bottom\nof the browser (or open portal.azure.com in a second browser tab) so your SSH session\ninside vm-web stays open while you click through the Portal.\nWait 30–60 seconds after changing an NSG rule: Azure takes a short moment to push\nfirewall updates down to the virtual network card. If ping still succeeds 2 seconds after\nsaving a Deny rule, wait 30 seconds and run ping again.\nTwo VMs = double credit burn if forgotten: Always run the single Clean-up command at\nthe end once you finish taking screenshots.\n1. Plain-English Overview: What You Are Building\nThink of an Azure Virtual Network (VNet) like a private office building in the cloud. Inside that\nbuilding you create separate rooms called Subnets, and at the doorway of each room you place a\nsecurity guard called a Network Security Group (NSG) that checks a list of Allow/Deny rules for\nevery network packet.\nVirtual Network: vnet-lab3 — Address Space: 10.10.0.0/16 (65,536 private IP addresses)\nRoom 1 — Web Subnet: snet-web (10.10.1.0/24 → 251 usable Azure IPs)\nSecurity Guard: nsg-web (Allows Inbound HTTP Port 80 & SSH Port 22 from Internet)\nVM Inside: vm-web (Ubuntu Linux — has a Public IP so you can SSH into it, plus a Private\nIP like 10.10.1.4)\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 1 of 9\n\n────────────────────────────────────────\n\nRoom 2 — Application Subnet: snet-app (10.10.2.0/24 → 251 usable Azure IPs)\nSecurity Guard: None at first → later you attach nsg-app (Denies ICMP ping from\n10.10.1.0/24)\nVM Inside: vm-app (Ubuntu Linux — NO Public IP! Only a Private IP like 10.10.2.4)\nQuick CIDR Refresher: In 10.10.0.0/16, the first two numbers (10.10) are fixed for the whole VNet. In\n10.10.1.0/24 and 10.10.2.0/24, the first three numbers are fixed, giving each subnet its own isolated\nrange of addresses. Azure reserves 5 IPs per subnet for internal management, so your first VM always starts\nat .4 (e.g., 10.10.1.4 and 10.10.2.4).\n2. Part A: Create the Network, Subnets & Web NSG (Cloud Shell CLI)\nSign in at portal.azure.com, click the Cloud Shell icon (>_) at the top-right of the blue bar, and\nconfirm you are in Bash mode. Run the 7 commands below one by one (remember to replace\nROLLNO with your roll number):\nStep 1: Create the Resource Group\naz group create --name rg-lab3-ROLLNO --location centralindia\nCreates the project folder rg-lab3-ROLLNO in Central India.\nStep 2: Create the VNet and First Subnet (snet-web)\naz network vnet create --resource-group rg-lab3-ROLLNO --name vnet-lab3 --address-\nprefix 10.10.0.0/16 --subnet-name snet-web --subnet-prefix 10.10.1.0/24\nCreates vnet-lab3 with the big address space 10.10.0.0/16 and carves out the first subnet\nsnet-web (10.10.1.0/24).\nStep 3: Add the Second Subnet (snet-app)\naz network vnet subnet create --resource-group rg-lab3-ROLLNO --vnet-name vnet-\nlab3 --name snet-app --address-prefixes 10.10.2.0/24\nAdds the private application subnet snet-app (10.10.2.0/24) inside vnet-lab3.\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 2 of 9\n\n────────────────────────────────────────\n\nStep 4: Create the Web NSG and Add HTTP + SSH Allow Rules\naz network nsg create --resource-group rg-lab3-ROLLNO --name nsg-web\naz network nsg rule create --resource-group rg-lab3-ROLLNO --nsg-name nsg-web --\nname Allow-HTTP --priority 100 --protocol Tcp --direction Inbound --access Allow -\n-destination-port-ranges 80\naz network nsg rule create --resource-group rg-lab3-ROLLNO --nsg-name nsg-web --\nname Allow-SSH --priority 110 --protocol Tcp --direction Inbound --access Allow --\ndestination-port-ranges 22\nCreates firewall nsg-web with two custom Inbound rules: Allow-HTTP (Priority 100, Port 80)\nand Allow-SSH (Priority 110, Port 22).\nStep 5: Attach nsg-web to Subnet snet-web\naz network vnet subnet update --resource-group rg-lab3-ROLLNO --vnet-name vnet-\nlab3 --name snet-web --network-security-group nsg-web\nWhy this step matters: Creating an NSG alone does nothing until you associate (attach) it to a\nsubnet or a VM’s network card. This command links nsg-web to snet-web.\n3. Part B: Deploy VMs into Subnets & Test Connectivity (Cloud Shell CLI)\nNow you will launch vm-web into snet-web (with a Public IP) and vm-app into snet-app (with NO\nPublic IP).\nStep 1: Deploy vm-web (Public Web Tier)\naz vm create --resource-group rg-lab3-ROLLNO --name vm-web --image Ubuntu2204 --\nsize Standard_B1s --vnet-name vnet-lab3 --subnet snet-web --admin-username\nazureuser --generate-ssh-keys --nsg ''\nWhat --nsg '' means: Passing empty quotes tells Azure “do not create a separate NSG on this\nVM’s network card” because we already put nsg-web on the entire snet-web subnet. (If\nStandard_B1s is unavailable in Central India, substitute another B-series size such as\nStandard_B2s.)\nStep 2: Deploy vm-app (Private Application Tier — No Public IP)\naz vm create --resource-group rg-lab3-ROLLNO --name vm-app --image Ubuntu2204 --\nsize Standard_B1s --vnet-name vnet-lab3 --subnet snet-app --admin-username\nazureuser --generate-ssh-keys --public-ip-address '' --nsg ''\nWhat --public-ip-address '' means: Empty quotes tell Azure “do NOT assign a Public IP\naddress to this VM.” As a result, vm-app is completely unreachable from the public internet—only\nmachines inside vnet-lab3 can talk to it.\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 3 of 9\n\n────────────────────────────────────────\n\nStep 3: List IP Addresses of Both VMs\naz vm list-ip-addresses --resource-group rg-lab3-ROLLNO --output table\nLook closely at the output table and write the IPs into your Lab Record Table (Section 5). Notice that\nvm-web has both a Public IP and a Private IP (e.g., 10.10.1.4), while vm-app has only a Private\nIP (e.g., 10.10.2.4).\nStep 4: SSH into vm-web and Ping vm-app (Baseline Test)\n1. In Cloud Shell, connect to vm-web using its Public IP from Step 3:\nssh azureuser@WEB_PUBLIC_IP\n2. If asked “Are you sure you want to continue connecting (yes/no)?”, type yes and press Enter.\nYour prompt changes to azureuser@vm-web:~$.\n3. Now send 4 ICMP ping packets across the VNet to vm-app using its Private IP (usually\n10.10.2.4):\nping -c 4 APP_PRIVATE_IP\n4. Expected result (Ping Succeeds): You will see 4 replies and 4 packets transmitted, 4\nreceived, 0% packet loss. Take Screenshot #1 right now (Before Deny Rule)!\n5. Leave this Cloud Shell terminal open while you perform Part C in the Azure Portal above it.\n4. Part C: Block Traffic with an NSG & Inspect Effective Rules (Azure\nPortal)\nNow you will use the Azure Portal graphical interface to create a firewall for the application subnet\n(nsg-app) and block pings coming from the web subnet.\nStep 1: Create nsg-app and Add the Inbound ICMP Deny Rule\n1. In the top-center Global Search Bar of the Azure Portal, type Network security groups and\nclick Network security groups under Services.\n2. Click + Create near the top-left.\n3. On the Basics tab, fill in:\nSubscription: Your active subscription.\nResource group: Select rg-lab3-ROLLNO.\nName: Type nsg-app.\nRegion: Select (Asia Pacific) Central India.\n4. Click Review + create → Create. Wait ~20 seconds, then click Go to resource.\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 4 of 9\n\n────────────────────────────────────────\n\n5. You are now inside nsg-app. In the left vertical menu under Settings, click Inbound security\nrules.\n6. Look at the top toolbar of the rules list and click + Add. A form slides out from the right edge. Fill in\nevery field exactly as shown below:\nForm Field   Exact Value to Set   Beginner Explanation\nSource   IP Addresses   Lets you target traffic coming\nspecifically from the web subnet\nrange.\nSource IP addresses/CIDR ranges 10.10.1.0/24   The CIDR range of snet-web\nwhere vm-web lives.\nSource port ranges   *   Matches any source port.\nDestination   Any   Applies to any VM inside the protected\nsubnet.\nService   Custom   Allows manually choosing the ICMP\nprotocol.\nDestination port ranges   *   Keep * (asterisk) because ICMP\nping does not use TCP/UDP ports.\nProtocol   ICMP   The protocol used by the ping\ncommand.\nAction   Deny   Blocks matching traffic.\nPriority   100   Low number = evaluated BEFORE\nAzure’s default\nAllowVnetInBound (65000).\nName   Deny-ICMP-from-web   Exact rule name required by the lab\nmanual.\n7. Click the blue Add button at the bottom of the slide-out panel. Confirm Deny-ICMP-from-web\nappears at the top of the Inbound security rules list (Priority 100). Take a screenshot of this\nNSG rule list for Verification!\nStep 2: Associate nsg-app with Subnet snet-app\nRemember: nsg-app is not blocking anything yet until you attach it to snet-app!\n1. In the top-center Global Search Bar, type Virtual networks and click Virtual networks.\n2. Click on vnet-lab3 to open it.\n3. In the left vertical menu of vnet-lab3, under Settings, click Subnets.\n4. You will see both subnets: snet-web (already showing nsg-web) and snet-app (showing None\nunder Security group).\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\n5. Click directly on snet-app. A panel slides out from the right edge.\n6. Look for the Security section (or Network security group dropdown), open the dropdown, and\nselect nsg-app.\n7. Click Save at the bottom of the slide-out panel. Wait ~15 seconds until the notification says Saved\nsubnet.\n8. Look back at the Subnets table: snet-web now shows nsg-web and snet-app now shows\nnsg-app. Take a screenshot of this VNet Subnets blade for Verification!\nStep 3: Repeat the Ping Test (Verify Block, Then Reverse It)\n1. Wait 30 seconds for Azure to enforce the new subnet firewall rule.\n2. Click back into your Cloud Shell terminal (still logged in as azureuser@vm-web) and run the exact\nsame ping command:\nping -c 4 APP_PRIVATE_IP\n3. Expected result (Ping Fails): The terminal pauses for ~4 seconds with no replies and then prints\n4 packets transmitted, 0 received, 100% packet loss. Take Screenshot #2 right now\n(After Deny Rule)!\n4. Now test reversing the rule (Manual Step 3):\nIn the Azure Portal, open Network security groups → nsg-app → Inbound security rules.\nClick on Deny-ICMP-from-web, change Action from Deny to Allow, and click Save\n(alternatively, click the ... menu on the right of the rule and click Delete).\nWait 30 seconds, return to vm-web in Cloud Shell, and run ping -c 4 APP_PRIVATE_IP\nagain. Confirm that ping replies succeed again (0% packet loss).\n5. Type exit in Cloud Shell to disconnect SSH from vm-web and return to your Azure Cloud Shell\nprompt (user@Azure:~$).\nStep 4: Inspect Effective Security Rules on a Network Interface\nWhere is Effective security rules hidden? Beginners often struggle to find it because it lives on the\nVM’s Network Interface (NIC) rather than inside the NSG itself. Follow this exact path:\n1. In the top-center Global Search Bar, type Network interfaces and click Network interfaces\nunder Services.\n2. Click the network interface belonging to vm-app (named something like vm-appVMNic).\n(Alternative path: open Virtual machines → vm-app → Networking → Network settings → click\nthe blue Network interface link.)\n3. In the left vertical menu of the Network interface, scroll down to the Help (or Support +\ntroubleshooting) section at the bottom and click Effective security rules.\n4. Wait 5–10 seconds for Azure to calculate the combined rules applied to that VM.\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\n5. Scroll through the Inbound table and note the built-in Azure default rules at the bottom (priorities\n65000–65500):\nAllowVnetInBound (Priority 65000) — Allows all VMs inside the same VNet to communicate\nwith each other by default.\nAllowAzureLoadBalancerInBound (Priority 65001) — Allows Azure Load Balancer health\nprobes.\nDenyAllInBound (Priority 65500) — Blocks every other inbound packet that did not match a\nhigher-priority Allow rule.\n5. Lab Record Table (Fill During Practical)\nAttached Subnet\nVM Name   Subnet & CIDR Public IP Address   Private IP Address\ dwidth, ultra-low latency,\nand strict compliance.\nE0416B Cloud Computing Lab • Lab 3 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\nQuestion 4: Why is the application tier given no public IP?\nRemoving the public IP from the application tier (vm-app) applies the cybersecurity principle of\nDefense-in-Depth and minimizes the attack surface. End users only need to interact with the\npublic-facing web tier (vm-web), never directly with backend application logic or databases.\nWithout a public IP, external attackers on the internet cannot directly scan, brute-force, or send\nexploit traffic to vm-app. Even if the web tier is targeted, traffic to the application tier can be tightly\nfiltered using subnet NSGs (like nsg-app) so only authorized internal requests are allowed.\n8. Clean-up (Mandatory Before Closing Portal)\nMake sure you have exited SSH (your prompt should say user@Azure:~$, not azureuser@vm-\nweb:~$) and saved all verification screenshots. Then run this command in Cloud Shell (Bash):\naz group delete --name rg-lab3-ROLLNO --yes --no-wait\nThis single command cleanly deletes both VMs, their managed disks, network interfaces, public IP,\nvnet-lab3, both subnets, nsg-web, and nsg-app. Wait 2–3 minutes and run az group list --\noutput table to confirm rg-lab3-ROLLNO is gone.\n9. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\nssh   Check that you ran Step 4 & Step 5 of Part A: Allow-SSH (Port 22)\nazureuser@WEB_PUBLIC_IP   must exist in nsg-web, AND nsg-web must be attached to snet-\nhangs / times out   web.\nPing STILL succeeds after adding   Two common causes: (1) You created nsg-app but forgot Step 2\nDeny-ICMP-from-web   (attaching nsg-app to snet-app); or (2) Azure is still propagating the\nrule—wait 30–60 seconds and test again.\nPortal rejects Deny-ICMP-from- Ensure Source is set to IP Addresses (not Any), Source IP\nweb form   addresses/CIDR ranges is 10.10.1  --location\ncentralindia --sku Standard_LRS --kind StorageV2 --access-tier Hot\nHow ST=stlab4$RANDOM works: $RANDOM is a built-in Bash variable that picks a random\nnumber (0–32767), producing a globally unique lowercase storage name such as stlab424910.\nRunning echo $ST prints that exact name—write it down in Section 5 right now!\nParameters explained: --sku Standard_LRS uses standard hard-drive performance with\nLocally-Redundant Storage; --kind StorageV2 creates a modern General-Purpose v2 account;\n--access-tier Hot optimizes pricing for frequently accessed data. Wait ~30 seconds for\ndeployment to finish.\nStep 3: Create Blob Container labdata and Upload hello.txt\naz storage container create --account-name $ST --name labdata --auth-mode key\necho Hello Azure > hello.txt\naz storage blob upload --account-name $ST --container-name labdata --name\nhello.txt --file hello.txt --auth-mode key\naz storage blob list --account-name $ST --container-name labdata --output table --\nauth-mode key\nE0416B Cloud Computing Lab • Lab 4 Beginner’s Step-by-Step Guide   Page 2 of 9\n\n────────────────────────────────────────\n\nWhat each command does:\n1. Creates a private Blob container named labdata inside $ST using your storage account\naccess key (--auth-mode key).\n2. Creates a small local text file named hello.txt inside Cloud Shell containing the words\nHello Azure.\n3. Uploads hello.txt into the labdata container as a blob.\n4. Lists all blobs inside labdata as a table—confirm hello.txt appears with tier Hot.\n3. Part B: Access Level, SAS Tokens, Access Tiers & Redundancy (Portal)\nNow switch to the graphical Azure Portal above Cloud Shell (you can click the minimize _ icon on\nthe Cloud Shell toolbar to give yourself a full screen).\nStep 1: Confirm Container Access Level is Private and Test the Direct Blob URL\n1. In the top-center Global Search Bar of the Azure Portal, type Storage accounts and click\nStorage accounts under Services.\n2. Click on your storage account completed project datasets kept for at least 30 days. Cool\nhas lower storage cost than Hot, though slightly higher per-operation access charges.\nChoose Archive over Hot: When data is rarely or almost never accessed, must be retained\nlong-term (at least 180 days), and can tolerate hours of retrieval delay (rehydration)—such\nas multi-year regulatory compliance logs, medical/legal records, or raw forensic evidence\narchives. Archive offers the lowest storage cost of all tiers.\nQuestion 3: Compare LRS, ZRS, GRS and GZRS in terms of copies and protection against\nfailures.\nWhat Failures It Protects\nOption   Copies & Placement   Durability (Annual)\nAgainst\nLRS   3 synchronous copies 99.999999999% (11 nines)   Protects against local hard-drive,\ninside a single   server node, or rack failures\ndatacenter in the   inside one datacenter.\nprimary region.\nE0416B Cloud Computing Lab • Lab 4 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nWhat Failures It Protects\nOption   Copies & Placement   Durability (Annual)\nAgainst\nZRS   3 synchronous copies 99.9999999999% (12 nines)   Protects against an entire\nspread across 3   datacenter outage (power,\nseparate Availability   cooling, or networking failure)\nZones in the primary   within a region.\nregion.\nGRS   6 copies total: 3 LRS   99.99999999999999% (16   Protects against a complete\ncopies in primary region nines)   regional disaster (e.g., natural\n+ 3 asynchronous   disaster taking down the entire\ncopies in a paired   primary region).\nsecondary region.\nGZRS   6 copies total: 3 ZRS   99.99999999999999% (16   Combines ZRS high availability\ncopies across 3 zones in nines)   with GRS regional disaster\nprimary region + 3 LRS   recovery—protects against both\ncopies in a paired   zone outages and regional\nsecondary region.   disasters.\nQuestion 4: Why is a SAS token safer than sharing the storage account key?\nSharing a Storage Account Key grants full, unrestricted administrative control over every\ncontainer, blob, file share, queue, and table in the entire storage account—including the ability to\nread, overwrite, or permanently delete all data—and it never expires unless you manually rotate\nthe keys (which can break other apps). By contrast, a Shared Access Signature (SAS) token\nenforces the cybersecurity principle of Least Privilege by restricting access in four ways:\n1. Granular Scope: Grants access only to a single specific blob or container rather than the whole\naccount.\n2. Limited Permissions: Allows only the exact actions needed (e.g., Read-only, preventing\nmodification or deletion).\n3. Time-Bound Validity: Automatically expires after a defined start and expiry timestamp (such as\n1 hour).\n4. Network & Protocol Restrictions: Can enforce HTTPS-only and restrict access to specific\nallowed client IP addresses.\n8. Clean-up (Mandatory Before Closing Portal)\nOnce all four screenshots are saved in your lab journal, run this command in Cloud Shell (Bash)\n(replace ROLLNO with your lowercase roll number):\naz group delete --name rg-lab4-ROLLNO --yes --no-wait\nThis deletes rg-lab4-ROLLNO along with the entire storage account, container, blobs, file share, and\nqueue so no ongoing storage charges accrue. Run az group list --output table after 1–2\nminutes to verify deletion.\nE0416B Cloud Computing Lab • Lab 4 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\n9. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\nPart C commands fail with   Your Cloud Shell session timed out between Part A and Part C, clearing\nargument --account-name:   $ST. Re-set it with ST=stlab4xxxxx (using your exact storage\nexpected one argument   account name from the Portal) and re-run the command.\nSAS URL still works after you   Check the Expiry timezone in the Generate SAS blade (it uses your local\nthought it expired   browser timezone or UTC depending o hines\nIn Lab 2, hosting a simple web page required launching an entire VM, logging in via RDP/SSH, and\ninstalling IIS or Apache yourself. In Lab 5, you experience two modern cloud models where Microsoft\nhandles the servers for you:\nAzure Service   Cloud Model   What It Does & What You Build in Lab 5\nAzure App Service   PaaS (Platform   Managed web hosting platform—you just upload your\nas a Service)   HTML/code and Azure handles the OS, web server, and HTTPS.\nYou deploy an index.html site on the Free F1 tier and\nexplore scaling, deployment slots, and live logs.\nAzure Functions   Serverless   Event-driven micro-code that sleeps at $0 until an event (like an\n(FaaS)   HTTP web request) triggers it. You build an HTTP-triggered\nfunction HelloHttp that greets any name passed in the URL\nand check its Monitor invocation log.\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 1 of 9\n\n────────────────────────────────────────\n\n2. Part A: Deploy an App Service Web App (Cloud Shell CLI)\nSign in at portal.azure.com, click the Cloud Shell icon (>_) at the top-right of the blue header\nbar, and confirm you are in Bash mode.\nStep 1: Create a Local Folder and HTML Page\nRun these two commands one by one (replace ROLLNO with your roll number):\nmkdir lab5 && cd lab5\necho '<h1>Hello from Azure App Service - ROLLNO<\/h1>' > index.html\nmkdir lab5 && cd lab5 creates a clean folder named lab5 in Cloud Shell and enters it.\necho ... > index.html creates a single web page file containing your heading. Run cat\nindex.html if you want to verify its text.\nStep 2: Deploy Directly to Azure App Service with One Command\naz webapp up --name app-lab5-ROLLNO --resource-group rg-lab5-ROLLNO --location\ncentralindia --sku F1 --html\nWhat this single magic command does: It automatically creates the resource group rg-lab5-\nROLLNO in Central India, creates a Free (F1) App Service Plan, creates the Web App app-lab5-\nROLLNO, zips your index.html, and publishes it omains, SSL certificates, Auto-scale,\nStaging/Deployment slots, Daily backups, and Traffic Manager.\nCompute limits on Free F1: Runs on shared infrastructure with a strict cap of 60 CPU\nminutes/day, 1 GB memory, and 1 GB disk space.\n3. Now click Scale out (App Service plan) directly beneath Scale up in the left menu.\n4. Observe what is disabled and why: Both Manual scale (increasing the number of instances\nbeyond 1) and Automatic / Custom autoscale are disabled/grayed out on the Free F1 tier.\nWhy? Because F1 is a zero-cost learning/testing tier hosted on shared servers and does not\nprovide dedicated compute instances or load-balanced horizontal scaling.\nVerification Tip: Take a clean screenshot of the App Service plan blade (either Overview or Scale up/Scale\nout showing tier F1) for your journal.\nStep 3: Inspect Deployment Slots (Optional S1 Swap Only If Permitted)\n1. In the left vertical menu of your App Service, look under the Deployment section and click\nDeployment slots.\n2. Notice the message explaining that your current F1 pricing tier does not support Deployment\nSlots—you must be on Standard (S1) or higher.\n3. If your instructor asks you to test a live Slot Swap (otherwise skip to Step 4):\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 3 of 9\n\n────────────────────────────────────────\n\n4. 1. Go to Settings → Scale up (App Service plan) → select Standard S1 → click Select /\nApply.\n2. Return to Deployment → Deployment slots → click + Add Slot → Name: staging → click\nAdd.\n3. Deploy a modified page to the staging slot (for example, edit index.html to say Staging\nVersion and deploy to the slot via Deployment Center or CLI), then click Swap on the\nDeployment slots toolbar to swap staging into production with zero downtime.\n4. CRITICAL: Immediately return to Scale up (App Service plan), delete the staging slot if\nprompted, and switch back to Free F1 so your credits are not charged for S1!\nStep 4: Watch Live Requests in Log Stream\n1. First enable logging so Log Stream has output to show: in the left vertical menu of your App\nService, scroll down to Monitoring and click App Service logs.\nTurn Application logging (Filesystem) to On (Level: Information).\nTurn Web server logging to File System.\nClick Save at the top-left.\n2. In the left vertical menu under Monitoring, click Log stream. Wait ~10 seconds until the black\nconsole window prints Connected!.\n3. Switch to the browser tab with your live website (https://app-lab5-\nROLLNO.azurewebsites.net) and press F5 (Refresh) 2 or 3 times.\n4. Switch back to the Azure Portal Log stream tab and observe the incoming HTTP GET / request\nentries streaming in real time.\n4. Part C: Create & Test a Serverless Azure Function (Azure Portal)\nStep 1: Create a Function App (Consumption Plan)\n1. In the top-center Global Search Bar, type Function App and click Function App under Services.\n2. Click + Create near the top-left.\n3. On the Select a hosting option screen, choose Consumption (serverless pay-per-execution\nplan — best for creating and editing functions directly in the Portal; if your screen highlights Flex\nConsumption, scroll down or click the Consumption card), then click Select.\n4. Fill in the Basics tab carefully:\nSubscription: Your active subscription.\nResource Group: Select your existing rg-lab5-ROLLNO from the dropdown (keeps Clean-up\nsimple!).\nFunction App name: Type a globally unique name like func-lab5-ROLLNO (add digits if\ntaken).\nRuntime stack: Select Node.js (recommended for smooth in-portal editing; Python is also\nvalid per manual).\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 4 of 9\n\n────────────────────────────────────────\n\n5. Version: Keep the default LTS version (e.g., 20 LTS or 22 LTS).\nRegion: Select (Asia Pacific) Central India.\nOperating System: Keep Windows (or Linux if required by your chosen stack; Windows +\nNode.js guarantees the Portal code editor is unlocked).\n6. Click Next : Storage > and confirm Azure is creating a new Storage account (leave the auto-\ngenerated lowercase name as is).\n7. Click Next : Monitoring > and confirm Enable Application Insights is set to Yes (this powers the\nMonitor invocation count in Step 5!).\n8. Click Review + create → wait for validation → click Create. Wait 1 to 2 minutes, then click Go to\nresource.\nStep 2: Create the HTTP-Triggered Function HelloHttp\n1. Inside your new Function App’s Overview blade, scroll down to the Functions tab in the lower\nhalf of the page and click Create function (or Create in Azure portal).\n2. If asked for a Development environment, ensure Develop in portal is selected.\n3. In the template list, click HTTP trigger.\n4. Scroll down to Template details and enter:\nNew Function: Delete HttpTrigger1 and type HelloHttp.\nAuthorization level: Confirm Function is selected.\n5. Click Create and wait ~15 seconds. Azure opens your new HelloHttp function automatically.\nStep 3: Review/Edit the Code & Get the Function URL\n1. In the left vertical menu of HelloHttp (under Developer), click Code + Test.\n2. Look at the JavaScript code in the editor (typically index.js). Azure’s built-in template already\nreads the name query parameter and builds a greeting. Verify or update the response line so it\nclearly greets the user using name:\nconst name = (req.query.name || (req.body && req.body.name));\nconst responseMessage = name\n? \"Hello, \" + name + \"! Welcome to Azure Functions.\"\n: \"Pass a name in the query string (e.g., &name=YourName) for a greeting.\";\n3. If you modified any text in the editor, click the Save icon at the top of the editor window.\n4. Quick in-portal check (Test/Run): Click Test/Run in the top toolbar → select the Input tab →\nunder Query click + Add parameter → Name: name, Value: your first name → click Run.\nConfirm HTTP response code: 200 OK and your greeting in the Output box!\n5. Copy the live Function URL: Close the Test/Run drawer, click Get function URL in the top\ntoolbar of Code + Test, confirm Key is default (Function key), and click the Copy icon.\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 5 of 9\n\n────────────────────────────────────────\n\nStep 4: Browse the Function URL with Your Name\n1. Open a new browser tab and paste the copied Function URL into the address bar. It will look like\nthis:\nhttps://func-lab5-rollno.azurewebsites.net/api/HelloHttp?code=YOUR_FUNCTION_KEY\n2. At the very end of that URL, type &name=YourName (replacing YourName with your actual first\nname) and press Enter:\nhttps://func-lab5-rollno.azurewebsites.net/api/HelloHttp?\ncode=YOUR_FUNCTION_KEY&name=YourName\nWhy &name= instead of ?name=? In web URLs, the first query parameter starts with ? (here ?\ncode=...), and every additional parameter after it must start with &. (If your URL had no ?code= part,\nthen you would use ?name=YourName.)\n3. Success check: The browser immediately prints Hello, YourName...! Refresh the page 2–3\ntimes so multiple invocations get logged. Take Screenshot #3 of this browser response!\nStep 5: View Invocation Count & Logs in Monitor\n1. Return to the Azure Portal inside your HelloHttp function.\n2. In the left vertical menu of HelloHttp (under Developer), click Monitor.\n3. Click the Invocations tab at the top. You will see a table listing your recent runs with Timestamp,\nResult Code (200 / green checkmark), and Duration, plus total Success count at the top.\n4. Beginner Patience Note: Application Insights telemetry takes 2 to 5 minutes to appear in the\nInvocations table. Click the Refresh button every minute until your runs appear (you can also click\nthe Logs tab next to Invocations to see instant real-time logs while triggering the URL!).\n5. Take Screenshot #4 of the Monitor Invocations screen showing your invocation count and\nsuccessful runs!\n5. Lab Record Table (Fill During Practical)\nLab Item to Record   Your Recorded Value / Observation\nApp Service URL\nApp Service Plan & Pricing Tier\nFunction App Name & Runtime\nFunction Invocation Count Seen\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 6 of 9\n\n────────────────────────────────────────\n\n6. Verification & Screenshot Checklist\nCapture and paste these four screenshots (with date and CLI commands used) into your lab journal\nbefore running Clean-up:\nNo.   Manual Verification Requirement   Exact Screenshot to Capture\n1   Web app URL shows your HTML   Browser window showing https://app-lab5-\npage   ROLLNO.azurewebsites.net displaying Hello from Azure\nApp Service - ROLLNO.\n2   App Service plan blade   Portal → App Service → Overview / Scale up (or Scale out)\nclearly showing your App Service plan and Free F1 pricing tier.\n3   Function URL returns Hello,   Browser window showing the HelloHttp URL with your\nYourName   name parameter returning the Hello, YourName greeting.\n4   Function invocation log   Portal → Function App → HelloHttp → Monitor →\nInvocations showing the Success count and logged HTTP\ntrigger executions.\n7. Observation Questions & Complete Answers\nUse these structured, exam-ready answers for your lab journal and viva preparation:\nQuestion 1: Compare IaaS (VM), PaaS (App Service) and serverless (Functions) for\nmanagement effort and billing.\nAspect   IaaS (Azure VM)   PaaS (App Service)   Serverless (Functions)\nManagement Effort   Highest: Customer   Low: Microsoft manages   Lowest: Microsoft\nmanages OS patching,   OS, runtime, web server,   manages all servers, OS,\nruntime, IIS/Apache setup, and patching; customer   and automatic scaling;\nsecurity updates, scaling,   manages only application   customer writes only small\nand application code.   code and scaling rules.   event-driven functions.\nScaling Behavior   Manual or configured via   Scale up (larger plan) or   Automatic &\nVM Scale Sets (minutes to scale out (more instances) instantaneous per\nboot new VMs).   on demand or by   incoming event;\nschedule/metrics.   automatically scales down\nto zero when idle.\nBilling Model   Billed per second/hour for   Billed per hour for the   Consumption-based:\nreserved vCPU, RAM, and underlying App Service   Pay strictly for actual\ndisks while running (even   Plan tier/instances running executions and execution\nwhen traffic is zero).   (fixed tiers like B1, S1;   duration/memory; $0\nF1 is free).   when idle.\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 7 of 9\n\n────────────────────────────────────────\n\nQuestion 2: Explain the consumption-based billing model of Azure Functions.\nUnder the Consumption hosting plan, Azure Functions uses a true pay-per-use serverless billing\nmodel measured by two metrics:\n1. Total Number of Executions: Counted each time a function is triggered and runs.\n2. Resource Consumption (GB-seconds): Calculated by multiplying the average memory size\nused (in gigabytes) by the execution duration (in seconds) for each run.\nWhen no events or requests arrive, Azure scales the function down to zero active instances,\nmeaning you pay $0 while idle. Furthermore, every Azure subscription includes a generous\nmonthly free grant (1,000,000 executions and 400,000 GB-seconds per month), making\nlightweight serverless APIs and automation tasks virtually free.\nQuestion 3: When would you scale up and when scale out?\nScale Up (Vertical Scaling — bigger machine): Choose scaling up (e.g., moving from F1 to\nB1 or S1) when your application needs more CPU power, more RAM per single instance\n(such as memory-heavy processing or single-threaded workloads), or when you need to unlock\nhigher-tier platform features like Custom Domains, SSL certificates, Staging Deployment\nSlots, or Daily Backups.\nScale Out (Horizontal Scaling — more machines): Choose scaling out (increasing instance\ncount from 1 to 2, 5, or 10 copies behind a load balancer) when your application faces high\nconcurrent user traffic spikes (such as college result day or e-commerce flash sales) or\nrequires high availability / fault tolerance so traffic continues smoothly even if one instance\nfails.\nQuestion 4: Name two triggers other than HTTP that can start an Azure Function.\n1. Timer Trigger: Runs a function automatically on a fixed schedule using a CRON expression\n(for example, running a nightly database cleanup or daily report email at 2:00 AM).\n2. Blob Storage Trigger: Starts a function automatically whenever a new file is uploaded or\nupdated inside an Azure Blob container (for example, automatically generating a thumbnail\nwhenever a user uploads an image).\nOther valid triggers (useful for Viva): Queue Storage Trigger (runs when a new message arrives\nin an Azure Queue), Azure Service Bus Trigger, Cosmos DB Trigger, and Event Grid Trigger.\n8. Clean-up (Mandatory Before Closing Portal)\nOnce all four screenshots are saved in your lab journal, open Cloud Shell (Bash) and run:\naz group delete --name rg-lab5-ROLLNO --yes --no-wait\nE0416B Cloud Computing Lab • Lab 5 Beginner’s Step-by-Step Guide   Page 8 of 9\n\n────────────────────────────────────────\n\nImportant check: If you created your Function App inside a different resource group than rg-\nlab5-ROLLNO, delete that second resource group as well using az group delete --name\nYOUR_FUNCTION_RG --yes --no-wait (or delete it from Resource groups in the Portal).\nWait 2 minutes and run az group list --output table to confirm all Lab 5 resource groups\nare removed.\n9. Beginner Troubleshooting Quick Reference\nCommon Beginner Issue   Why It Happens & How to Fix It\naz webapp up fails with name   App Service names must be globally unique across Azure. Add extra\nconflict   digits (e.g., app-lab5-cfis0429) and re-run.\nFunction URL ignores ?   You appended ?name= after ?code=... (two question marks!).\nname=YourName or returns 401   Change the second ? to an ampersand: ...&name=YourName.\nUnauthorized\nCannot click Create in Azure portal   Some plans (like Flex th your exact\nvalues):\naz group create --name rg-lab6-ROLLNO --location centralindia\naz role assignment create --assignee labuser1@YOURDOMAIN.onmicrosoft.com --role\nReader --resource-group rg-lab6-ROLLNO\naz role assignment list --resource-group rg-lab6-ROLLNO --output table\nCommand 1: Confirms rg-lab6-ROLLNO exists in Central India (safe to run even if you already\ncreated it in the Portal—Azure simply updates/confirms it).\nCommand 2: Directly assigns the Reader role to labuser1 at the rg-lab6-ROLLNO scope.\nCommand 3: Prints a clean table of every RBAC role assignment on rg-lab6-ROLLNO (showing\nPrincipal, Role, and Scope). You can also screenshot this CLI table as extra verification evidence!\nE0416B Cloud Computing Lab • Lab 6 Beginner’s Step-by-Step Guide   Page 5 of 10\n\n────────────────────────────────────────\n\n4. Part C: MFA, Security Defaults and Conditional Access (Portal)\nStep 1: Review Security Defaults in Microsoft Entra ID\n1. In your Admin browser window, open Microsoft Entra ID.\n2. In the left vertical menu, scroll down under Manage and click Properties.\n3. Scroll all the way to the very bottom of the Properties page and click the blue link Manage\nsecurity defaults.\n4. A panel slides out on the right. Read the summary carefully—Security Defaults is Microsoft’s free\nbaseline protection bundle that automatically enforces:\nRequiring all users to register for Microsoft Entra Multifactor Authentication (MFA) within\n14 days.\nRequiring administrators to perform MFA on every sign-in.\nBlocking legacy authentication protocols (such as older POP3, IMAP, SMTP Basic Auth\nclients that cannot support MFA).\nProtecting privileged activities such as accessing the Azure Portal, Azure CLI, or PowerShell.\n5. Note for Step 3 below: Keep Security Defaults Enabled during Step 2. (When you create a\nConditional Access policy in Step 3, Azure lets you save it in Report-only mode, or asks you to\ntemporarily disable Security Defaults if switching Conditional Access to On—because Security\nDefaults and custom Conditional Access policies cannot both be active simultaneously.)\nStep 2: Register Microsoft Authenticator as labuser1 and Trigger MFA\n1. Switch to your Incognito browser window where you are signed in as labuser1.\n2. In that Incognito window, open a new tab and navigate to:\nhttps://mysignins.microsoft.com/security-info (the My Security Info page).\n3. Click + Add sign-in method → choose Microsoft Authenticator → click Add.\n4. Follow the on-screen wizard:\nOpen the Microsoft Authenticator app on your smartphone → tap + (Add account) → choose\nWork or school account → tap Scan a QR code.\nScan the QR code shown on your laptop screen, approve the test 2-digit number prompt on\nyour phone, and click Done.\n5. Sign out of labuser1 (top-right profile icon → Sign out), close and reopen a fresh Incognito\nwindow, go to portal.azure.com, and sign back in as labuser1.\n6. Observe the MFA prompt: After entering your password, Azure displays an “Approve sign in\nrequest” screen with a 2-digit number to enter in your phone’s Authenticator app! Take\nScreenshot #3 of this live MFA prompt!\nStep 3: Create Conditional Access Policy CA-Require-MFA-Lab (Report-only)\nLicensing Note (Entra ID P1 Trial): Conditional Access requires Microsoft Entra ID P1 or P2. If\nclicking + Create new policy is grayed out in your personal tenant, activate the free trial first: in\nMicrosoft Entra ID left menu → Billing → Licenses → All products → click + Try/Buy → activate\nthe free trial for Microsoft Entra ID P2 (or P1), wait 2 minutes, and refresh the page.\nE0416B Cloud Computing Lab • Lab 6 Beginner’s Step-by-Step Guide   Page 6 of 10\n\n────────────────────────────────────────\n\n1. In your Admin window inside Microsoft Entra ID, look at the left vertical menu under Protection\n(or Manage → Security) and click Security → Conditional Access (or search Conditional\nAccess directly in the top Global Search Bar).\n2. Click Policies in the
