  <script id="labs-data" type="application/json">{"1": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 1: Azure Portal, Subscriptions, Resource Groups &amp; Tags<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO1  |  <strong>Theory Alignment:<\/strong> Unit 2 &amp; Unit 4  |  <strong>Estimated Time:<\/strong> 2 Hours<\/p>\n<p><strong>Aim:<\/strong> Explore the Azure Portal and organize resources using the Azure hierarchy and tags.<\/p>\n<p><strong>Prerequisites:<\/strong> A working Microsoft Azure account (Azure for Students or Free account), a modern web browser (Chrome or Edge), and access to Azure Cloud Shell.<\/p>\n<pre class=\"code\"><code>Before You Start: 4 Golden Rules for Total Beginners\nReplace ROLLNO everywhere: Whenever a step or command shows ROLLNO , replace it\nwith your own lowercase roll number (for example, cfis042 ).\nStorage Account names are strict: Storage account names can contain only lowercase\nletters and numbers (3 to 24 characters, no hyphens or spaces) and must be globally\nunique across all Azure users worldwide.\nAlways choose Central India: Select Central India as your region unless your instructor\nspecifies a different region.\nTake screenshots &amp; always clean up: Capture a screenshot at every verification\ncheckpoint for your lab journal, and run the Clean-up commands at the end so your free\ncredit is never wasted.<\/code><\/pre>\n<h2>1. Quick Orientation to the Azure Portal Screen<\/h2>\n<p>If this is your very first time opening Microsoft Azure, spend one minute learning where the main controls live on screen. Every step in this lab refers to these exact areas:<\/p>\n<table>\n<thead>\n<tr><th>Screen Element<\/th><th>Exact Location on Screen<\/th><th>What You Use It For<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Portal Menu (<\/strong> ☰<strong> )<\/strong><\/td><td>Very top-left corner of the blue header bar (three horizontal lines)<\/td><td>Opens the slide-out navigation menu with Home, All services, Resource groups, and Subscriptions.<\/td><\/tr>\n<tr><td><strong>Global Search Bar<\/strong><\/td><td>Top center of the blue header bar (says <em>Search resources, services,<\/em> <em>and docs<\/em>)<\/td><td>Fastest way to jump directly to any Azure service without hunting through menus.<\/td><\/tr>\n<tr><td><strong>Cloud Shell Icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong><\/td><td>Top-right area of the blue header bar (square terminal icon)<\/td><td>Opens the built-in browser terminal (Bash / PowerShell) used in Part B and Clean-up.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Screen Element<\/th><th>Exact Location on Screen<\/th><th>What You Use It For<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Notifications Bell<\/strong><\/td><td>Top-right area of the blue header bar (bell icon next to Settings gear)<\/td><td>Shows live progress (“Deployment in progress” → “Deployment succeeded”) and quick links to newly created resources.<\/td><\/tr>\n<tr><td><strong>Left Resource Menu<\/strong><\/td><td>Vertical sidebar along the left edge whenever you open a resource or group<\/td><td>Holds settings for that specific item, such as <em>Overview<\/em>, <em>Tags<\/em>, <em>Activity log<\/em>, and <em>Access control (IAM)<\/em>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Azure Portal (Click-by-Click Walkthrough)<\/h2>\n<h2>Step 1: Sign In and Locate Services Under All Services<\/h2>\n<p>1. Open your web browser, type <code>portal.azure.com<\/code> in the address bar, and press <strong>Enter<\/strong>.<\/p>\n<p>2. Sign in with your Azure for Students (or free) email ID and password. Once signed in, you will land on the Azure <strong>Home<\/strong> screen.<\/p>\n<p>3. Click the <strong>Portal Menu (<\/strong>☰<strong>)<\/strong> in the top-left corner, then click <strong>All services<\/strong> (alternatively, click the green <strong>All services<\/strong> icon in the top row of the Home page).<\/p>\n<p>4. On the All services page, look at the left category list under <strong>General<\/strong> (or use the filter box at the top of the page) and locate these three core organizational services: <strong>Subscriptions<\/strong> (key icon)<\/p>\n<p class=\"li sub\">• <strong>Resource groups<\/strong> (blue cube icon)<\/p>\n<p class=\"li sub\">• <strong>Management groups<\/strong> (hierarchy folder icon)<\/p>\n<div class=\"callout tip\"><p><strong>Beginner Tip:<\/strong> Hovering over any service in <em>All services<\/em> lets you click the star icon to pin it to your left menu for quick access later.<\/p><\/div>\n<h2>Step 2: Open Subscriptions and Record Your Account Details<\/h2>\n<p>1. Click <strong>Subscriptions<\/strong> from the All services list (or type <code>Subscriptions<\/code> in the top-center Global Search Bar and click <strong>Subscriptions<\/strong> under Services).<\/p>\n<p>2. You will see a table listing your active subscription (for example, <em>Azure for Students<\/em> or <em>Azure<\/em> <em>subscription 1<\/em>).<\/p>\n<p>3. Click directly on your subscription name to open its <strong>Overview<\/strong> page.<\/p>\n<p>4. Find and write down the four required fields in the table below (and in your lab journal). Look in the <strong>Essentials<\/strong> panel at the top of the page; click <em>Offer<\/em> or check the right-hand column if Offer Type is shown there.<\/p>\n<table>\n<thead>\n<tr><th>Field to Record<\/th><th>Where to Find It<\/th><th>Your Recorded Value<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Subscription Name<\/strong><\/td><td>Top title of the page / first column in Subscriptions list<\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Subscription ID<\/strong><\/td><td>Essentials panel (long letters-and-numbers code; click the copy icon to copy it)<\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Field to Record<\/th><th>Where to Find It<\/th><th>Your Recorded Value<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Offer Type<\/strong><\/td><td>Essentials panel (e.g., Azure for Students / Free Trial)<\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Status<\/strong><\/td><td>Essentials panel (should show <em>Active<\/em>)<\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Step 3: Create Resource Group rg-lab1-ROLLNO with Tags<\/h2>\n<p>A <strong>Resource Group<\/strong> is like a project folder in Azure that holds all related cloud resources together.<\/p>\n<p>1. Click the top-center Global Search Bar, type <code>Resource<\/code> <code>groups<\/code>, and click <strong>Resource groups<\/strong>.<\/p>\n<p>2. Near the top-left of the Resource groups page, click the <strong>+ Create<\/strong> button.<\/p>\n<p>3. On the <strong>Basics<\/strong> tab, fill in these three fields: <strong>Subscription:<\/strong> Leave your active subscription selected.<\/p>\n<p class=\"li sub\">• <strong>Resource group:<\/strong> Type <code>rg-lab1-ROLLNO<\/code> (replace <code>ROLLNO<\/code> with your roll number, e.g., <code>rg-lab1-cfis042<\/code>).<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Open the dropdown, scroll to Asia Pacific, and select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p>4. Click the <strong>Next : Tags &gt;<\/strong> button at the bottom-left (or click the <strong>Tags<\/strong> tab near the top).<\/p>\n<p>5. Enter the three exact Name–Value pairs below. After typing a row, a blank row automatically appears underneath:<\/p>\n<table>\n<thead>\n<tr><th>Name (Key)<\/th><th>Value<\/th><th>Purpose<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>Course<\/code><\/td><td><code>E0416B<\/code><\/td><td>Identifies the Cloud Computing Lab course<\/td><\/tr>\n<tr><td><code>Dept<\/code><\/td><td><code>CFIS<\/code><\/td><td>Identifies your department for reporting/cost grouping<\/td><\/tr>\n<tr><td><code>Owner<\/code><\/td><td><em>[Your Roll Number]<\/em><\/td><td>Identifies who owns this resource group<\/td><\/tr>\n<\/tbody><\/table>\n<p>6. Click <strong>Review + create<\/strong> at the bottom. Wait 2 seconds for the green <strong>Validation passed<\/strong> banner to appear at the top.<\/p>\n<p>7. Click <strong>Create<\/strong>. Your resource group is created almost instantly and appears in the Resource groups list (click <strong>Refresh<\/strong> at the top if you do not see it immediately).<\/p>\n<hr class=\"pg\">\n<h2>Step 4: Create a Storage Account Inside Your Resource Group<\/h2>\n<p>1. In the Resource groups list, click on your newly created <strong>rg-lab1-ROLLNO<\/strong> to open it.<\/p>\n<p>2. Inside the resource group page, click the <strong>+ Create<\/strong> button near the top-left toolbar. This opens the Azure Marketplace.<\/p>\n<p>3. In the Marketplace search bar, type <code>Storage<\/code> <code>account<\/code> and press <strong>Enter<\/strong>.<\/p>\n<p>4. Find the card titled <strong>Storage account<\/strong> (published by Microsoft) and click <strong>Create<\/strong> → <strong>Storage<\/strong> <strong>account<\/strong>.<\/p>\n<p>5. On the <strong>Basics<\/strong> tab, verify and enter the following settings carefully: <strong>Subscription:<\/strong> Your active subscription (auto-filled).<\/p>\n<p class=\"li sub\">• <strong>Resource group:<\/strong> Confirm it says <code>rg-lab1-ROLLNO<\/code> (auto-filled because you clicked Create from inside the group).<\/p>\n<p class=\"li sub\">• <strong>Storage account name:<\/strong> Type an all-lowercase name such as <code>stlab1rollno<\/code> (no hyphens, no uppercase, no spaces). If Azure shows a red message saying the name is already taken, add two extra digits at the end (e.g., <code>stlab1rollno99<\/code>).<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Performance:<\/strong> Select <strong>Standard<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Redundancy:<\/strong> Open the dropdown and select <strong>Locally-redundant storage (LRS)<\/strong>.<\/p>\n<p>6. Leave all other tabs (Advanced, Networking, Data protection, Encryption, Tags) at their default values—<strong>do not add tags here<\/strong> so you can test tag inheritance in Step 5.<\/p>\n<p>7. Click the blue <strong>Review<\/strong> (or <strong>Review + create<\/strong>) button at the bottom-left.<\/p>\n<p>8. Once validation succeeds, click <strong>Create<\/strong>. Deployment takes about 30 to 60 seconds. Watch the <strong>Notifications Bell<\/strong> at the top-right until it says <strong>Your deployment is complete<\/strong>.<\/p>\n<h2>Step 5: Compare Tags on the Resource Group vs. the Storage Account<\/h2>\n<p>1. Go back to your resource group: click <strong>Resource groups<\/strong> from the search bar (or breadcrumb trail at the top-left) and click <strong>rg-lab1-ROLLNO<\/strong>.<\/p>\n<p>2. In the left vertical menu of <code>rg-lab1-ROLLNO<\/code>, click <strong>Tags<\/strong>. You will clearly see all three tags you added: <code>Course<\/code> <code>=<\/code> <code>E0416B<\/code>, <code>Dept<\/code> <code>=<\/code> <code>CFIS<\/code>, and <code>Owner<\/code> <code>=<\/code> <code>[Your<\/code> <code>Roll<\/code> <code>Number]<\/code>. <strong>Take a<\/strong> <strong>screenshot here for Verification.<\/strong><\/p>\n<p>3. In the left vertical menu, click <strong>Overview<\/strong>. Scroll down slightly to the Resources list and click your storage account ( <code>stlab1rollno<\/code>).<\/p>\n<p>4. Now, in the left vertical menu of your <strong>storage account<\/strong>, click <strong>Tags<\/strong>.<\/p>\n<p>5. <strong>Observe the result:<\/strong> The Tags list on the storage account is completely empty!<\/p>\n<div class=\"callout tip\"><p><strong>Key Concept to Remember for Viva:<\/strong> Tags applied to a Resource Group are <strong>not<\/strong> automatically inherited by the resources inside it. If you want resources to have tags, you must tag them individually (or enforce tags automatically using Azure Policy in Lab 7).<\/p><\/div>\n<hr class=\"pg\">\n<h2>Step 6: Open Management Groups and Observe Tenant Root Group<\/h2>\n<p>1. Click the top-center Global Search Bar, type <code>Management<\/code> <code>groups<\/code>, and click <strong>Management<\/strong> <strong>groups<\/strong> under Services.<\/p>\n<p>2. Look at the hierarchy displayed on screen and note the <strong>Tenant Root Group<\/strong> (the top-most parent container above your subscription).<\/p>\n<p>3. <strong>If you see an access/permission message instead:<\/strong> Many student or university-managed accounts do not grant permission to view or create Management Groups. That is completely normal—read the exact message shown on screen (for example, <em>“You do not have permission to<\/em> <em>view management groups”<\/em> or <em>“Start using Management Groups”<\/em>) and write it down in the box below for your journal.<\/p>\n<table>\n<thead>\n<tr><th>Step 6 Observation Record (Tenant Root Group Name or Permission Message Seen)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>3. Part B: Azure CLI in Cloud Shell (Step-by-Step)<\/h2>\n<p>Instead of clicking buttons in the Portal, cloud engineers often manage Azure by typing short commands in the <strong>Azure CLI<\/strong> (Command-Line Interface). You do not need to install anything on your laptop—Azure provides a built-in terminal called <strong>Cloud Shell<\/strong> right inside your browser.<\/p>\n<h2>First-Time Setup: How to Open Azure Cloud Shell<\/h2>\n<p>1. Look at the top-right corner of the blue Azure Portal header bar and click the <strong>Cloud Shell icon<\/strong> <strong>(<\/strong> <code>&gt;_<\/code><strong> )<\/strong> (a small square icon with a greater-than sign and underscore).<\/p>\n<p>2. A dark terminal panel will slide up from the bottom half of your browser window.<\/p>\n<p>3. If asked to choose between <strong>Bash<\/strong> and <strong>PowerShell<\/strong>, click <strong>Bash<\/strong>.<\/p>\n<p>4. If a popup asks about mounting storage (first time only), select your subscription and choose <strong>No<\/strong> <strong>storage account required<\/strong> (if available) or click <strong>Mount storage account<\/strong> / <strong>Create storage<\/strong> and pick <strong>Central India<\/strong>. Wait 15–60 seconds until you see a prompt like <code>user@Azure:~$<\/code>.<\/p>\n<p>5. <strong>How to paste commands into Cloud Shell:<\/strong> Standard <code>Ctrl+V<\/code> sometimes fails in browser terminals. Use <strong>Right-click → Paste<\/strong> inside the black terminal area, or press <code>Ctrl<\/code> <code>+<\/code> <code>Shift<\/code> <code>+<\/code> <code>V<\/code> (Windows/Linux) / <code>Cmd<\/code> <code>+<\/code> <code>V<\/code> (Mac).<\/p>\n<h2>Run the 5 Lab Commands One by One<\/h2>\n<p>Remember to replace <code>ROLLNO<\/code> with your own lowercase roll number before pressing <strong>Enter<\/strong> after each command.<\/p>\n<h2>Command 1: Display Your Current Subscription Information<\/h2>\n<pre class=\"code\"><code>az account show --output table<\/code><\/pre>\n<hr class=\"pg\">\n<p><strong>What it does:<\/strong> Shows the active Azure subscription currently linked to your Cloud Shell session in a clean, readable table format (Name, CloudName, SubscriptionId, State, IsDefault).<\/p>\n<h2>Command 2: Create a Second Resource Group Using CLI<\/h2>\n<pre class=\"code\"><code>az group create --name rg-lab1b-ROLLNO --location centralindia --tags\nCourse=E0416B Dept=CFIS<\/code><\/pre>\n<p><strong>What it does:<\/strong> Creates a new resource group named <code>rg-lab1b-ROLLNO<\/code> in the <code>centralindia<\/code> region and attaches two tags ( <code>Course=E0416B<\/code> and <code>Dept=CFIS<\/code>) in a single command. You will see JSON output with <code>&quot;provisioningState&quot;:<\/code> <code>&quot;Succeeded&quot;<\/code>.<\/p>\n<h2>Command 3: List All Resource Groups in Your Subscription<\/h2>\n<pre class=\"code\"><code>az group list --output table<\/code><\/pre>\n<p><strong>What it does:<\/strong> Lists every resource group in your account as a table. Confirm that both <code>rg-lab1-ROLLNO<\/code> (from Part A) and <code>rg-lab1b-ROLLNO<\/code> (from Command 2) appear with location <code>centralindia<\/code>.<\/p>\n<h2>Command 4: List All Resources Inside rg-lab1-ROLLNO<\/h2>\n<pre class=\"code\"><code>az resource list --resource-group rg-lab1-ROLLNO --output table<\/code><\/pre>\n<p><strong>What it does:<\/strong> Displays all Azure services inside your Part A resource group. You should see your storage account ( <code>stlab1rollno<\/code>) with Type <code>Microsoft.Storage/storageAccounts<\/code>.<\/p>\n<h2>Command 5: Apply the Tag Env=Lab to Your Storage Account<\/h2>\n<pre class=\"code\"><code>az resource tag --tags Env=Lab --ids $(az storage account list --resource-group\nrg-lab1-ROLLNO --query [0].id --output tsv)<\/code><\/pre>\n<h3>How this command works (plain English):<\/h3>\n<p class=\"li\">• The inner part inside <code>$(<\/code> <code>...<\/code> <code>)<\/code> runs first: it finds the first storage account ( <code>[0]<\/code>) inside <code>rg-lab1-ROLLNO<\/code> and returns its exact internal Azure Resource ID as plain text ( <code>--output<\/code> <code>tsv<\/code>).<\/p>\n<p class=\"li\">• The outer command <code>az<\/code> <code>resource<\/code> <code>tag<\/code> <code>--tags<\/code> <code>Env=Lab<\/code> <code>--ids<\/code> <code>...<\/code> takes that ID and attaches the tag <code>Env=Lab<\/code> directly to your storage account.<\/p>\n<p class=\"li\">• <strong>Expected output:<\/strong> JSON text showing your storage account details with <code>&quot;tags&quot;:<\/code> <code>{<\/code> <code>&quot;Env&quot;:<\/code> <code>&quot;Lab&quot;<\/code> <code>}<\/code>.<\/p>\n<div class=\"callout tip\"><p><strong>Verify Command 5:<\/strong> Re-run <code>az<\/code> <code>resource<\/code> <code>list<\/code> <code>--resource-group<\/code> <code>rg-lab1-ROLLNO<\/code> <code>--output<\/code> <code>table<\/code> (or refresh the <strong>Tags<\/strong> blade of your storage account in the Portal) to see <code>Env=Lab<\/code> now attached!<\/p><strong class=\"callout-title\">Take a screenshot of your Cloud Shell output here.<\/strong><\/div>\n<hr class=\"pg\">\n<h2>4. Verification &amp; Screenshot Checklist<\/h2>\n<p>Your lab evaluation rubric awards 20% of marks specifically for verification evidence. Capture and paste these screenshots (with date and commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Resource group appears under <em>Resource groups<\/em> with all three tags<\/td><td>Portal screen showing <code>rg-lab1-ROLLNO<\/code> in Resource groups and its <strong>Tags<\/strong> blade displaying <code>Course=E0416B<\/code>, <code>Dept=CFIS<\/code>, and <code>Owner=[ROLLNO]<\/code>.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>Tag non-inheritance comparison (Part A, Step 5)<\/td><td>Storage account ( <code>stlab1rollno<\/code>) <strong>Tags<\/strong> blade before CLI tagging (showing no tags) to prove group tags did not auto-copy.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td><code>az<\/code> <code>resource<\/code> <code>list<\/code> shows your storage account and its tags now include <code>Env<\/code> <code>=<\/code> <code>Lab<\/code><\/td><td>Cloud Shell terminal showing Commands 1–5 output, specifically the <code>az<\/code> <code>resource<\/code> <code>tag<\/code> result showing <code>&quot;Env&quot;:<\/code> <code>&quot;Lab&quot;<\/code> and the storage account listed via <code>az<\/code> <code>resource<\/code> <code>list<\/code>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>5. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these complete, concept-accurate answers to write your lab journal responses and prepare for your viva.<\/p>\n<h2>Question 1: Draw the Azure resource hierarchy (Management group, Subscription, Resource group, Resource) using what you saw.<\/h2>\n<div class=\"callout info\"><p class=\"li\">• <strong>Level 1 — Management Group<\/strong> (e.g., <em>Tenant Root Group<\/em>) Top-level organizational container that groups multiple subscriptions to apply enterprise-wide policies and governance.<\/p><p class=\"arrow\"><strong>↓ contains one or more<\/strong><\/p><p class=\"li sub\">• <strong>Level 2 — Subscription<\/strong> (e.g., <em>Azure for Students / Free Account<\/em>) Logical billing and access boundary associated with your Azure account and credits.<\/p><p class=\"arrow\"><strong>↓ contains one or more<\/strong><\/p><p class=\"li sub\">• <strong>Level 3 — Resource Group<\/strong> (e.g., <code>rg-lab1-ROLLNO<\/code>, <code>rg-lab1b-ROLLNO<\/code>) Logical folder grouping related resources that share a common lifecycle (Tags: <code>Course=E0416B<\/code>, <code>Dept=CFIS<\/code>, <code>Owner=ROLLNO<\/code>).<\/p><p class=\"arrow\"><strong>↓ contains one or more<\/strong><\/p><p class=\"li sub\">• <strong>Level 4 — Resource<\/strong> (e.g., Storage Account <code>stlab1rollno<\/code>) Individual Azure service instance deployed and managed inside a resource group (Tag added via CLI: <code>Env=Lab<\/code>).<\/p><\/div>\n<hr class=\"pg\">\n<div class=\"callout tip\"><p><strong>Hierarchy Rule Note:<\/strong> Permissions (RBAC) and Azure Policies flow downward from parent levels to child levels, whereas <strong>Tags do not inherit automatically<\/strong>.<\/p><\/div>\n<h2>Question 2: Why must every resource belong to exactly one resource group?<\/h2>\n<div class=\"callout tip\"><p>Every Azure resource must belong to exactly one resource group to establish a <strong>single,<\/strong> <strong>unambiguous management and lifecycle boundary<\/strong>. If a resource could belong to multiple resource groups at once, deleting or modifying one group could accidentally break another project, and conflicting access permissions or cost reports would occur. Having a strict one-to-one ownership rule ensures clean deployment, clear Role-Based Access Control (RBAC), organized monitoring, and predictable bulk deletion. <em>(Note: A resource can be moved to another resource<\/em> <em>group later, and resources inside one group can reside in different Azure regions if needed.)<\/em><\/p><\/div>\n<h2>Question 3: What happens to the resources when a resource group is deleted?<\/h2>\n<div class=\"callout tip\"><p>When a resource group is deleted, <strong>every resource inside that resource group is permanently<\/strong> <strong>deleted along with it<\/strong>. Because a resource group acts as a shared lifecycle container, Azure cascades the deletion to all contained services—such as storage accounts, virtual machines, disks, and networks—and stops any ongoing billing charges for those resources. This operation cannot be undone, which is why Azure asks for confirmation before deleting a resource group and why deleting the resource group is the fastest, safest way to clean up at the end of a lab.<\/p><\/div>\n<h2>Question 4: List two factors that influence your choice of region.<\/h2>\n<div class=\"callout tip\"><p>1. <strong>Proximity to Users (Network Latency):<\/strong> Selecting a region geographically close to your end users—such as <strong>Central India<\/strong> for users in India—minimizes network travel distance, resulting in lower latency and faster response times.<\/p><p>2. <strong>Pricing (Cost Differences):<\/strong> Azure service costs vary across regions due to differences in local electricity, real estate, infrastructure, and tax rates. Choosing a cost-effective region helps reduce cloud spend. <em>Additional factors (useful for Viva):<\/em> <strong>Data Residency &amp; Compliance<\/strong> (laws requiring data to remain within a specific country) and <strong>Service Availability<\/strong> (certain specialized VM sizes or new Azure features are available only in specific regions).<\/p><\/div>\n<h2>6. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Always run these two commands in <strong>Cloud Shell (Bash)<\/strong> once you have taken all verification screenshots. Replace <code>ROLLNO<\/code> with your roll number:<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab1b-ROLLNO --yes --no-wait\naz group delete --name rg-lab1-ROLLNO --yes --no-wait<\/code><\/pre>\n<hr class=\"pg\">\n<p class=\"li\">• <strong>What <\/strong><code>--yes<\/code><strong> means:<\/strong> Skips the <em>“Are you sure you want to perform this operation? (y/n)”<\/em> prompt.<\/p>\n<p class=\"li\">• <strong>What <\/strong><code>--no-wait<\/code><strong> means:<\/strong> Starts deleting the resource group in the background and immediately gives you back your terminal prompt instead of making you wait 1–2 minutes.<\/p>\n<p class=\"li\">• <strong>Confirm Clean-up:<\/strong> After 2 minutes, run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> (or refresh the <strong>Resource groups<\/strong> page in the Portal) to verify that neither <code>rg-lab1-ROLLNO<\/code> nor <code>rg-lab1b-ROLLNO<\/code> remains.<\/p>\n<h2>7. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Error<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><em>“Storage account name is already<\/em> <em>taken”<\/em><\/td><td>Storage names must be unique across all Azure users globally. Add 2–4 random numbers to the end (e.g., <code>stlab1cfis0429<\/code>).<\/td><\/tr>\n<tr><td><em>“Name can only contain lowercase<\/em> <em>letters and numbers”<\/em><\/td><td>Remove any capital letters, hyphens ( <code>-<\/code>), underscores ( <code>_<\/code>), or spaces from the storage account name.<\/td><\/tr>\n<tr><td><code>ResourceGroupNotFound<\/code> in CLI<\/td><td>You either typed <code>ROLLNO<\/code> literally instead of your roll number, or had a small spelling typo. Run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> to see exact names.<\/td><\/tr>\n<tr><td>Command 5 fails with <code>--ids<\/code> error<\/td><td>Make sure your storage account finished deploying inside <code>rg-lab1-ROLLNO<\/code> first, and copy the entire command on one single line.<\/td><\/tr>\n<tr><td>Permission denied on Management Groups<\/td><td>Normal on university/student accounts. Simply record the exact message shown in Step 6—no points are deducted.<\/td><\/tr>\n<\/tbody><\/table>", "2": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 2: Deploying Windows and Linux Virtual Machines<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO2  |  <strong>Theory Alignment:<\/strong> Unit 2  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Deploy a Windows Server VM and an Ubuntu Linux VM, connect to them, and install web servers.<\/p>\n<p><strong>Prerequisites:<\/strong> Lab 1 completed; an RDP client (Windows <em>Remote Desktop Connection<\/em> is already built into Windows; Mac users can install <em>Windows App<\/em> from the App Store) and an SSH client (Azure Cloud Shell already has <code>ssh<\/code> built in).<\/p>\n<pre class=\"code\"><code>Before You Start: Crucial Credit &amp; Security Tips for Lab 2\nVirtual Machines consume free credits every minute they run: Never close your browser\nat the end of this lab without running the Clean-up step (deallocate and delete rg-lab2-\nROLLNO ).\nWrite down your Windows VM username and password: You will need them 5 minutes\nlater to log into the Windows VM via Remote Desktop (RDP). Do not share VM passwords\nwith anyone.\nIf Standard_B2s or Standard_B1s shows unavailable in Central India: Click See all\nsizes and choose another available B-series size (such as Standard_B2ls_v2 or\nStandard_B2ms ) as permitted by your lab manual.\nUse http:// (not https:// ) when testing your web servers: Port 80 serves plain\nHTTP. If your browser auto-redirects to https:// , manually edit the address bar to start\nwith http:// .<\/code><\/pre>\n<h2>1. Plain-English Overview of What You Will Build<\/h2>\n<p>A <strong>Virtual Machine (VM)<\/strong> is a complete computer (CPU, RAM, hard disk, and operating system) running inside Microsoft’s data center in Central India. In this lab you will build two cloud computers inside one resource group ( <code>rg-lab2-ROLLNO<\/code>):<\/p>\n<table>\n<thead>\n<tr><th>Lab Part<\/th><th>Virtual Machine<\/th><th>How You Connect<\/th><th>Web Server Installed &amp; Test<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part A<\/strong> (Portal)<\/td><td>Windows Server 2022 ( <code>Standard_B2s<\/code>)<\/td><td><strong>RDP<\/strong> (Remote Desktop, Port <code>3389<\/code>) — full graphical Windows desktop<\/td><td><strong>IIS<\/strong> (Internet Information Services) via PowerShell → open <code>http://PUBLIC_IP<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Lab Part<\/th><th>Virtual Machine<\/th><th>How You Connect<\/th><th>Web Server Installed &amp; Test<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part B<\/strong> (CLI)<\/td><td>Ubuntu 22.04 Linux ( <code>Standard_B1s<\/code>)<\/td><td><strong>SSH<\/strong> (Secure Shell, Port <code>22<\/code>) — text command-line login from Cloud Shell<\/td><td><strong>Apache2<\/strong> via <code>apt<\/code> → open <code>http://PUBLIC_IP<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Deploy &amp; Configure Windows Server VM (Azure Portal)<\/h2>\n<h2>Step 1: Create Resource Group rg-lab2-ROLLNO<\/h2>\n<p>1. Sign in at <code>portal.azure.com<\/code>.<\/p>\n<p>2. Click the top-center Global Search Bar, type <code>Resource<\/code> <code>groups<\/code>, and click <strong>Resource groups<\/strong>.<\/p>\n<p>3. Click <strong>+ Create<\/strong> near the top-left.<\/p>\n<p>4. Set <strong>Resource group<\/strong> to <code>rg-lab2-ROLLNO<\/code> (replace <code>ROLLNO<\/code> with your lowercase roll number, e.g., <code>rg-lab2-cfis042<\/code>) and <strong>Region<\/strong> to <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p>5. Click <strong>Review + create<\/strong>, then click <strong>Create<\/strong>.<\/p>\n<h2>Step 2: Create the Windows Server 2022 Virtual Machine<\/h2>\n<p>1. In the top-center Global Search Bar, type <code>Virtual<\/code> <code>machines<\/code> and click <strong>Virtual machines<\/strong> under Services.<\/p>\n<p>2. At the top-left of the Virtual machines page, click <strong>+ Create<\/strong>, then select <strong>Azure virtual machine<\/strong> from the dropdown menu.<\/p>\n<p>3. Fill in the <strong>Basics<\/strong> tab carefully from top to bottom: <strong>Subscription:<\/strong> Keep your active Azure for Students / Free subscription selected.<\/p>\n<p class=\"li sub\">• <strong>Resource group:<\/strong> Open the dropdown and select <code>rg-lab2-ROLLNO<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Virtual machine name:<\/strong> Type a clean name such as <code>vm-win-ROLLNO<\/code> (must be 15 characters or fewer for Windows!).<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Availability options:<\/strong> Leave default (<em>No infrastructure redundancy required<\/em> is fine for lab practice; take a quick look at the dropdown options because Question 3 asks about them!).<\/p>\n<p class=\"li sub\">• <strong>Security type:<\/strong> Leave default (<em>Trusted launch virtual machines<\/em> or <em>Standard<\/em>).<\/p>\n<p class=\"li sub\">• <strong>Image:<\/strong> Click the dropdown and select <strong>Windows Server 2022 Datacenter: Azure Edition -<\/strong> <strong>x64 Gen2<\/strong>. <em>(If it is not in the short list, click “See all images” and search for it.)<\/em><\/p>\n<p class=\"li sub\">• <strong>Size:<\/strong> Click the dropdown (or <strong>See all sizes<\/strong>) and select <strong>Standard_B2s<\/strong> (2 vCPUs, 4 GiB memory). <em>(If unavailable, choose another B-series size.)<\/em><\/p>\n<p>4. Scroll down to the <strong>Administrator account<\/strong> section on the same Basics tab: <strong>Username:<\/strong> Enter a simple admin username such as <code>azureadmin<\/code> (do <em>not<\/em> use <code>admin<\/code> or <code>administrator<\/code> —Azure blocks those common names).<\/p>\n<p class=\"li sub\">• <strong>Password &amp; Confirm password:<\/strong> Enter a strong password that is at least 12 characters long and includes uppercase, lowercase, a number, and a symbol. Write it down in your lab record table below.<\/p>\n<hr class=\"pg\">\n<p>5. Scroll down to <strong>Inbound port rules<\/strong>: <strong>Public inbound ports:<\/strong> Select <strong>Allow selected ports<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Select inbound ports:<\/strong> Open the dropdown and check <strong>ONLY<\/strong> <strong>RDP (3389)<\/strong>. Do <em>not<\/em> check HTTP (80) yet—you will open Port 80 manually in Step 6 to practice firewall rules.<\/p>\n<p>6. Click <strong>Next : Disks &gt;<\/strong> at the bottom-left (or click the <strong>Disks<\/strong> tab at the top). Under <strong>OS disk type<\/strong>, verify that <strong>Standard SSD (locally-redundant storage)<\/strong> is selected.<\/p>\n<p>7. Click the blue <strong>Review + create<\/strong> button at the bottom-left. Wait for the green <strong>Validation passed<\/strong> banner at the top, then click <strong>Create<\/strong>.<\/p>\n<p>8. Wait <strong>2 to 4 minutes<\/strong> while Azure builds the VM. When the page says <strong>Your deployment is<\/strong> <strong>complete<\/strong>, click the blue <strong>Go to resource<\/strong> button.<\/p>\n<h2>Step 3: Connect to the Windows VM Using RDP<\/h2>\n<p>1. You are now on your Windows VM’s <strong>Overview<\/strong> blade. Look at the right side of the Essentials panel and note down the <strong>Public IP address<\/strong> (you will need it for Step 6). <strong>Keep this Overview<\/strong> <strong>screen in mind—you will screenshot it for Verification.<\/strong><\/p>\n<p>2. Look at the top toolbar of the Overview page and click <strong>Connect<\/strong> → <strong>Connect<\/strong> (or click <strong>Connect<\/strong> in the left vertical menu under <em>Connect<\/em>).<\/p>\n<p>3. In the Connect screen, locate the <strong>Native RDP<\/strong> card and click the blue <strong>Select<\/strong> button (or click the <strong>RDP<\/strong> tab if using the classic Connect layout).<\/p>\n<p>4. Click <strong>Download RDP File<\/strong>. A small <code>.rdp<\/code> file downloads to your computer.<\/p>\n<p>5. Double-click the downloaded <code>.rdp<\/code> file to launch <strong>Remote Desktop Connection<\/strong>: If a popup says <em>“The publisher of this remote connection can’t be identified”<\/em>, click <strong>Connect<\/strong>.<\/p>\n<p class=\"li sub\">• When asked for credentials, click <strong>More choices<\/strong> → <strong>Use a different account<\/strong>, type the <strong>Username<\/strong> and <strong>Password<\/strong> you created in Step 2, and click <strong>OK<\/strong>.<\/p>\n<p class=\"li sub\">• If a certificate warning appears (<em>“The identity of the remote computer cannot be verified”<\/em>), click <strong>Yes<\/strong>.<\/p>\n<p>6. Wait 15–30 seconds for the Windows Server desktop to load inside the Remote Desktop window. If a blue side popup asks about Networks, click <strong>No<\/strong>. If <em>Server Manager<\/em> opens automatically, you can minimize it.<\/p>\n<h2>Step 4: Install the IIS Web Server Inside the Windows VM<\/h2>\n<p>1. Inside the remote Windows Server desktop, click the <strong>Start button<\/strong> (Windows icon at the bottom-left corner of the remote screen).<\/p>\n<p>2. Type <code>PowerShell<\/code> on your keyboard. Right-click <strong>Windows PowerShell<\/strong> in the search results and select <strong>Run as administrator<\/strong>.<\/p>\n<p>3. In the blue PowerShell window, type (or copy-paste) this exact command and press <strong>Enter<\/strong>:<\/p>\n<pre class=\"code\"><code>Install-WindowsFeature -Name Web-Server -IncludeManagementTools<\/code><\/pre>\n<hr class=\"pg\">\n<p>4. Wait <strong>1 to 2 minutes<\/strong> as a progress bar fills up across the top of the PowerShell window. When finished, confirm the output table shows <code>Success:<\/code> <code>True<\/code> and <code>Exit<\/code> <code>Code:<\/code> <code>Success<\/code>.<\/p>\n<p>5. You can now close the Remote Desktop window (click the <strong>X<\/strong> on the blue top RDP bar and click <em>OK<\/em>)—your Windows VM continues running in the cloud.<\/p>\n<h2>Step 5: Open Port 80 (HTTP) in Azure Portal and Test IIS<\/h2>\n<p>Right now, IIS is running inside your Windows VM, but Azure’s virtual firewall (Network Security Group) blocks web traffic on Port 80. Let us allow Port 80:<\/p>\n<p>1. Return to the Azure Portal browser tab showing your Windows VM.<\/p>\n<p>2. In the left vertical menu of your VM, look under the <strong>Networking<\/strong> group and click <strong>Network settings<\/strong> (labeled <strong>Networking<\/strong> in older portal layouts).<\/p>\n<p>3. In the main area under the <strong>Rules<\/strong> tab, click the <strong>+ Create port rule<\/strong> button on the right, then click <strong>Inbound port rule<\/strong>.<\/p>\n<p>4. A panel slides out from the right edge. Fill in only these key fields (leave Source, Source port ranges, and Destination as <em>Any<\/em> for this lab step): <strong>Destination port ranges:<\/strong> Delete <code>8080<\/code> and type <code>80<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Protocol:<\/strong> Select <strong>TCP<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Action:<\/strong> Confirm <strong>Allow<\/strong> is selected.<\/p>\n<p class=\"li sub\">• <strong>Priority:<\/strong> Keep the suggested number (for example, <code>310<\/code> or <code>1010<\/code>).<\/p>\n<p class=\"li sub\">• <strong>Name:<\/strong> Type <code>Allow-HTTP-80<\/code>.<\/p>\n<p>5. Click <strong>Add<\/strong> at the bottom of the panel and wait ~15 seconds for the rule to save.<\/p>\n<p>6. Open a new browser tab, type <code>http://PUBLIC_IP<\/code> (replacing <code>PUBLIC_IP<\/code> with your Windows VM’s Public IP from Step 3), and press <strong>Enter<\/strong>.<\/p>\n<p>7. <strong>Success check:<\/strong> You should see the blue <strong>Internet Information Services (IIS)<\/strong> welcome banner!<\/p>\n<h3>Take a screenshot of this browser window (including the IP in the address bar) for Verification.<\/h3>\n<h2>3. Part B: Deploy &amp; Configure Linux VM (Azure CLI in Cloud Shell)<\/h2>\n<p>Now you will deploy an Ubuntu 22.04 Linux VM into the exact same resource group ( <code>rg-lab2-ROLLNO<\/code>) using just a few fast commands in Cloud Shell.<\/p>\n<h2>Step 1: Open Azure Cloud Shell (Bash)<\/h2>\n<p>1. Click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right of the blue Azure Portal header bar.<\/p>\n<p>2. Confirm the dropdown at the top-left of the terminal panel says <strong>Bash<\/strong>.<\/p>\n<h2>Step 2: Create the Ubuntu Linux VM and Open Port 80<\/h2>\n<p>Run the following three commands one at a time (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<hr class=\"pg\">\n<pre class=\"code\"><code>az vm create --resource-group rg-lab2-ROLLNO --name vm-linux --image Ubuntu2204 --\nsize Standard_B1s --admin-username azureuser --generate-ssh-keys --public-ip-sku\nStandard<\/code><\/pre>\n<p class=\"li\">• <strong>Wait 1–2 minutes<\/strong> while Azure creates the VM, generates an SSH key pair inside your Cloud Shell home directory ( <code>~/.ssh/id_rsa<\/code>), and prints JSON output containing <code>publicIpAddress<\/code>.<\/p>\n<p class=\"li\">• <em>Note:<\/em> If Azure reports that <code>Standard_B1s<\/code> is unavailable in Central India, change <code>--size<\/code> <code>Standard_B1s<\/code> to another available B-series size such as <code>Standard_B2s<\/code> or <code>Standard_B2ls_v2<\/code>.<\/p>\n<pre class=\"code\"><code>az vm open-port --resource-group rg-lab2-ROLLNO --name vm-linux --port 80<\/code><\/pre>\n<p><strong>What it does:<\/strong> Automatically creates an inbound Network Security Group rule allowing HTTP traffic on Port <code>80<\/code> to <code>vm-linux<\/code> (doing in 1 second what took several clicks in Part A!).<\/p>\n<pre class=\"code\"><code>az vm list-ip-addresses --resource-group rg-lab2-ROLLNO --output table<\/code><\/pre>\n<p><strong>What it does:<\/strong> Prints a clean table listing both your Windows VM and <code>vm-linux<\/code> along with their Public IP and Private IP addresses. Copy the <strong>PublicIPAddresses<\/strong> value for <code>vm-linux<\/code>.<\/p>\n<h2>Step 3: Connect to the Linux VM via SSH and Install Apache<\/h2>\n<p>1. In Cloud Shell, run the SSH command below, replacing <code>PUBLIC_IP<\/code> with the Public IP of <code>vm-linux<\/code>:<\/p>\n<pre class=\"code\"><code>ssh azureuser@PUBLIC_IP<\/code><\/pre>\n<p>2. The first time you connect, Linux displays: <em>“Are you sure you want to continue connecting<\/em> <em>(yes/no/[fingerprint])?”<\/em> Type <code>yes<\/code> and press <strong>Enter<\/strong>.<\/p>\n<p>3. Your prompt will change from <code>user@Azure:~$<\/code> to <code>azureuser@vm-linux:~$<\/code> — you are now logged inside your cloud Ubuntu server!<\/p>\n<p>4. Run these three commands inside the Linux VM one by one:<\/p>\n<pre class=\"code\"><code>sudo apt update\nsudo apt install apache2 -y\nsystemctl status apache2<\/code><\/pre>\n<hr class=\"pg\">\n<p class=\"li\">• <strong>What each command does:<\/strong> <code>sudo<\/code> <code>apt<\/code> <code>update<\/code> refreshes Ubuntu’s package list; <code>sudo<\/code> <code>apt<\/code> <code>install<\/code> <code>apache2<\/code> <code>-y<\/code> downloads and installs the Apache web server without asking for confirmation; <code>systemctl<\/code> <code>status<\/code> <code>apache2<\/code> checks that Apache is running (look for green text saying <strong>active (running)<\/strong>).<\/p>\n<p class=\"li\">• <strong>How to exit the status screen:<\/strong> Press the letter <code>q<\/code> on your keyboard to return to the prompt, then type <code>exit<\/code> and press <strong>Enter<\/strong> to leave SSH and return to Cloud Shell.<\/p>\n<h2>Step 4: Test the Apache Web Page in Your Browser<\/h2>\n<p>1. Open a new browser tab, type <code>http://PUBLIC_IP<\/code> (using <code>vm-linux<\/code> ’s Public IP), and press <strong>Enter<\/strong>.<\/p>\n<p>2. <strong>Success check:<\/strong> You will see the red-and-white <strong>Apache2 Default Page<\/strong> (“It works!”). <strong>Take a<\/strong> <strong>screenshot for Verification.<\/strong><\/p>\n<div class=\"callout tip\"><p><strong>Optional Step (Connect via PuTTY):<\/strong> If your instructor asks you to connect from Windows using PuTTY instead of Cloud Shell, run <code>cat<\/code> <code>~/.ssh/id_rsa<\/code> in Cloud Shell to view your private key, save it on your PC as a <code>.pem<\/code> file, convert it to a <code>.ppk<\/code> file using <em>PuTTYgen<\/em>, and load it under PuTTY → <em>Connection → SSH<\/em> <em>→ Auth → Credentials<\/em> before connecting to <code>azureuser@PUBLIC_IP<\/code>.<\/p><\/div>\n<h2>4. Lab Record Table (Fill During Practical)<\/h2>\n<p>Record your live deployment details below before taking screenshots and running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>VM Name<\/th><th>OS / Image<\/th><th>VM Size<\/th><th>Public IP Address<\/th><th>Web Server Status<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Windows VM<\/td><td>Win Server 2022<\/td><td>&nbsp;<\/td><td>&nbsp;<\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><code>vm-linux<\/code><\/td><td>Ubuntu 22.04<\/td><td>&nbsp;<\/td><td>&nbsp;<\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>5. Verification &amp; Screenshot Checklist<\/h2>\n<p>Before running Clean-up, verify and capture these four screenshots for your lab journal (include the date and CLI commands used):<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>IIS page loads from the Windows VM<\/td><td>Browser window showing <code>http://[Windows_PUBLIC_IP]<\/code> and the blue IIS Welcome page.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>Apache page loads from the Linux VM<\/td><td>Browser window showing <code>http://[Linux_PUBLIC_IP]<\/code> and the Apache2 Default Page.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>Windows VM Overview blade<\/td><td>Azure Portal → Virtual machines → your Windows VM → <strong>Overview<\/strong> showing <em>Size<\/em>, <em>Public IP address<\/em>, and <em>Status:<\/em> <em>Running<\/em>.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>4<\/strong><\/td><td>Linux VM Overview blade<\/td><td>Azure Portal → Virtual machines → <code>vm-linux<\/code> → <strong>Overview<\/strong> showing <em>Size<\/em>, <em>Public IP address<\/em>, and <em>Status: Running<\/em> (plus optional Cloud Shell output of <code>systemctl<\/code> <code>status<\/code> <code>apache2<\/code>).<\/td><\/tr>\n<\/tbody><\/table>\n<h2>6. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these detailed answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: Which service model (IaaS, PaaS or SaaS) are VMs? Who is responsible for OS patching?<\/h2>\n<div class=\"callout tip\"><p>Virtual Machines belong to the <strong>Infrastructure as a Service (IaaS)<\/strong> cloud service model. Under Microsoft Azure’s <strong>Shared Responsibility Model<\/strong> for IaaS, Microsoft manages the physical datacenter, physical network, physical hosts, and virtualization hypervisor, whereas the <strong>customer<\/strong> <strong>(user) is responsible for OS patching<\/strong>, updating installed applications (such as IIS and Apache), configuring firewall/NSG rules, and securing the data inside the VM.<\/p><\/div>\n<h2>Question 2: Compare Stopped and Stopped (deallocated). Which one stops compute charges?<\/h2>\n<table>\n<thead>\n<tr><th>Aspect<\/th><th>Stopped (OS Shutdown)<\/th><th>Stopped (Deallocated)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>How it happens<\/strong><\/td><td>Shutting down from inside the VM OS (e.g., Windows Start → Shut down or <code>sudo<\/code> <code>shutdown<\/code>).<\/td><td>Clicking <strong>Stop<\/strong> in the Azure Portal or running <code>az<\/code> <code>vm<\/code> <code>deallocate<\/code> in Azure CLI.<\/td><\/tr>\n<tr><td><strong>Hardware allocation<\/strong><\/td><td>Azure keeps physical CPU and RAM hardware reserved for your VM.<\/td><td>Azure releases the physical compute hardware back to its shared pool.<\/td><\/tr>\n<tr><td><strong>Compute charges<\/strong><\/td><td><strong>Still billed!<\/strong> Compute charges continue even though the OS is off.<\/td><td><strong>Compute charges stop!<\/strong> Only minimal storage/disk (and static IP) charges remain.<\/td><\/tr>\n<tr><td><strong>Dynamic Public IP<\/strong><\/td><td>Retained while in Stopped state.<\/td><td>Released unless a Static Public IP is assigned.<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Direct Answer:<\/strong> <strong>Stopped (deallocated)<\/strong> is the state that stops compute (CPU/RAM) billing charges.<\/p>\n<h2>Question 3: In the Availability options of the Create VM page, what is the difference between Availability zone, Availability set and Virtual Machine Scale Set?<\/h2>\n<table>\n<thead>\n<tr><th>Availability Option<\/th><th>How It Works<\/th><th>What Failure / Need It Solves<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Availability Zone<\/strong><\/td><td>Places VMs across physically separate datacenters within the same Azure region, each with independent power, cooling, and networking.<\/td><td>Protects against an <strong>entire<\/strong> <strong>datacenter outage<\/strong> (highest high-availability SLA, 99.99% with 2+ zones).<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Availability Option<\/th><th>How It Works<\/th><th>What Failure / Need It Solves<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Availability Set<\/strong><\/td><td>Logically groups VMs inside a single datacenter across separate <strong>Fault Domains<\/strong> (different server racks/power) and <strong>Update Domains<\/strong> (staggered maintenance reboots).<\/td><td>Protects against <strong>rack hardware<\/strong> <strong>failures<\/strong> and planned Microsoft maintenance inside one datacenter.<\/td><\/tr>\n<tr><td><strong>Virtual Machine Scale<\/strong> <strong>Set (VMSS)<\/strong><\/td><td>Automatically creates, manages, and load-balances a group of identical VMs that scale out (add VMs) or scale in (remove VMs) based on CPU/traffic demand.<\/td><td>Provides <strong>elasticity, auto-scaling,<\/strong> <strong>and centralized management<\/strong> for variable workloads.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 4: Why is opening RDP or SSH to Any source risky?<\/h2>\n<div class=\"callout tip\"><p>RDP (TCP Port <code>3389<\/code>) and SSH (TCP Port <code>22<\/code>) are administrative management ports that grant direct system login access. Allowing <strong>Any<\/strong> source IP ( <code>0.0.0.0/0<\/code>) exposes those ports to the entire public internet, where automated bots continuously scan cloud IP ranges within minutes of a VM launching. This creates high risk of <strong>brute-force and credential-stuffing attacks<\/strong>, exploitation of unpatched remote-access vulnerabilities, ransomware deployment, or cryptojacking. Best practice (especially in cybersecurity) is to restrict the source IP to your own IP address, use SSH keys instead of passwords, or use <strong>Azure Bastion<\/strong> / Just-In-Time (JIT) VM access.<\/p><\/div>\n<h2>7. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Once all four screenshots are saved in your lab journal, run both commands below in <strong>Cloud Shell<\/strong> <strong>(Bash)<\/strong> (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<pre class=\"code\"><code>az vm deallocate --resource-group rg-lab2-ROLLNO --name vm-linux\naz group delete --name rg-lab2-ROLLNO --yes --no-wait<\/code><\/pre>\n<p class=\"li\">• <strong>Why two commands?<\/strong> The first command practices properly deallocating a running VM ( <code>Stopped<\/code> <code>(deallocated)<\/code>) so compute billing stops immediately. The second command deletes the entire resource group—removing both VMs, their managed disks, public IPs, virtual network, and NSGs cleanly in one shot.<\/p>\n<p class=\"li\">• <strong>Confirm Clean-up:<\/strong> After 2–3 minutes, check <strong>Virtual machines<\/strong> in the Azure Portal or run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> in Cloud Shell to confirm <code>rg-lab2-ROLLNO<\/code> is gone.<\/p>\n<h2>8. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>SkuNotAvailable<\/code> when creating VM<\/td><td>Your chosen size ( <code>Standard_B2s<\/code> or <code>Standard_B1s<\/code>) is temporarily out of capacity in Central India. Select another available B-series size (e.g., <code>Standard_B2ls_v2<\/code>).<\/td><\/tr>\n<tr><td>Browser times out on <code>http://PUBLIC_IP<\/code><\/td><td>Check two things: (1) You typed <code>http://<\/code> and not <code>https://<\/code>; (2) Port 80 is actually allowed in the VM’s <strong>Networking / Network settings<\/strong> inbound rules.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>RDP login says <em>“Credentials did not<\/em> <em>work”<\/em><\/td><td>Click <strong>More choices → Use a different account<\/strong> and type only your VM username (e.g., <code>.\\azureadmin<\/code>) instead of your Microsoft email address.<\/td><\/tr>\n<tr><td>Windows VM name rejected<\/td><td>Windows computer names cannot exceed <strong>15 characters<\/strong> and cannot contain spaces or special symbols (use a short name like <code>vm-win-042<\/code>).<\/td><\/tr>\n<tr><td>Stuck on <code>systemctl<\/code> <code>status<\/code> <code>apache2<\/code><\/td><td>The output viewer pauses at the bottom ( <code>lines<\/code> <code>1-14/14<\/code> <code>(END)<\/code>). Simply press the <code>q<\/code> key on your keyboard to quit back to the command prompt.<\/td><\/tr>\n<\/tbody><\/table>", "3": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 3: Virtual Networks, Subnets and Network Security Groups<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO2  |  <strong>Theory Alignment:<\/strong> Unit 2  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Build a Virtual Network (VNet) with two subnets, place VMs in them, and control traffic with Network Security Group (NSG) rules.<\/p>\n<p><strong>Prerequisites:<\/strong> Labs 1 and 2 completed; basic idea of IP addressing and CIDR notation (explained simply below).<\/p>\n<div class=\"callout info\"><strong class=\"callout-title\">Before You Start: 4 Essential Beginner Tips for Lab 3<\/strong><p class=\"li sub\">• <strong>Replace <\/strong><code>ROLLNO<\/code><strong> in every command:<\/strong> Use your lowercase roll number (for example, <code>rg-lab3-cfis042<\/code>).<\/p><p class=\"li sub\">• <strong>Keep TWO areas visible during Part C:<\/strong> You can minimize/resize Cloud Shell at the bottom of the browser (or open <code>portal.azure.com<\/code> in a second browser tab) so your SSH session inside <code>vm-web<\/code> stays open while you click through the Portal.<\/p><p class=\"li sub\">• <strong>Wait 30–60 seconds after changing an NSG rule:<\/strong> Azure takes a short moment to push firewall updates down to the virtual network card. If <code>ping<\/code> still succeeds 2 seconds after saving a Deny rule, wait 30 seconds and run <code>ping<\/code> again.<\/p><p class=\"li sub\">• <strong>Two VMs = double credit burn if forgotten:<\/strong> Always run the single Clean-up command at the end once you finish taking screenshots.<\/p><\/div>\n<h2>1. Plain-English Overview: What You Are Building<\/h2>\n<p>Think of an Azure <strong>Virtual Network (VNet)<\/strong> like a private office building in the cloud. Inside that building you create separate rooms called <strong>Subnets<\/strong>, and at the doorway of each room you place a security guard called a <strong>Network Security Group (NSG)<\/strong> that checks a list of Allow/Deny rules for every network packet.<\/p>\n<div class=\"callout info\"><p><strong>Virtual Network: <\/strong><code>vnet-lab3<\/code> — Address Space: <code>10.10.0.0/16<\/code> (65,536 private IP addresses)<\/p><p class=\"li\">• <strong>Room 1 — Web Subnet: <\/strong><code>snet-web<\/code> ( <code>10.10.1.0/24<\/code> → 251 usable Azure IPs)<\/p><p class=\"li\">• <strong>Security Guard:<\/strong> <code>nsg-web<\/code> (Allows Inbound HTTP Port <code>80<\/code> &amp; SSH Port <code>22<\/code> from Internet)<\/p><p class=\"li\">• <strong>VM Inside:<\/strong> <code>vm-web<\/code> (Ubuntu Linux — has a <strong>Public IP<\/strong> so you can SSH into it, plus a Private IP like <code>10.10.1.4<\/code>)<\/p><\/div>\n<hr class=\"pg\">\n<div class=\"callout info\"><p class=\"li\">• <strong>Room 2 — Application Subnet: <\/strong><code>snet-app<\/code> ( <code>10.10.2.0/24<\/code> → 251 usable Azure IPs)<\/p><p class=\"li\">• <strong>Security Guard:<\/strong> None at first → later you attach <code>nsg-app<\/code> (Denies ICMP ping from <code>10.10.1.0/24<\/code>)<\/p><p class=\"li\">• <strong>VM Inside:<\/strong> <code>vm-app<\/code> (Ubuntu Linux — <strong>NO Public IP<\/strong>! Only a Private IP like <code>10.10.2.4<\/code>)<\/p><\/div>\n<div class=\"callout tip\"><p><strong>Quick CIDR Refresher:<\/strong> In <code>10.10.0.0/16<\/code>, the first two numbers ( <code>10.10<\/code>) are fixed for the whole VNet. In <code>10.10.1.0/24<\/code> and <code>10.10.2.0/24<\/code>, the first three numbers are fixed, giving each subnet its own isolated range of addresses. Azure reserves 5 IPs per subnet for internal management, so your first VM always starts at <code>.4<\/code> (e.g., <code>10.10.1.4<\/code> and <code>10.10.2.4<\/code>).<\/p><\/div>\n<h2>2. Part A: Create the Network, Subnets &amp; Web NSG (Cloud Shell CLI)<\/h2>\n<p>Sign in at <code>portal.azure.com<\/code>, click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right of the blue bar, and confirm you are in <strong>Bash<\/strong> mode. Run the 7 commands below one by one (remember to replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<h2>Step 1: Create the Resource Group<\/h2>\n<pre class=\"code\"><code>az group create --name rg-lab3-ROLLNO --location centralindia<\/code><\/pre>\n<p>Creates the project folder <code>rg-lab3-ROLLNO<\/code> in Central India.<\/p>\n<h2>Step 2: Create the VNet and First Subnet ( snet-web )<\/h2>\n<pre class=\"code\"><code>az network vnet create --resource-group rg-lab3-ROLLNO --name vnet-lab3 --address-\nprefix 10.10.0.0/16 --subnet-name snet-web --subnet-prefix 10.10.1.0/24<\/code><\/pre>\n<p>Creates <code>vnet-lab3<\/code> with the big address space <code>10.10.0.0/16<\/code> and carves out the first subnet <code>snet-web<\/code> ( <code>10.10.1.0/24<\/code>).<\/p>\n<h2>Step 3: Add the Second Subnet ( snet-app )<\/h2>\n<pre class=\"code\"><code>az network vnet subnet create --resource-group rg-lab3-ROLLNO --vnet-name vnet-\nlab3 --name snet-app --address-prefixes 10.10.2.0/24<\/code><\/pre>\n<p>Adds the private application subnet <code>snet-app<\/code> ( <code>10.10.2.0/24<\/code>) inside <code>vnet-lab3<\/code>.<\/p>\n<hr class=\"pg\">\n<h2>Step 4: Create the Web NSG and Add HTTP + SSH Allow Rules<\/h2>\n<pre class=\"code\"><code>az network nsg create --resource-group rg-lab3-ROLLNO --name nsg-web\naz network nsg rule create --resource-group rg-lab3-ROLLNO --nsg-name nsg-web --\nname Allow-HTTP --priority 100 --protocol Tcp --direction Inbound --access Allow -\n-destination-port-ranges 80\naz network nsg rule create --resource-group rg-lab3-ROLLNO --nsg-name nsg-web --\nname Allow-SSH --priority 110 --protocol Tcp --direction Inbound --access Allow --\ndestination-port-ranges 22<\/code><\/pre>\n<p class=\"li\">• Creates firewall <code>nsg-web<\/code> with two custom Inbound rules: <code>Allow-HTTP<\/code> (Priority <code>100<\/code>, Port <code>80<\/code>) and <code>Allow-SSH<\/code> (Priority <code>110<\/code>, Port <code>22<\/code>).<\/p>\n<h2>Step 5: Attach nsg-web to Subnet snet-web<\/h2>\n<pre class=\"code\"><code>az network vnet subnet update --resource-group rg-lab3-ROLLNO --vnet-name vnet-\nlab3 --name snet-web --network-security-group nsg-web<\/code><\/pre>\n<p><strong>Why this step matters:<\/strong> Creating an NSG alone does nothing until you associate (attach) it to a subnet or a VM’s network card. This command links <code>nsg-web<\/code> to <code>snet-web<\/code>.<\/p>\n<h2>3. Part B: Deploy VMs into Subnets &amp; Test Connectivity (Cloud Shell CLI)<\/h2>\n<p>Now you will launch <code>vm-web<\/code> into <code>snet-web<\/code> (with a Public IP) and <code>vm-app<\/code> into <code>snet-app<\/code> (with NO Public IP).<\/p>\n<h2>Step 1: Deploy vm-web (Public Web Tier)<\/h2>\n<pre class=\"code\"><code>az vm create --resource-group rg-lab3-ROLLNO --name vm-web --image Ubuntu2204 --\nsize Standard_B1s --vnet-name vnet-lab3 --subnet snet-web --admin-username\nazureuser --generate-ssh-keys --nsg &#x27;&#x27;<\/code><\/pre>\n<p><strong>What <\/strong><code>--nsg<\/code> <code>&#x27;&#x27;<\/code><strong> means:<\/strong> Passing empty quotes tells Azure <em>“do not create a separate NSG on this<\/em> <em>VM’s network card”<\/em> because we already put <code>nsg-web<\/code> on the entire <code>snet-web<\/code> subnet. <em>(If<\/em> <code>Standard_B1s<\/code><em> is unavailable in Central India, substitute another B-series size such as<\/em> <code>Standard_B2s<\/code><em> .)<\/em><\/p>\n<h2>Step 2: Deploy vm-app (Private Application Tier — No Public IP)<\/h2>\n<pre class=\"code\"><code>az vm create --resource-group rg-lab3-ROLLNO --name vm-app --image Ubuntu2204 --\nsize Standard_B1s --vnet-name vnet-lab3 --subnet snet-app --admin-username\nazureuser --generate-ssh-keys --public-ip-address &#x27;&#x27; --nsg &#x27;&#x27;<\/code><\/pre>\n<p><strong>What <\/strong><code>--public-ip-address<\/code> <code>&#x27;&#x27;<\/code><strong> means:<\/strong> Empty quotes tell Azure <em>“do NOT assign a Public IP<\/em> <em>address to this VM.”<\/em> As a result, <code>vm-app<\/code> is completely unreachable from the public internet—only machines inside <code>vnet-lab3<\/code> can talk to it.<\/p>\n<hr class=\"pg\">\n<h2>Step 3: List IP Addresses of Both VMs<\/h2>\n<pre class=\"code\"><code>az vm list-ip-addresses --resource-group rg-lab3-ROLLNO --output table<\/code><\/pre>\n<p>Look closely at the output table and write the IPs into your Lab Record Table (Section 5). Notice that <code>vm-web<\/code> has <strong>both<\/strong> a Public IP and a Private IP (e.g., <code>10.10.1.4<\/code>), while <code>vm-app<\/code> has <strong>only<\/strong> a Private IP (e.g., <code>10.10.2.4<\/code>).<\/p>\n<h2>Step 4: SSH into vm-web and Ping vm-app (Baseline Test)<\/h2>\n<p>1. In Cloud Shell, connect to <code>vm-web<\/code> using its <strong>Public IP<\/strong> from Step 3:<\/p>\n<pre class=\"code\"><code>ssh azureuser@WEB_PUBLIC_IP<\/code><\/pre>\n<p>2. If asked <em>“Are you sure you want to continue connecting (yes/no)?”<\/em>, type <code>yes<\/code> and press <strong>Enter<\/strong>. Your prompt changes to <code>azureuser@vm-web:~$<\/code>.<\/p>\n<p>3. Now send 4 ICMP ping packets across the VNet to <code>vm-app<\/code> using its <strong>Private IP<\/strong> (usually <code>10.10.2.4<\/code>):<\/p>\n<pre class=\"code\"><code>ping -c 4 APP_PRIVATE_IP<\/code><\/pre>\n<p>4. <strong>Expected result (Ping Succeeds):<\/strong> You will see 4 replies and <code>4<\/code> <code>packets<\/code> <code>transmitted,<\/code> <code>4<\/code> <code>received,<\/code> <code>0%<\/code> <code>packet<\/code> <code>loss<\/code>. <strong>Take Screenshot #1 right now (Before Deny Rule)!<\/strong><\/p>\n<p>5. <strong>Leave this Cloud Shell terminal open<\/strong> while you perform Part C in the Azure Portal above it.<\/p>\n<h2>4. Part C: Block Traffic with an NSG &amp; Inspect Effective Rules (Azure Portal)<\/h2>\n<p>Now you will use the Azure Portal graphical interface to create a firewall for the application subnet ( <code>nsg-app<\/code>) and block pings coming from the web subnet.<\/p>\n<h2>Step 1: Create nsg-app and Add the Inbound ICMP Deny Rule<\/h2>\n<p>1. In the top-center Global Search Bar of the Azure Portal, type <code>Network<\/code> <code>security<\/code> <code>groups<\/code> and click <strong>Network security groups<\/strong> under Services.<\/p>\n<p>2. Click <strong>+ Create<\/strong> near the top-left.<\/p>\n<p>3. On the <strong>Basics<\/strong> tab, fill in: <strong>Subscription:<\/strong> Your active subscription.<\/p>\n<p class=\"li sub\">• <strong>Resource group:<\/strong> Select <code>rg-lab3-ROLLNO<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Name:<\/strong> Type <code>nsg-app<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p>4. Click <strong>Review + create<\/strong> → <strong>Create<\/strong>. Wait ~20 seconds, then click <strong>Go to resource<\/strong>.<\/p>\n<hr class=\"pg\">\n<p>5. You are now inside <code>nsg-app<\/code>. In the left vertical menu under <strong>Settings<\/strong>, click <strong>Inbound security<\/strong> <strong>rules<\/strong>.<\/p>\n<p>6. Look at the top toolbar of the rules list and click <strong>+ Add<\/strong>. A form slides out from the right edge. Fill in every field exactly as shown below:<\/p>\n<table>\n<thead>\n<tr><th>Form Field<\/th><th>Exact Value to Set<\/th><th>Beginner Explanation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Source<\/strong><\/td><td><code>IP<\/code> <code>Addresses<\/code><\/td><td>Lets you target traffic coming specifically from the web subnet range.<\/td><\/tr>\n<tr><td><strong>Source IP addresses/CIDR ranges<\/strong><\/td><td><code>10.10.1.0/24<\/code><\/td><td>The CIDR range of <code>snet-web<\/code> where <code>vm-web<\/code> lives.<\/td><\/tr>\n<tr><td><strong>Source port ranges<\/strong><\/td><td><code>*<\/code><\/td><td>Matches any source port.<\/td><\/tr>\n<tr><td><strong>Destination<\/strong><\/td><td><code>Any<\/code><\/td><td>Applies to any VM inside the protected subnet.<\/td><\/tr>\n<tr><td><strong>Service<\/strong><\/td><td><code>Custom<\/code><\/td><td>Allows manually choosing the ICMP protocol.<\/td><\/tr>\n<tr><td><strong>Destination port ranges<\/strong><\/td><td><code>*<\/code><\/td><td>Keep <code>*<\/code> (asterisk) because ICMP ping does not use TCP/UDP ports.<\/td><\/tr>\n<tr><td><strong>Protocol<\/strong><\/td><td><code>ICMP<\/code><\/td><td>The protocol used by the <code>ping<\/code> command.<\/td><\/tr>\n<tr><td><strong>Action<\/strong><\/td><td><code>Deny<\/code><\/td><td>Blocks matching traffic.<\/td><\/tr>\n<tr><td><strong>Priority<\/strong><\/td><td><code>100<\/code><\/td><td>Low number = evaluated BEFORE Azure’s default <code>AllowVnetInBound<\/code> (65000).<\/td><\/tr>\n<tr><td><strong>Name<\/strong><\/td><td><code>Deny-ICMP-from-web<\/code><\/td><td>Exact rule name required by the lab manual.<\/td><\/tr>\n<\/tbody><\/table>\n<p>7. Click the blue <strong>Add<\/strong> button at the bottom of the slide-out panel. Confirm <code>Deny-ICMP-from-web<\/code> appears at the top of the Inbound security rules list (Priority <code>100<\/code>). <strong>Take a screenshot of this<\/strong><\/p>\n<h3>NSG rule list for Verification!<\/h3>\n<h2>Step 2: Associate nsg-app with Subnet snet-app<\/h2>\n<p>Remember: <code>nsg-app<\/code> is not blocking anything yet until you attach it to <code>snet-app<\/code> !<\/p>\n<p>1. In the top-center Global Search Bar, type <code>Virtual<\/code> <code>networks<\/code> and click <strong>Virtual networks<\/strong>.<\/p>\n<p>2. Click on <strong>vnet-lab3<\/strong> to open it.<\/p>\n<p>3. In the left vertical menu of <code>vnet-lab3<\/code>, under <strong>Settings<\/strong>, click <strong>Subnets<\/strong>.<\/p>\n<p>4. You will see both subnets: <code>snet-web<\/code> (already showing <code>nsg-web<\/code>) and <code>snet-app<\/code> (showing <em>None<\/em> under Security group).<\/p>\n<hr class=\"pg\">\n<p>5. Click directly on <strong>snet-app<\/strong>. A panel slides out from the right edge.<\/p>\n<p>6. Look for the <strong>Security<\/strong> section (or <strong>Network security group<\/strong> dropdown), open the dropdown, and select <strong>nsg-app<\/strong>.<\/p>\n<p>7. Click <strong>Save<\/strong> at the bottom of the slide-out panel. Wait ~15 seconds until the notification says <em>Saved<\/em> <em>subnet<\/em>.<\/p>\n<p>8. Look back at the <strong>Subnets<\/strong> table: <code>snet-web<\/code> now shows <code>nsg-web<\/code> and <code>snet-app<\/code> now shows <code>nsg-app<\/code>. <strong>Take a screenshot of this VNet Subnets blade for Verification!<\/strong><\/p>\n<h2>Step 3: Repeat the Ping Test (Verify Block, Then Reverse It)<\/h2>\n<p>1. Wait <strong>30 seconds<\/strong> for Azure to enforce the new subnet firewall rule.<\/p>\n<p>2. Click back into your Cloud Shell terminal (still logged in as <code>azureuser@vm-web<\/code>) and run the exact same ping command:<\/p>\n<pre class=\"code\"><code>ping -c 4 APP_PRIVATE_IP<\/code><\/pre>\n<p>3. <strong>Expected result (Ping Fails):<\/strong> The terminal pauses for ~4 seconds with no replies and then prints <code>4<\/code> <code>packets<\/code> <code>transmitted,<\/code> <code>0<\/code> <code>received,<\/code> <code>100%<\/code> <code>packet<\/code> <code>loss<\/code>. <strong>Take Screenshot #2 right now<\/strong><\/p>\n<h3>(After Deny Rule)!<\/h3>\n<p>4. <strong>Now test reversing the rule (Manual Step 3):<\/strong> In the Azure Portal, open <strong>Network security groups<\/strong> → <strong>nsg-app<\/strong> → <strong>Inbound security rules<\/strong>.<\/p>\n<p class=\"li sub\">• Click on <strong>Deny-ICMP-from-web<\/strong>, change <strong>Action<\/strong> from <code>Deny<\/code> to <strong>Allow<\/strong>, and click <strong>Save<\/strong> (alternatively, click the <code>...<\/code> menu on the right of the rule and click <strong>Delete<\/strong>).<\/p>\n<p class=\"li sub\">• Wait 30 seconds, return to <code>vm-web<\/code> in Cloud Shell, and run <code>ping<\/code> <code>-c<\/code> <code>4<\/code> <code>APP_PRIVATE_IP<\/code> again. Confirm that ping replies succeed again ( <code>0%<\/code> <code>packet<\/code> <code>loss<\/code>).<\/p>\n<p>5. Type <code>exit<\/code> in Cloud Shell to disconnect SSH from <code>vm-web<\/code> and return to your Azure Cloud Shell prompt ( <code>user@Azure:~$<\/code>).<\/p>\n<h2>Step 4: Inspect Effective Security Rules on a Network Interface<\/h2>\n<p><em>Where is Effective security rules hidden?<\/em> Beginners often struggle to find it because it lives on the VM’s <strong>Network Interface (NIC)<\/strong> rather than inside the NSG itself. Follow this exact path:<\/p>\n<p>1. In the top-center Global Search Bar, type <code>Network<\/code> <code>interfaces<\/code> and click <strong>Network interfaces<\/strong> under Services.<\/p>\n<p>2. Click the network interface belonging to <code>vm-app<\/code> (named something like <code>vm-appVMNic<\/code>). <em>(Alternative path: open Virtual machines → <\/em><code>vm-app<\/code><em> → Networking → Network settings → click<\/em> <em>the blue Network interface link.)<\/em><\/p>\n<p>3. In the left vertical menu of the Network interface, scroll down to the <strong>Help<\/strong> (or <strong>Support +<\/strong> <strong>troubleshooting<\/strong>) section at the bottom and click <strong>Effective security rules<\/strong>.<\/p>\n<p>4. Wait 5–10 seconds for Azure to calculate the combined rules applied to that VM.<\/p>\n<hr class=\"pg\">\n<p>5. Scroll through the <strong>Inbound<\/strong> table and note the built-in Azure default rules at the bottom (priorities <code>65000<\/code> – <code>65500<\/code>): <code>AllowVnetInBound<\/code> (Priority <code>65000<\/code>) — Allows all VMs inside the same VNet to communicate with each other by default.<\/p>\n<p class=\"li sub\">• <code>AllowAzureLoadBalancerInBound<\/code> (Priority <code>65001<\/code>) — Allows Azure Load Balancer health probes.<\/p>\n<p class=\"li sub\">• <code>DenyAllInBound<\/code> (Priority <code>65500<\/code>) — Blocks every other inbound packet that did not match a higher-priority Allow rule.<\/p>\n<h2>5. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>VM Name<\/th><th>Subnet &amp; CIDR<\/th><th>Public IP Address<\/th><th>Private IP Address<\/th><th>Attached Subnet NSG<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>vm-web<\/code><\/td><td><code>snet-web<\/code> (10.10.1.0/24)<\/td><td>&nbsp;<\/td><td>&nbsp;<\/td><td><code>nsg-web<\/code><\/td><\/tr>\n<tr><td><code>vm-app<\/code><\/td><td><code>snet-app<\/code> (10.10.2.0/24)<\/td><td><em>None (Private only)<\/em><\/td><td>&nbsp;<\/td><td><code>nsg-app<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<h2>6. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Ping succeeds before the Deny rule<\/td><td>Cloud Shell SSH terminal on <code>vm-web<\/code> showing <code>ping<\/code> <code>-c<\/code> <code>4<\/code> <code>APP_PRIVATE_IP<\/code> with <code>0%<\/code> <code>packet<\/code> <code>loss<\/code>.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>Ping fails after the Deny rule<\/td><td>Cloud Shell SSH terminal on <code>vm-web<\/code> showing <code>ping<\/code> <code>-c<\/code> <code>4<\/code> <code>APP_PRIVATE_IP<\/code> with <code>100%<\/code> <code>packet<\/code> <code>loss<\/code> (plus optional third screenshot showing it succeeds again after Allow/Delete).<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>VNet Subnets blade<\/td><td>Portal → <code>vnet-lab3<\/code> → <strong>Subnets<\/strong> showing <code>snet-web<\/code> linked to <code>nsg-web<\/code> and <code>snet-app<\/code> linked to <code>nsg-app<\/code>.<\/td><\/tr>\n<tr><td><strong>4<\/strong><\/td><td>NSG rule list &amp; Effective security rules<\/td><td>Portal → <code>nsg-app<\/code> → <strong>Inbound security rules<\/strong> showing <code>Deny-ICMP-from-web<\/code> (Priority <code>100<\/code>), plus optional screenshot of <strong>Effective security rules<\/strong> showing <code>AllowVnetInBound<\/code> and <code>DenyAllInBound<\/code>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>7. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these complete, clear answers for your lab journal and viva preparation:<\/p>\n<hr class=\"pg\">\n<h2>Question 1: How do NSG rule priorities decide which rule is applied?<\/h2>\n<div class=\"callout tip\"><p>Azure evaluates Network Security Group rules in order from the <strong>lowest priority number to the<\/strong> <strong>highest priority number<\/strong> (custom rules range from <code>100<\/code> to <code>4096<\/code>, while built-in default rules sit at <code>65000<\/code> – <code>65500<\/code>). Processing stops immediately at the <strong>first matching rule<\/strong> (first-match-wins), and all remaining rules with higher numbers are ignored. For example, in Part C our custom rule <code>Deny-ICMP-from-web<\/code> had Priority <code>100<\/code>, so it matched and dropped ping traffic <em>before<\/em> Azure ever reached the default <code>AllowVnetInBound<\/code> rule at Priority <code>65000<\/code>.<\/p><\/div>\n<h2>Question 2: Why could vm-web reach vm-app without any rule being added at first?<\/h2>\n<div class=\"callout tip\"><p>Both <code>vm-web<\/code> (in <code>snet-web<\/code>) and <code>vm-app<\/code> (in <code>snet-app<\/code>) reside inside the <strong>same Virtual Network<\/strong> <strong>(<\/strong> <code>vnet-lab3<\/code><strong> )<\/strong>. By default, Azure automatically creates system routing between all subnets within a VNet and includes two built-in NSG default rules: <code>AllowVnetInBound<\/code> (Priority <code>65000<\/code>) and <code>AllowVnetOutBound<\/code> (Priority <code>65000<\/code>). Because <code>snet-app<\/code> had no custom Deny rule at first, internal VNet traffic between subnets was automatically permitted.<\/p><\/div>\n<h2>Question 3: What is the difference between a public and a private endpoint? Where would VNet peering, VPN Gateway and ExpressRoute fit in this design?<\/h2>\n<table>\n<thead>\n<tr><th>Networking Concept<\/th><th>How It Works<\/th><th>Where It Fits in Our Design<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Public Endpoint<\/strong><\/td><td>Exposes an Azure service or VM via a <strong>public IP<\/strong> <strong>address<\/strong> accessible over the public internet (e.g., <code>vm-web<\/code> ’s public IP).<\/td><td>Used at the external front edge ( <code>snet-web<\/code>) when public internet users must reach a web server.<\/td><\/tr>\n<tr><td><strong>Private Endpoint<\/strong><\/td><td>Assigns a <strong>private IP address from your VNet<\/strong> to an Azure PaaS service (like Azure Storage or Azure SQL) via Azure Private Link, keeping all traffic off the public internet.<\/td><td>Placed inside a private subnet (like <code>snet-app<\/code>) so <code>vm-app<\/code> accesses databases or storage strictly over private IPs.<\/td><\/tr>\n<tr><td><strong>VNet Peering<\/strong><\/td><td>Connects two Azure VNets privately over Microsoft’s high-speed backbone network with low latency and no internet transit.<\/td><td>Used to connect <code>vnet-lab3<\/code> to another Azure VNet (such as a shared logging, database, or hub VNet).<\/td><\/tr>\n<tr><td><strong>VPN Gateway<\/strong><\/td><td>Creates an <strong>encrypted IPsec/IKE tunnel over<\/strong> <strong>the public internet<\/strong> between an on-premises office network and an Azure VNet.<\/td><td>Deployed in a dedicated <code>GatewaySubnet<\/code> inside <code>vnet-lab3<\/code> so office staff or admins can securely connect to <code>vm-app<\/code> from campus/office.<\/td><\/tr>\n<tr><td><strong>ExpressRoute<\/strong><\/td><td>Provides a <strong>dedicated, private physical fiber<\/strong> <strong>circuit<\/strong> from an on-premises datacenter to Microsoft Azure via a connectivity provider (does not traverse the public internet).<\/td><td>Replaces or backs up VPN Gateway in enterprise environments needing predictable high bandwidth, ultra-low latency, and strict compliance.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>Question 4: Why is the application tier given no public IP?<\/h2>\n<div class=\"callout tip\"><p>Removing the public IP from the application tier ( <code>vm-app<\/code>) applies the cybersecurity principle of <strong>Defense-in-Depth<\/strong> and minimizes the <strong>attack surface<\/strong>. End users only need to interact with the public-facing web tier ( <code>vm-web<\/code>), never directly with backend application logic or databases. Without a public IP, external attackers on the internet cannot directly scan, brute-force, or send exploit traffic to <code>vm-app<\/code>. Even if the web tier is targeted, traffic to the application tier can be tightly filtered using subnet NSGs (like <code>nsg-app<\/code>) so only authorized internal requests are allowed.<\/p><\/div>\n<h2>8. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Make sure you have exited SSH (your prompt should say <code>user@Azure:~$<\/code>, not <code>azureuser@vm-web:~$<\/code>) and saved all verification screenshots. Then run this command in <strong>Cloud Shell (Bash)<\/strong>:<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab3-ROLLNO --yes --no-wait<\/code><\/pre>\n<p>This single command cleanly deletes both VMs, their managed disks, network interfaces, public IP, <code>vnet-lab3<\/code>, both subnets, <code>nsg-web<\/code>, and <code>nsg-app<\/code>. Wait 2–3 minutes and run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> to confirm <code>rg-lab3-ROLLNO<\/code> is gone.<\/p>\n<h2>9. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>ssh<\/code> <code>azureuser@WEB_PUBLIC_IP<\/code> hangs / times out<\/td><td>Check that you ran Step 4 &amp; Step 5 of Part A: <code>Allow-SSH<\/code> (Port <code>22<\/code>) must exist in <code>nsg-web<\/code>, AND <code>nsg-web<\/code> must be attached to <code>snet-web<\/code>.<\/td><\/tr>\n<tr><td>Ping STILL succeeds after adding <code>Deny-ICMP-from-web<\/code><\/td><td>Two common causes: (1) You created <code>nsg-app<\/code> but forgot Step 2 (attaching <code>nsg-app<\/code> to <code>snet-app<\/code>); or (2) Azure is still propagating the rule—wait 30–60 seconds and test again.<\/td><\/tr>\n<tr><td>Portal rejects <code>Deny-ICMP
