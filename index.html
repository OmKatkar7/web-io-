-from-web<\/code> form<\/td><td>Ensure <strong>Source<\/strong> is set to <code>IP<\/code> <code>Addresses<\/code> (not <em>Any<\/em>), <strong>Source IP<\/strong> <strong>addresses/CIDR ranges<\/strong> is <code>10.10.1.0/24<\/code>, <strong>Destination port ranges<\/strong> is <code>*<\/code>, and <strong>Protocol<\/strong> is <code>ICMP<\/code>.<\/td><\/tr>\n<tr><td><code>SkuNotAvailable<\/code> on <code>Standard_B1s<\/code><\/td><td>Replace <code>--size<\/code> <code>Standard_B1s<\/code> with another available B-series size (e.g., <code>Standard_B2s<\/code> or <code>Standard_B2ls_v2<\/code>) in Central India.<\/td><\/tr>\n<tr><td>Clean-up command says <code>az:<\/code> <code>command<\/code> <code>not<\/code> <code>found<\/code><\/td><td>You are still SSH’d inside <code>vm-web<\/code> ! Type <code>exit<\/code> and press Enter first so you return to Azure Cloud Shell, then run <code>az<\/code> <code>group<\/code> <code>delete<\/code>.<\/td><\/tr>\n<\/tbody><\/table>", "4": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 4: Azure Storage: Blob, Files and Queues<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO3  |  <strong>Theory Alignment:<\/strong> Unit 2  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Create a storage account and work with Blob containers, SAS tokens, access tiers, File shares and Queues.<\/p>\n<p><strong>Prerequisites:<\/strong> Lab 1 completed; access to Azure Cloud Shell (Bash) inside <code>portal.azure.com<\/code>.<\/p>\n<div class=\"callout info\"><strong class=\"callout-title\">Before You Start: 4 Crucial Beginner Tips for Lab 4<\/strong><p class=\"li sub\">• <strong>Write down your generated storage account name (<\/strong> <code>$ST<\/code><strong> ):<\/strong> Part A uses <code>ST=stlab4$RANDOM<\/code> to create a unique name like <code>stlab418492<\/code>. If your Cloud Shell terminal disconnects or refreshes before Part C, <code>$ST<\/code> becomes blank—so write it in the Lab Record Table below right after Step 2.<\/p><p class=\"li sub\">• <strong>How to test SAS URL expiration without waiting a full hour:<\/strong> Verification asks you to confirm that the SAS URL works and then fails after expiry. You can set the expiry time <strong>3 to 5<\/strong> <strong>minutes<\/strong> from the current time (instead of a full hour) so you can capture both the working download and the post-expiry error during your lab session!<\/p><p class=\"li sub\">• <strong>Change the blob to Archive tier LAST:<\/strong> Once you switch <code>hello.txt<\/code> to the <strong>Archive<\/strong> tier, it becomes locked offline and cannot be downloaded until rehydrated—so always finish your SAS URL download test first.<\/p><p class=\"li sub\">• <strong>Replace <\/strong><code>ROLLNO<\/code><strong> with your lowercase roll number<\/strong> (e.g., <code>rg-lab4-cfis042<\/code>) and always run the Clean-up command at the end.<\/p><\/div>\n<h2>1. Plain-English Overview: The 4 Services Inside an Azure Storage Account<\/h2>\n<p>An <strong>Azure Storage Account<\/strong> is a single cloud container that gives you four distinct types of cloud storage under one roof. In this lab you will interact with all four:<\/p>\n<table>\n<thead>\n<tr><th>Storage Service<\/th><th>What It Is (Plain English)<\/th><th>What You Do in Lab 4<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1. Blob Storage<\/strong><\/td><td>Object storage for unstructured files (text, images, videos, backups) organized inside folders called <strong>Containers<\/strong>.<\/td><td>Create container <code>labdata<\/code>, upload <code>hello.txt<\/code>, test Private vs. SAS URL, and change access tiers (Hot → Cool → Archive).<\/td><\/tr>\n<tr><td><strong>2. Azure Files<\/strong><\/td><td>Managed cloud network drives (SMB/NFS) that can be mounted simultaneously onto Windows or Linux VMs like a shared folder.<\/td><td>Create a 5 GiB file share named <code>labshare<\/code> and upload a file via the Portal.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Storage Service<\/th><th>What It Is (Plain English)<\/th><th>What You Do in Lab 4<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>3. Queue Storage<\/strong><\/td><td>A lightweight messaging line (FIFO buffer) used to pass text messages asynchronously between decoupled application components.<\/td><td>Create <code>labqueue<\/code>, push the message <code>HelloQueue<\/code>, and peek at it in Base64 encoded form.<\/td><\/tr>\n<tr><td><strong>4. Table Storage<\/strong><\/td><td>A fast, schema-less NoSQL key-attribute data store for structured non-relational records.<\/td><td>Open the <strong>Tables<\/strong> blade in the Portal to inspect how Table storage is structured.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Storage Account and Blob Storage (Cloud Shell CLI)<\/h2>\n<p>Sign in at <code>portal.azure.com<\/code>, click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right of the blue header bar, and confirm you are in <strong>Bash<\/strong> mode. Run the commands below step by step:<\/p>\n<h2>Step 1: Create Resource Group rg-lab4-ROLLNO<\/h2>\n<pre class=\"code\"><code>az group create --name rg-lab4-ROLLNO --location centralindia<\/code><\/pre>\n<p>Creates your project folder <code>rg-lab4-ROLLNO<\/code> in Central India (replace <code>ROLLNO<\/code> with your lowercase roll number).<\/p>\n<h2>Step 2: Generate a Unique Name and Create the Storage Account<\/h2>\n<pre class=\"code\"><code>ST=stlab4$RANDOM\necho $ST\naz storage account create --name $ST --resource-group rg-lab4-ROLLNO --location\ncentralindia --sku Standard_LRS --kind StorageV2 --access-tier Hot<\/code><\/pre>\n<p class=\"li\">• <strong>How <\/strong><code>ST=stlab4$RANDOM<\/code><strong> works:<\/strong> <code>$RANDOM<\/code> is a built-in Bash variable that picks a random number (0–32767), producing a globally unique lowercase storage name such as <code>stlab424910<\/code>. Running <code>echo<\/code> <code>$ST<\/code> prints that exact name—<strong>write it down in Section 5 right now<\/strong>!<\/p>\n<p class=\"li\">• <strong>Parameters explained:<\/strong> <code>--sku<\/code> <code>Standard_LRS<\/code> uses standard hard-drive performance with Locally-Redundant Storage; <code>--kind<\/code> <code>StorageV2<\/code> creates a modern General-Purpose v2 account; <code>--access-tier<\/code> <code>Hot<\/code> optimizes pricing for frequently accessed data. Wait ~30 seconds for deployment to finish.<\/p>\n<h2>Step 3: Create Blob Container labdata and Upload hello.txt<\/h2>\n<pre class=\"code\"><code>az storage container create --account-name $ST --name labdata --auth-mode key\necho Hello Azure &gt; hello.txt\naz storage blob upload --account-name $ST --container-name labdata --name\nhello.txt --file hello.txt --auth-mode key\naz storage blob list --account-name $ST --container-name labdata --output table --\nauth-mode key<\/code><\/pre>\n<hr class=\"pg\">\n<h3>What each command does:<\/h3>\n<p>1. Creates a private Blob container named <code>labdata<\/code> inside <code>$ST<\/code> using your storage account access key ( <code>--auth-mode<\/code> <code>key<\/code>).<\/p>\n<p>2. Creates a small local text file named <code>hello.txt<\/code> inside Cloud Shell containing the words <code>Hello<\/code> <code>Azure<\/code>.<\/p>\n<p>3. Uploads <code>hello.txt<\/code> into the <code>labdata<\/code> container as a blob.<\/p>\n<p>4. Lists all blobs inside <code>labdata<\/code> as a table—confirm <code>hello.txt<\/code> appears with tier <code>Hot<\/code>.<\/p>\n<h2>3. Part B: Access Level, SAS Tokens, Access Tiers &amp; Redundancy (Portal)<\/h2>\n<p>Now switch to the graphical Azure Portal above Cloud Shell (you can click the minimize <code>_<\/code> icon on the Cloud Shell toolbar to give yourself a full screen).<\/p>\n<h2>Step 1: Confirm Container Access Level is Private and Test the Direct Blob URL<\/h2>\n<p>1. In the top-center Global Search Bar of the Azure Portal, type <code>Storage<\/code> <code>accounts<\/code> and click <strong>Storage accounts<\/strong> under Services.<\/p>\n<p>2. Click on your storage account ( <code>stlab4...<\/code>, the exact name printed by <code>echo<\/code> <code>$ST<\/code>).<\/p>\n<p>3. In the left vertical menu of your storage account, scroll down to the <strong>Data storage<\/strong> section and click <strong>Containers<\/strong>.<\/p>\n<p>4. Look at the table row for <strong>labdata<\/strong>: under the <strong>Public access level<\/strong> column, confirm it says <strong>Private<\/strong> <strong>(no anonymous access)<\/strong>.<\/p>\n<p>5. Click on <strong>labdata<\/strong> to open the container, then click on <strong>hello.txt<\/strong>. A properties panel slides out from the right edge.<\/p>\n<p>6. On the <strong>Overview<\/strong> tab of the <code>hello.txt<\/code> panel, locate the <strong>URL<\/strong> field (it looks like <code>https://stlab4xxxx.blob.core.windows.net/labdata/hello.txt<\/code>) and click the <strong>Copy to<\/strong> <strong>clipboard<\/strong> icon next to it.<\/p>\n<p>7. Open a new browser tab, paste that URL into the address bar, and press <strong>Enter<\/strong>.<\/p>\n<p>8. <strong>Expected Error:<\/strong> The browser displays an XML error message: <code>&lt;Code&gt;ResourceNotFound&lt;/Code&gt;<\/code> <code>&lt;Message&gt;The<\/code> <code>specified<\/code> <code>resource<\/code> <code>does<\/code> <code>not<\/code> <code>exist.<\/code><\/p>\n<p class=\"li\">• <code>&lt;/Message&gt;<\/code>. Azure intentionally returns <em>ResourceNotFound<\/em> for unauthorized requests on private containers so attackers cannot probe whether private files exist. <strong>Take Screenshot #1 of this<\/strong> <strong>error!<\/strong><\/p>\n<h2>Step 2: Generate a Shared Access Signature (SAS) URL and Test Expiry<\/h2>\n<p>1. Return to the Azure Portal tab where the <code>hello.txt<\/code> panel is still open.<\/p>\n<p>2. At the top of the <code>hello.txt<\/code> panel, click the <strong>Generate SAS<\/strong> tab (next to <em>Overview<\/em> and <em>Versions<\/em>).<\/p>\n<hr class=\"pg\">\n<p>3. Configure the SAS settings carefully: <strong>Signing method:<\/strong> Leave as <strong>Account key<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Signing key:<\/strong> Leave as <strong>key1<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Permissions:<\/strong> Check <strong>Read<\/strong> (leave Add, Create, Write, Delete unchecked).<\/p>\n<p class=\"li sub\">• <strong>Start and expiry date/time:<\/strong> Keep <strong>Start<\/strong> at the current date/time. Set <strong>Expiry<\/strong> to <strong>1 hour from<\/strong> <strong>now<\/strong> (or set it <strong>3–5 minutes from now<\/strong> if you want to capture the post-expiry failure right away without waiting an hour!).<\/p>\n<p class=\"li sub\">• <strong>Allowed protocols:<\/strong> Select <strong>HTTPS only<\/strong>.<\/p>\n<p>4. Click the blue <strong>Generate SAS token and URL<\/strong> button.<\/p>\n<p>5. Two boxes appear below the button. Copy the second box labeled <strong>Blob SAS URL<\/strong> (the long URL starting with <code>https://...<\/code> and ending with <code>&amp;sig=...<\/code>).<\/p>\n<p>6. Open a new browser tab, paste the <strong>Blob SAS URL<\/strong>, and press <strong>Enter<\/strong>.<\/p>\n<p>7. <strong>Expected Result (Works):<\/strong> The browser immediately displays <code>Hello<\/code> <code>Azure<\/code> (or downloads <code>hello.txt<\/code>)! <strong>Take Screenshot #2 right now!<\/strong><\/p>\n<p>8. <strong>Test Expiry (Verification requirement):<\/strong> Once the Expiry timestamp passes, refresh that exact same SAS URL browser tab. It will now fail with an XML <code>&lt;Code&gt;AuthenticationFailed&lt;/Code&gt;<\/code> error stating <em>“Signature not valid in the specified time frame”<\/em>. <strong>Take Screenshot #3 of this expired<\/strong> <strong>error!<\/strong><\/p>\n<h2>Step 3: Change Blob Access Tier (Hot → Cool → Archive) &amp; Record Rehydration<\/h2>\n<p>1. In the <code>hello.txt<\/code> panel in the Azure Portal, click back on the <strong>Overview<\/strong> tab (or click <strong>Change tier<\/strong> in the top toolbar of the panel).<\/p>\n<p>2. Open the <strong>Access tier<\/strong> dropdown, select <strong>Cool<\/strong>, and click <strong>Save<\/strong>. Notice the Access tier changes immediately to <em>Cool (inferred)<\/em> or <em>Cool<\/em>.<\/p>\n<p>3. Click <strong>Change tier<\/strong> again, open the <strong>Access tier<\/strong> dropdown, and select <strong>Archive<\/strong>.<\/p>\n<p>4. <strong>Read the warning banner that appears on screen<\/strong> before/after clicking <strong>Save<\/strong>, and record what Archive says about <strong>rehydration<\/strong> in your Lab Record Table (Section 5): <strong>What Archive &amp; Rehydration mean:<\/strong> Moving a blob to the <strong>Archive<\/strong> tier places it into offline storage at the lowest storage cost, meaning the blob <strong>cannot be read, downloaded, or<\/strong> <strong>modified<\/strong> while archived. To read an archived blob again, you must first change its tier back to <strong>Hot<\/strong> or <strong>Cool<\/strong>—a process called <strong>rehydration<\/strong>. Standard rehydration can take <strong>up to 15 hours<\/strong> (whereas High-priority rehydration completes in <strong>under 1 hour<\/strong> for blobs under 10 GB). Additionally, Archive blobs have an early-deletion minimum retention period of <strong>180 days<\/strong>.<\/p>\n<p>5. Click <strong>Save<\/strong> to complete switching <code>hello.txt<\/code> to <strong>Archive<\/strong>, then close the <code>hello.txt<\/code> slide-out panel (click the <strong>X<\/strong> at its top-right).<\/p>\n<hr class=\"pg\">\n<h2>Step 4: Inspect Data Redundancy Options (LRS, ZRS, GRS, GZRS)<\/h2>\n<p>1. In the left vertical menu of your storage account ( <code>stlab4...<\/code>), scroll down to the <strong>Data<\/strong> <strong>management<\/strong> section and click <strong>Redundancy<\/strong>.<\/p>\n<p>2. Examine the <strong>Redundancy<\/strong> dropdown and the visual replication diagram displayed on the page: Note the four primary options: <strong>Locally-redundant storage (LRS)<\/strong>, <strong>Zone-redundant storage<\/strong> <strong>(ZRS)<\/strong>, <strong>Geo-redundant storage (GRS)<\/strong>, and <strong>Geo-zone-redundant storage (GZRS)<\/strong> (plus Read-Access variants RA-GRS and RA-GZRS).<\/p>\n<p class=\"li sub\">• <strong>How storage cost changes:<\/strong> As you move from <strong>LRS → ZRS → GRS → GZRS<\/strong>, Azure maintains more physical copies across multiple availability zones and a secondary paired geographic region (up to 6 copies total), which increases durability and disaster protection— and correspondingly <strong>increases the per-GB storage price<\/strong> (GRS/GZRS roughly doubles storage cost compared to LRS).<\/p>\n<h2>4. Part C: File Share, Queue &amp; Table Storage (CLI + Portal)<\/h2>\n<h2>Step 1: Create a File Share and Queue Message via Cloud Shell<\/h2>\n<p>1. Re-open your <strong>Cloud Shell (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> terminal at the bottom of the Portal.<\/p>\n<p>2. First check whether your <code>$ST<\/code> variable is still stored by running <code>echo<\/code> <code>$ST<\/code>. <em>(If it prints an empty<\/em> <em>blank line because Cloud Shell timed out, re-assign it using the storage name you wrote down:<\/em> <code>ST=stlab4xxxxx<\/code><em> .)<\/em><\/p>\n<p>3. Run these four commands one by one:<\/p>\n<pre class=\"code\"><code>az storage share-rm create --resource-group rg-lab4-ROLLNO --storage-account $ST -\n-name labshare --quota 5\naz storage queue create --account-name $ST --name labqueue --auth-mode key\naz storage message put --account-name $ST --queue-name labqueue --content\nHelloQueue --auth-mode key\naz storage message peek --account-name $ST --queue-name labqueue --auth-mode key<\/code><\/pre>\n<p class=\"li\">• <strong>Command 1:<\/strong> Creates an Azure File Share named <code>labshare<\/code> with a maximum size quota of <code>5<\/code> GiB.<\/p>\n<p class=\"li\">• <strong>Command 2:<\/strong> Creates a message queue named <code>labqueue<\/code>.<\/p>\n<p class=\"li\">• <strong>Command 3:<\/strong> Places the message <code>HelloQueue<\/code> into <code>labqueue<\/code>.<\/p>\n<p class=\"li\">• <strong>Command 4:<\/strong> Peeks at the message at the front of <code>labqueue<\/code> <em>without<\/em> deleting it from the queue. Notice that the message content is returned encoded (for example, Base64 <code>SGVsbG9RdWV1ZQ==<\/code> or the encoded message payload depending on your CLI configuration). <strong>Take Screenshot #4 of<\/strong> <strong>this Cloud Shell output!<\/strong><\/p>\n<hr class=\"pg\">\n<h2>Step 2: Upload a File to labshare &amp; Inspect Table Storage (Portal)<\/h2>\n<p>1. In the Azure Portal, open your storage account ( <code>stlab4...<\/code>).<\/p>\n<p>2. In the left vertical menu under <strong>Data storage<\/strong>, click <strong>File shares<\/strong>.<\/p>\n<p>3. Click on <strong>labshare<\/strong> (showing Quota: 5 GiB).<\/p>\n<p>4. Near the top-left of the <code>labshare<\/code> page, click <strong>+ Upload<\/strong>. In the slide-out panel on the right, click the folder icon, select any small file from your computer (or create a small text file), and click <strong>Upload<\/strong>. Confirm the file appears inside <code>labshare<\/code>.<\/p>\n<p>5. <em>(Optional — Mount on Linux VM):<\/em> Look at the <strong>Connect<\/strong> button on the top toolbar of <code>labshare<\/code>. Clicking <strong>Connect → Linux<\/strong> shows the exact ready-made shell script Azure generates to mount this SMB cloud drive onto a Linux VM (like <code>vm-linux<\/code> from Lab 2) over TCP port 445.<\/p>\n<p>6. Finally, in the left vertical menu under <strong>Data storage<\/strong>, click <strong>Tables<\/strong> to observe Azure Table storage (where NoSQL tables can be created with <code>+<\/code> <code>Table<\/code> to store structured entities).<\/p>\n<h2>5. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Storage Account Name (<\/strong> <code>$ST<\/code><strong> )<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Direct Private Blob URL Error<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Archive Tier Rehydration Note<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Queue <\/strong><code>peek<\/code><strong> Output<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>6. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Private URL fails<\/td><td>Browser tab showing the direct Blob URL failing with the XML <code>ResourceNotFound<\/code> error because container <code>labdata<\/code> is Private.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>SAS URL works<\/td><td>Browser tab showing the generated <strong>Blob SAS URL<\/strong> successfully displaying/downloading <code>Hello<\/code> <code>Azure<\/code>.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>Same SAS URL fails after expiry time<\/td><td>Refreshed browser tab after the SAS expiry timestamp showing the XML <code>AuthenticationFailed<\/code> (expired signature) error.<\/td><\/tr>\n<tr><td><strong>4<\/strong><\/td><td><code>peek<\/code> returns <code>HelloQueue<\/code> (encoded)<\/td><td>Cloud Shell terminal showing <code>az<\/code> <code>storage<\/code> <code>message<\/code> <code>put<\/code> and <code>az<\/code> <code>storage<\/code> <code>message<\/code> <code>peek<\/code> output (plus optional screenshot of uploaded file in <code>labshare<\/code>).<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>7. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these detailed, exam-ready answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: Compare Blob, File, Queue and Table storage with one use case each.<\/h2>\n<table>\n<thead>\n<tr><th>Storage Type<\/th><th>Data Format &amp; Access<\/th><th>Real-World Use Case<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Blob Storage<\/strong><\/td><td>Unstructured binary/text objects stored in flat containers; accessed via HTTP/HTTPS REST URLs.<\/td><td>Storing website images, video streaming files, log archives, or automated VM/database backups.<\/td><\/tr>\n<tr><td><strong>File Storage<\/strong> <strong>(Azure Files)<\/strong><\/td><td>Hierarchical folders and files accessed via standard network file protocols (<strong>SMB<\/strong> and <strong>NFS<\/strong>).<\/td><td>Lift-and-shift enterprise applications or multiple VMs needing a shared network drive for configuration files and documents.<\/td><\/tr>\n<tr><td><strong>Queue Storage<\/strong><\/td><td>Asynchronous FIFO message queue storing small messages (up to 64 KB each, millions of messages).<\/td><td>Decoupling a web frontend from backend workers— for example, queuing user photo-resize or order-processing jobs during traffic spikes.<\/td><\/tr>\n<tr><td><strong>Table Storage<\/strong><\/td><td>Schema-less NoSQL key-attribute store (PartitionKey + RowKey) for structured non-relational entities.<\/td><td>Storing IoT sensor telemetry logs, user session profiles, or application metadata catalogs at low cost.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 2: When would you choose Cool or Archive over Hot?<\/h2>\n<div class=\"callout tip\"><p>Azure access tiers balance <strong>storage cost per GB<\/strong> against <strong>data access (read/write) cost and<\/strong> <strong>retrieval speed<\/strong>:<\/p><p class=\"li\">• <strong>Choose Cool over Hot:<\/strong> When data is accessed infrequently (e.g., once every 30+ days) but still needs <strong>immediate (millisecond) online retrieval<\/strong> when requested—such as short-term backups, older customer invoices, or completed project datasets kept for at least 30 days. Cool has lower storage cost than Hot, though slightly higher per-operation access charges.<\/p><p class=\"li\">• <strong>Choose Archive over Hot:<\/strong> When data is rarely or almost never accessed, must be retained long-term (at least <strong>180 days<\/strong>), and can tolerate <strong>hours of retrieval delay (rehydration)<\/strong>—such as multi-year regulatory compliance logs, medical/legal records, or raw forensic evidence archives. Archive offers the lowest storage cost of all tiers.<\/p><\/div>\n<h2>Question 3: Compare LRS, ZRS, GRS and GZRS in terms of copies and protection against failures.<\/h2>\n<table>\n<thead>\n<tr><th>Option<\/th><th>Copies &amp; Placement<\/th><th>Durability (Annual)<\/th><th>What Failures It Protects Against<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>LRS<\/strong><\/td><td><strong>3 synchronous copies<\/strong> inside a <em>single<\/em> <em>datacenter<\/em> in the primary region.<\/td><td>99.999999999% (11 nines)<\/td><td>Protects against local hard-drive, server node, or rack failures inside one datacenter.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Option<\/th><th>Copies &amp; Placement<\/th><th>Durability (Annual)<\/th><th>What Failures It Protects Against<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>ZRS<\/strong><\/td><td><strong>3 synchronous copies<\/strong> spread across <em>3<\/em> <em>separate Availability<\/em> <em>Zones<\/em> in the primary region.<\/td><td>99.9999999999% (12 nines)<\/td><td>Protects against an <strong>entire<\/strong> <strong>datacenter outage<\/strong> (power, cooling, or networking failure) within a region.<\/td><\/tr>\n<tr><td><strong>GRS<\/strong><\/td><td><strong>6 copies total:<\/strong> 3 LRS copies in primary region + 3 asynchronous copies in a <em>paired<\/em> <em>secondary region<\/em>.<\/td><td>99.99999999999999% (16 nines)<\/td><td>Protects against a <strong>complete<\/strong> <strong>regional disaster<\/strong> (e.g., natural disaster taking down the entire primary region).<\/td><\/tr>\n<tr><td><strong>GZRS<\/strong><\/td><td><strong>6 copies total:<\/strong> 3 ZRS copies across 3 zones in primary region + 3 LRS copies in a <em>paired<\/em> <em>secondary region<\/em>.<\/td><td>99.99999999999999% (16 nines)<\/td><td>Combines ZRS high availability with GRS regional disaster recovery—protects against both zone outages and regional disasters.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 4: Why is a SAS token safer than sharing the storage account key?<\/h2>\n<div class=\"callout tip\"><p>Sharing a <strong>Storage Account Key<\/strong> grants full, unrestricted administrative control over <em>every<\/em> container, blob, file share, queue, and table in the entire storage account—including the ability to read, overwrite, or permanently delete all data—and it never expires unless you manually rotate the keys (which can break other apps). By contrast, a <strong>Shared Access Signature (SAS) token<\/strong> enforces the cybersecurity principle of <strong>Least Privilege<\/strong> by restricting access in four ways:<\/p><p>1. <strong>Granular Scope:<\/strong> Grants access only to a single specific blob or container rather than the whole account.<\/p><p>2. <strong>Limited Permissions:<\/strong> Allows only the exact actions needed (e.g., <em>Read-only<\/em>, preventing modification or deletion).<\/p><p>3. <strong>Time-Bound Validity:<\/strong> Automatically expires after a defined start and expiry timestamp (such as 1 hour).<\/p><p>4. <strong>Network &amp; Protocol Restrictions:<\/strong> Can enforce <em>HTTPS-only<\/em> and restrict access to specific allowed client IP addresses.<\/p><\/div>\n<h2>8. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Once all four screenshots are saved in your lab journal, run this command in <strong>Cloud Shell (Bash)<\/strong> (replace <code>ROLLNO<\/code> with your lowercase roll number):<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab4-ROLLNO --yes --no-wait<\/code><\/pre>\n<p>This deletes <code>rg-lab4-ROLLNO<\/code> along with the entire storage account, container, blobs, file share, and queue so no ongoing storage charges accrue. Run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> after 1–2 minutes to verify deletion.<\/p>\n<hr class=\"pg\">\n<h2>9. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Part C commands fail with <code>argument<\/code> <code>--account-name:<\/code> <code>expected<\/code> <code>one<\/code> <code>argument<\/code><\/td><td>Your Cloud Shell session timed out between Part A and Part C, clearing <code>$ST<\/code>. Re-set it with <code>ST=stlab4xxxxx<\/code> (using your exact storage account name from the Portal) and re-run the command.<\/td><\/tr>\n<tr><td>SAS URL still works after you thought it expired<\/td><td>Check the <strong>Expiry<\/strong> timezone in the Generate SAS blade (it uses your local browser timezone or UTC depending on selection). Ensure your computer clock has passed the exact expiry minute shown in the <code>se=<\/code> parameter of the SAS URL.<\/td><\/tr>\n<tr><td>Cannot download <code>hello.txt<\/code> after changing tier to Archive<\/td><td>Expected behavior! Archive blobs are offline until rehydrated back to Hot or Cool—which is why you test the SAS download <em>before<\/em> switching to Archive.<\/td><\/tr>\n<tr><td><code>az<\/code> <code>storage<\/code> <code>account<\/code> <code>create<\/code> fails with name error<\/td><td>Run <code>ST=stlab4$RANDOM<\/code> again to get a fresh random number and re-run <code>az<\/code> <code>storage<\/code> <code>account<\/code> <code>create<\/code>.<\/td><\/tr>\n<\/tbody><\/table>", "5": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 5: Azure App Service and Azure Functions<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO3  |  <strong>Theory Alignment:<\/strong> Unit 1 &amp; Unit 2  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Deploy a web app to Azure App Service and create a serverless HTTP-triggered Azure Function.<\/p>\n<p><strong>Prerequisites:<\/strong> Labs 1 and 4 completed; access to the Azure Portal and Cloud Shell (Bash).<\/p>\n<pre class=\"code\"><code>Before You Start: 4 Crucial Beginner Tips for Lab 5\nApp names must be globally unique: Your App Service gets a live URL ( https://app-\nlab5-ROLLNO.azurewebsites.net ) and your Function App gets one too. If Azure says a\nname is already taken, simply add 2–4 extra digits to the end (e.g., app-lab5-cfis0429 ).\nWatch the URL parameter symbol in Part C ( &amp; vs ? ): Because your Azure Function\nuses Function authorization, the copied Function URL already contains ?code=... . To\npass your name, append &amp;name=YourName (with an ampersand &amp; ), not a second question\nmark!\nPut your Function App inside rg-lab5-ROLLNO : Reusing the same resource group makes\nClean-up one single command at the end.\nChoose the classic Consumption plan + Node.js in Part C: This combination lets you\ncreate and edit your function code directly inside the Azure Portal browser editor without\nneeding Visual Studio Code on your PC.<\/code><\/pre>\n<h2>1. Plain-English Overview: Moving Beyond Virtual Machines<\/h2>\n<p>In Lab 2, hosting a simple web page required launching an entire VM, logging in via RDP/SSH, and installing IIS or Apache yourself. In Lab 5, you experience two modern cloud models where Microsoft handles the servers for you:<\/p>\n<table>\n<thead>\n<tr><th>Azure Service<\/th><th>Cloud Model<\/th><th>What It Does &amp; What You Build in Lab 5<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Azure App Service<\/strong><\/td><td><strong>PaaS<\/strong> (Platform as a Service)<\/td><td>Managed web hosting platform—you just upload your HTML/code and Azure handles the OS, web server, and HTTPS. You deploy an <code>index.html<\/code> site on the Free <code>F1<\/code> tier and explore scaling, deployment slots, and live logs.<\/td><\/tr>\n<tr><td><strong>Azure Functions<\/strong><\/td><td><strong>Serverless<\/strong> (FaaS)<\/td><td>Event-driven micro-code that sleeps at $0 until an event (like an HTTP web request) triggers it. You build an HTTP-triggered function <code>HelloHttp<\/code> that greets any name passed in the URL and check its Monitor invocation log.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>2. Part A: Deploy an App Service Web App (Cloud Shell CLI)<\/h2>\n<p>Sign in at <code>portal.azure.com<\/code>, click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right of the blue header bar, and confirm you are in <strong>Bash<\/strong> mode.<\/p>\n<h2>Step 1: Create a Local Folder and HTML Page<\/h2>\n<p>Run these two commands one by one (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<pre class=\"code\"><code>mkdir lab5 &amp;&amp; cd lab5\necho &#x27;&lt;h1&gt;Hello from Azure App Service - ROLLNO&lt;/h1&gt;&#x27; &gt; index.html<\/code><\/pre>\n<p class=\"li\">• <code>mkdir<\/code> <code>lab5<\/code> <code>&amp;&amp;<\/code> <code>cd<\/code> <code>lab5<\/code> creates a clean folder named <code>lab5<\/code> in Cloud Shell and enters it.<\/p>\n<p class=\"li\">• <code>echo<\/code> <code>...<\/code> <code>&gt;<\/code> <code>index.html<\/code> creates a single web page file containing your heading. Run <code>cat<\/code> <code>index.html<\/code> if you want to verify its text.<\/p>\n<h2>Step 2: Deploy Directly to Azure App Service with One Command<\/h2>\n<pre class=\"code\"><code>az webapp up --name app-lab5-ROLLNO --resource-group rg-lab5-ROLLNO --location\ncentralindia --sku F1 --html<\/code><\/pre>\n<p class=\"li\">• <strong>What this single magic command does:<\/strong> It automatically creates the resource group <code>rg-lab5-ROLLNO<\/code> in Central India, creates a Free ( <code>F1<\/code>) App Service Plan, creates the Web App <code>app-lab5-ROLLNO<\/code>, zips your <code>index.html<\/code>, and publishes it live to the internet!<\/p>\n<p class=\"li\">• <strong>Wait 1 to 2 minutes<\/strong> while deployment completes. If Azure shows an error that the name is already taken, change <code>app-lab5-ROLLNO<\/code> to a slightly different name (e.g., <code>app-lab5-ROLLNO99<\/code>) and run the command again.<\/p>\n<p class=\"li\">• When finished, Cloud Shell prints a JSON block showing <code>&quot;URL&quot;:<\/code> <code>&quot;http://app-lab5-ROLLNO.azurewebsites.net&quot;<\/code>.<\/p>\n<h2>Step 3: Open Your Live Website<\/h2>\n<p>1. Copy the URL printed by Cloud Shell (for example, <code>https://app-lab5-cfis042.azurewebsites.net<\/code>) and open it in a new browser tab.<\/p>\n<p>2. <strong>Success check:<\/strong> Your browser displays the large bold heading <strong>Hello from Azure App Service -<\/strong> <strong>ROLLNO<\/strong>! <strong>Take Screenshot #1 (showing both the URL bar and heading) for Verification.<\/strong><\/p>\n<h2>3. Part B: Explore the App Service in the Azure Portal<\/h2>\n<p>Minimize Cloud Shell (click <code>_<\/code> on the terminal bar) so you can clearly view the Azure Portal screens.<\/p>\n<hr class=\"pg\">\n<h2>Step 1: Inspect Overview (URL, App Service Plan &amp; Pricing Tier)<\/h2>\n<p>1. In the top-center Global Search Bar of the Azure Portal, type <code>App<\/code> <code>Services<\/code> and click <strong>App<\/strong> <strong>Services<\/strong> under Services.<\/p>\n<p>2. Click on your newly created web app (<strong>app-lab5-ROLLNO<\/strong>).<\/p>\n<p>3. On the <strong>Overview<\/strong> blade, look at the Essentials section at the top and record these three values in Section 5 below: <strong>Default domain (URL):<\/strong> <code>app-lab5-ROLLNO.azurewebsites.net<\/code><\/p>\n<p class=\"li sub\">• <strong>App Service plan:<\/strong> Auto-created plan name (e.g., <code>appsp_...<\/code>). <em>Click this blue link briefly or<\/em> <em>check the App Service plan blade to capture Screenshot #2 for Verification!<\/em><\/p>\n<p class=\"li sub\">• <strong>Pricing plan:<\/strong> <code>F1:<\/code> <code>1<\/code> (Free tier — 1 shared instance).<\/p>\n<h2>Step 2: Explore Scale Up and Scale Out (Record Disabled Options on Free F1)<\/h2>\n<p>1. In the left vertical menu of your App Service, scroll down to the <strong>Settings<\/strong> section and click <strong>Scale<\/strong> <strong>up (App Service plan)<\/strong>.<\/p>\n<p>2. Observe the current tier (<strong>Free F1<\/strong>) and compare the feature table against paid tiers ( <code>Basic<\/code> <code>B1<\/code>, <code>Standard<\/code> <code>S1<\/code>, <code>Premium<\/code> <code>v3<\/code>): <strong>Disabled / missing features on Free F1:<\/strong> Custom domains, SSL certificates, Auto-scale, Staging/Deployment slots, Daily backups, and Traffic Manager.<\/p>\n<p class=\"li sub\">• <strong>Compute limits on Free F1:<\/strong> Runs on <strong>shared infrastructure<\/strong> with a strict cap of 60 CPU minutes/day, 1 GB memory, and 1 GB disk space.<\/p>\n<p>3. Now click <strong>Scale out (App Service plan)<\/strong> directly beneath Scale up in the left menu.<\/p>\n<p>4. <strong>Observe what is disabled and why:<\/strong> Both <strong>Manual scale<\/strong> (increasing the number of instances beyond 1) and <strong>Automatic / Custom autoscale<\/strong> are disabled/grayed out on the Free <code>F1<\/code> tier. <em>Why?<\/em> Because <code>F1<\/code> is a zero-cost learning/testing tier hosted on shared servers and does not provide dedicated compute instances or load-balanced horizontal scaling.<\/p>\n<div class=\"callout tip\"><p><strong>Verification Tip:<\/strong> Take a clean screenshot of the <strong>App Service plan<\/strong> blade (either Overview or Scale up/Scale out showing tier <code>F1<\/code>) for your journal.<\/p><\/div>\n<h2>Step 3: Inspect Deployment Slots (Optional S1 Swap Only If Permitted)<\/h2>\n<p>1. In the left vertical menu of your App Service, look under the <strong>Deployment<\/strong> section and click <strong>Deployment slots<\/strong>.<\/p>\n<p>2. Notice the message explaining that your current <code>F1<\/code> pricing tier does not support Deployment Slots—you must be on <strong>Standard (<\/strong> <code>S1<\/code><strong> )<\/strong> or higher.<\/p>\n<p>3. <strong>If your instructor asks you to test a live Slot Swap (otherwise skip to Step 4):<\/strong><\/p>\n<hr class=\"pg\">\n<p>4. 1. Go to <strong>Settings<\/strong> → <strong>Scale up (App Service plan)<\/strong> → select <strong>Standard S1<\/strong> → click <strong>Select /<\/strong> <strong>Apply<\/strong>.<\/p>\n<p>2. Return to <strong>Deployment<\/strong> → <strong>Deployment slots<\/strong> → click <strong>+ Add Slot<\/strong> → Name: <code>staging<\/code> → click <strong>Add<\/strong>.<\/p>\n<p>3. Deploy a modified page to the staging slot (for example, edit <code>index.html<\/code> to say <em>Staging<\/em> <em>Version<\/em> and deploy to the slot via Deployment Center or CLI), then click <strong>Swap<\/strong> on the Deployment slots toolbar to swap <code>staging<\/code> into <code>production<\/code> with zero downtime.<\/p>\n<p>4. <strong>CRITICAL:<\/strong> Immediately return to <strong>Scale up (App Service plan)<\/strong>, delete the staging slot if prompted, and switch back to <strong>Free F1<\/strong> so your credits are not charged for <code>S1<\/code> !<\/p>\n<h2>Step 4: Watch Live Requests in Log Stream<\/h2>\n<p>1. First enable logging so Log Stream has output to show: in the left vertical menu of your App Service, scroll down to <strong>Monitoring<\/strong> and click <strong>App Service logs<\/strong>. Turn <strong>Application logging (Filesystem)<\/strong> to <strong>On<\/strong> (Level: <em>Information<\/em>).<\/p>\n<p class=\"li sub\">• Turn <strong>Web server logging<\/strong> to <strong>File System<\/strong>.<\/p>\n<p class=\"li sub\">• Click <strong>Save<\/strong> at the top-left.<\/p>\n<p>2. In the left vertical menu under <strong>Monitoring<\/strong>, click <strong>Log stream<\/strong>. Wait ~10 seconds until the black console window prints <code>Connected!<\/code>.<\/p>\n<p>3. Switch to the browser tab with your live website ( <code>https://app-lab5-ROLLNO.azurewebsites.net<\/code>) and press <strong>F5 (Refresh)<\/strong> 2 or 3 times.<\/p>\n<p>4. Switch back to the Azure Portal <strong>Log stream<\/strong> tab and observe the incoming HTTP <code>GET<\/code> <code>/<\/code> request entries streaming in real time.<\/p>\n<h2>4. Part C: Create &amp; Test a Serverless Azure Function (Azure Portal)<\/h2>\n<h2>Step 1: Create a Function App (Consumption Plan)<\/h2>\n<p>1. In the top-center Global Search Bar, type <code>Function<\/code> <code>App<\/code> and click <strong>Function App<\/strong> under Services.<\/p>\n<p>2. Click <strong>+ Create<\/strong> near the top-left.<\/p>\n<p>3. On the <strong>Select a hosting option<\/strong> screen, choose <strong>Consumption<\/strong> (serverless pay-per-execution plan — best for creating and editing functions directly in the Portal; if your screen highlights <em>Flex<\/em> <em>Consumption<\/em>, scroll down or click the <strong>Consumption<\/strong> card), then click <strong>Select<\/strong>.<\/p>\n<p>4. Fill in the <strong>Basics<\/strong> tab carefully: <strong>Subscription:<\/strong> Your active subscription.<\/p>\n<p class=\"li sub\">• <strong>Resource Group:<\/strong> Select your existing <code>rg-lab5-ROLLNO<\/code> from the dropdown (keeps Clean-up simple!).<\/p>\n<p class=\"li sub\">• <strong>Function App name:<\/strong> Type a globally unique name like <code>func-lab5-ROLLNO<\/code> (add digits if taken).<\/p>\n<p class=\"li sub\">• <strong>Runtime stack:<\/strong> Select <strong>Node.js<\/strong> (recommended for smooth in-portal editing; Python is also valid per manual).<\/p>\n<hr class=\"pg\">\n<p>5. <strong>Version:<\/strong> Keep the default LTS version (e.g., <code>20<\/code> <code>LTS<\/code> or <code>22<\/code> <code>LTS<\/code>).<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Operating System:<\/strong> Keep <strong>Windows<\/strong> (or Linux if required by your chosen stack; Windows + Node.js guarantees the Portal code editor is unlocked).<\/p>\n<p>6. Click <strong>Next : Storage &gt;<\/strong> and confirm Azure is creating a <strong>new Storage account<\/strong> (leave the auto-generated lowercase name as is).<\/p>\n<p>7. Click <strong>Next : Monitoring &gt;<\/strong> and confirm <strong>Enable Application Insights<\/strong> is set to <strong>Yes<\/strong> (this powers the Monitor invocation count in Step 5!).<\/p>\n<p>8. Click <strong>Review + create<\/strong> → wait for validation → click <strong>Create<\/strong>. Wait <strong>1 to 2 minutes<\/strong>, then click <strong>Go to<\/strong> <strong>resource<\/strong>.<\/p>\n<h2>Step 2: Create the HTTP-Triggered Function HelloHttp<\/h2>\n<p>1. Inside your new Function App’s <strong>Overview<\/strong> blade, scroll down to the <strong>Functions<\/strong> tab in the lower half of the page and click <strong>Create function<\/strong> (or <strong>Create in Azure portal<\/strong>).<\/p>\n<p>2. If asked for a Development environment, ensure <strong>Develop in portal<\/strong> is selected.<\/p>\n<p>3. In the template list, click <strong>HTTP trigger<\/strong>.<\/p>\n<p>4. Scroll down to <strong>Template details<\/strong> and enter: <strong>New Function:<\/strong> Delete <code>HttpTrigger1<\/code> and type <code>HelloHttp<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Authorization level:<\/strong> Confirm <strong>Function<\/strong> is selected.<\/p>\n<p>5. Click <strong>Create<\/strong> and wait ~15 seconds. Azure opens your new <code>HelloHttp<\/code> function automatically.<\/p>\n<h2>Step 3: Review/Edit the Code &amp; Get the Function URL<\/h2>\n<p>1. In the left vertical menu of <code>HelloHttp<\/code> (under <strong>Developer<\/strong>), click <strong>Code + Test<\/strong>.<\/p>\n<p>2. Look at the JavaScript code in the editor (typically <code>index.js<\/code>). Azure’s built-in template already reads the <code>name<\/code> query parameter and builds a greeting. Verify or update the response line so it clearly greets the user using <code>name<\/code>:<\/p>\n<pre class=\"code\"><code>const name = (req.query.name || (req.body &amp;&amp; req.body.name));\nconst responseMessage = name\n? &quot;Hello, &quot; + name + &quot;! Welcome to Azure Functions.&quot;\n: &quot;Pass a name in the query string (e.g., &amp;name=YourName) for a greeting.&quot;;<\/code><\/pre>\n<p>3. If you modified any text in the editor, click the <strong>Save<\/strong> icon at the top of the editor window.<\/p>\n<p>4. <strong>Quick in-portal check (Test/Run):<\/strong> Click <strong>Test/Run<\/strong> in the top toolbar → select the <strong>Input<\/strong> tab → under <strong>Query<\/strong> click <strong>+ Add parameter<\/strong> → Name: <code>name<\/code>, Value: your first name → click <strong>Run<\/strong>. Confirm <strong>HTTP response code: 200 OK<\/strong> and your greeting in the Output box!<\/p>\n<p>5. <strong>Copy the live Function URL:<\/strong> Close the Test/Run drawer, click <strong>Get function URL<\/strong> in the top toolbar of <em>Code + Test<\/em>, confirm Key is <code>default<\/code> <code>(Function<\/code> <code>key)<\/code>, and click the <strong>Copy<\/strong> icon.<\/p>\n<hr class=\"pg\">\n<h2>Step 4: Browse the Function URL with Your Name<\/h2>\n<p>1. Open a new browser tab and paste the copied Function URL into the address bar. It will look like this:<\/p>\n<pre class=\"code\"><code>https://func-lab5-rollno.azurewebsites.net/api/HelloHttp?code=YOUR_FUNCTION_KEY<\/code><\/pre>\n<p>2. At the very end of that URL, type <code>&amp;name=YourName<\/code> (replacing <code>YourName<\/code> with your actual first name) and press <strong>Enter<\/strong>:<\/p>\n<pre class=\"code\"><code>https://func-lab5-rollno.azurewebsites.net/api/HelloHttp?\ncode=YOUR_FUNCTION_KEY&amp;name=YourName<\/code><\/pre>\n<div class=\"callout tip\"><p><strong>Why <\/strong><code>&amp;name=<\/code><strong> instead of <\/strong><code>?name=<\/code><strong> ?<\/strong> In web URLs, the first query parameter starts with <code>?<\/code> (here <code>?<\/code> <code>code=...<\/code>), and every additional parameter after it must start with <code>&amp;<\/code>. (If your URL had no <code>?code=<\/code> part, then you would use <code>?name=YourName<\/code>.)<\/p><\/div>\n<p>3. <strong>Success check:<\/strong> The browser immediately prints <code>Hello,<\/code> <code>YourName...<\/code> ! Refresh the page 2–3 times so multiple invocations get logged. <strong>Take Screenshot #3 of this browser response!<\/strong><\/p>\n<h2>Step 5: View Invocation Count &amp; Logs in Monitor<\/h2>\n<p>1. Return to the Azure Portal inside your <code>HelloHttp<\/code> function.<\/p>\n<p>2. In the left vertical menu of <code>HelloHttp<\/code> (under <strong>Developer<\/strong>), click <strong>Monitor<\/strong>.<\/p>\n<p>3. Click the <strong>Invocations<\/strong> tab at the top. You will see a table listing your recent runs with Timestamp, Result Code ( <code>200<\/code> / green checkmark), and Duration, plus total <strong>Success count<\/strong> at the top.<\/p>\n<p>4. <em>Beginner Patience Note:<\/em> Application Insights telemetry takes <strong>2 to 5 minutes<\/strong> to appear in the <em>Invocations<\/em> table. Click the <strong>Refresh<\/strong> button every minute until your runs appear (you can also click the <strong>Logs<\/strong> tab next to Invocations to see instant real-time logs while triggering the URL!).<\/p>\n<p>5. <strong>Take Screenshot #4 of the Monitor Invocations screen showing your invocation count and<\/strong> <strong>successful runs!<\/strong><\/p>\n<h2>5. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>App Service URL<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>App Service Plan &amp; Pricing Tier<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Function App Name &amp; Runtime<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Function Invocation Count Seen<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>6. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these four screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Web app URL shows your HTML page<\/td><td>Browser window showing <code>https://app-lab5-ROLLNO.azurewebsites.net<\/code> displaying <em>Hello from Azure<\/em> <em>App Service - ROLLNO<\/em>.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>App Service plan blade<\/td><td>Portal → App Service → <strong>Overview / Scale up (or Scale out)<\/strong> clearly showing your App Service plan and Free <code>F1<\/code> pricing tier.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>Function URL returns <code>Hello,<\/code> <code>YourName<\/code><\/td><td>Browser window showing the <code>HelloHttp<\/code> URL with your name parameter returning the <code>Hello,<\/code> <code>YourName<\/code> greeting.<\/td><\/tr>\n<tr><td><strong>4<\/strong><\/td><td>Function invocation log<\/td><td>Portal → Function App → <code>HelloHttp<\/code> → <strong>Monitor →<\/strong> <strong>Invocations<\/strong> showing the Success count and logged HTTP trigger executions.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>7. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these structured, exam-ready answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: Compare IaaS (VM), PaaS (App Service) and serverless (Functions) for management effort and billing.<\/h2>\n<table>\n<thead>\n<tr><th>Aspect<\/th><th>IaaS (Azure VM)<\/th><th>PaaS (App Service)<\/th><th>Serverless (Functions)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Management Effort<\/strong><\/td><td><strong>Highest:<\/strong> Customer manages OS patching, runtime, IIS/Apache setup, security updates, scaling, and application code.<\/td><td><strong>Low:<\/strong> Microsoft manages OS, runtime, web server, and patching; customer manages only application code and scaling rules.<\/td><td><strong>Lowest:<\/strong> Microsoft manages all servers, OS, and automatic scaling; customer writes only small event-driven functions.<\/td><\/tr>\n<tr><td><strong>Scaling Behavior<\/strong><\/td><td>Manual or configured via VM Scale Sets (minutes to boot new VMs).<\/td><td>Scale up (larger plan) or scale out (more instances) on demand or by schedule/metrics.<\/td><td><strong>Automatic &amp;<\/strong> <strong>instantaneous<\/strong> per incoming event; automatically scales down to <strong>zero<\/strong> when idle.<\/td><\/tr>\n<tr><td><strong>Billing Model<\/strong><\/td><td>Billed per second/hour for reserved vCPU, RAM, and disks while running (even when traffic is zero).<\/td><td>Billed per hour for the underlying App Service Plan tier/instances running (fixed tiers like <code>B1<\/code>, <code>S1<\/code>; <code>F1<\/code> is free).<\/td><td><strong>Consumption-based:<\/strong> Pay strictly for actual executions and execution duration/memory; <strong>$0<\/strong> <strong>when idle<\/strong>.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>Question 2: Explain the consumption-based billing model of Azure Functions.<\/h2>\n<div class=\"callout tip\"><p>Under the <strong>Consumption hosting plan<\/strong>, Azure Functions uses a true pay-per-use serverless billing model measured by two metrics:<\/p><p>1. <strong>Total Number of Executions:<\/strong> Counted each time a function is triggered and runs.<\/p><p>2. <strong>Resource Consumption (GB-seconds):<\/strong> Calculated by multiplying the <strong>average memory size<\/strong> <strong>used (in gigabytes)<\/strong> by the <strong>execution duration (in seconds)<\/strong> for each run. When no events or requests arrive, Azure scales the function down to <strong>zero active instances<\/strong>, meaning you pay <strong>$0 while idle<\/strong>. Furthermore, every Azure subscription includes a generous <strong>monthly free grant<\/strong> (1,000,000 executions and 400,000 GB-seconds per month), making lightweight serverless APIs and automation tasks virtually free.<\/p><\/div>\n<h2>Question 3: When would you scale up and when scale out?<\/h2>\n<div class=\"callout tip\"><p class=\"li\">• <strong>Scale Up (Vertical Scaling — bigger machine):<\/strong> Choose scaling up (e.g., moving from <code>F1<\/code> to <code>B1<\/code> or <code>S1<\/code>) when your application needs <strong>more CPU power, more RAM per single instance<\/strong> (such as memory-heavy processing or single-threaded workloads), or when you need to unlock <strong>higher-tier platform features<\/strong> like Custom Domains, SSL certificates, Staging Deployment Slots, or Daily Backups.<\/p><p class=\"li\">• <strong>Scale Out (Horizontal Scaling — more machines):<\/strong> Choose scaling out (increasing instance count from 1 to 2, 5, or 10 copies behind a load balancer) when your application faces <strong>high<\/strong> <strong>concurrent user traffic spikes<\/strong> (such as college result day or e-commerce flash sales) or requires <strong>high availability / fault tolerance<\/strong> so traffic continues smoothly even if one instance fails.<\/p><\/div>\n<h2>Question 4: Name two triggers other than HTTP that can start an Azure Function.<\/h2>\n<div class=\"callout tip\"><p>1. <strong>Timer Trigger:<\/strong> Runs a function automatically on a fixed schedule using a CRON expression (for example, running a nightly database cleanup or daily report email at 2:00 AM).<\/p><p>2. <strong>Blob Storage Trigger:<\/strong> Starts a function automatically whenever a new file is uploaded or updated inside an Azure Blob container (for example, automatically generating a thumbnail whenever a user uploads an image). <em>Other valid triggers (useful for Viva):<\/em> <strong>Queue Storage Trigger<\/strong> (runs when a new message arrives in an Azure Queue), <strong>Azure Service Bus Trigger<\/strong>, <strong>Cosmos DB Trigger<\/strong>, and <strong>Event Grid Trigger<\/strong>.<\/p><\/div>\n<h2>8. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Once all four screenshots are saved in your lab journal, open <strong>Cloud Shell (Bash)<\/strong> and run:<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab5-ROLLNO --yes --no-wait<\/code><\/pre>\n<hr class=\"pg\">\n<p class=\"li\">• <strong>Important check:<\/strong> If you created your Function App inside a <em>different<\/em> resource group than <code>rg-lab5-ROLLNO<\/code>, delete that second resource group as well using <code>az<\/code> <code>group<\/code> <code>delete<\/code> <code>--name<\/code> <code>YOUR_FUNCTION_RG<\/code> <code>--yes<\/code> <code>--no-wait<\/code> (or delete it from <strong>Resource groups<\/strong> in the Portal).<\/p>\n<p class=\"li\">• Wait 2 minutes and run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> to confirm all Lab 5 resource groups are removed.<\/p>\n<h2>9. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>az<\/code> <code>webapp<\/code> <code>up<\/code> fails with name conflict<\/td><td>App Service names must be globally unique across Azure. Add extra digits (e.g., <code>app-lab5-cfis0429<\/code>) and re-run.<\/td><\/tr>\n<tr><td>Function URL ignores <code>?<\/code> <code>name=YourName<\/code> or returns <code>401<\/code> <code>Unauthorized<\/code><\/td><td>You appended <code>?name=<\/code> after <code>?code=...<\/code> (two question marks!). Change the second <code>?<\/code> to an ampersand: <code>...&amp;name=YourName<\/code>.<\/td><\/tr>\n<tr><td>Cannot click <em>Create in Azure portal<\/em> on Function App<\/td><td>Some plans (like <em>Flex Consumption<\/em> or Linux Python Consumption) disable in-portal editing. Create the Function App using the classic <strong>Consumption<\/strong> plan with <strong>Node.js on Windows<\/strong>.<\/td><\/tr>\n<tr><td>Monitor → Invocations table says <em>No results<\/em><\/td><td>Application Insights takes <strong>2–5 minutes<\/strong> to index new invocations. Refresh your Function URL a couple of times, wait 3 minutes, and click <strong>Refresh<\/strong> on the Invocations tab.<\/td><\/tr>\n<tr><td>Log stream stays blank on App Service<\/td><td>Open <strong>Monitoring → App Service logs<\/strong>, enable <strong>Application logging<\/strong> <strong>(Filesystem)<\/strong> and <strong>Web server logging<\/strong>, click <strong>Save<\/strong>, then reopen Log stream and refresh your web page.<\/td><\/tr>\n<\/tbody><\/table>", "6": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 6: Microsoft Entra ID, RBAC, MFA and Conditional Access<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO4  |  <strong>Theory Alignment:<\/strong> Unit 3  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Create users and groups in Microsoft Entra ID, assign Azure roles with RBAC, and explore MFA and Conditional Access.<\/p>\n<p><strong>Prerequisites:<\/strong> Lab 1 completed; a smartphone with the free <strong>Microsoft Authenticator<\/strong> app installed (for Part C MFA registration). <em>Important Note:<\/em> If your Azure account sits inside a university-managed tenant, the <em>New user<\/em> or <em>Conditional Access<\/em> buttons may be grayed out. In that case, either use a personal free Azure tenant or observe your instructor’s demonstration and record what you see.<\/p>\n<div class=\"callout info\"><strong class=\"callout-title\">Before You Start: 4 Essential Beginner Tips for Lab 6<\/strong><p class=\"li sub\">• <strong>Always use a Private / Incognito browser window for <\/strong><code>labuser1<\/code><strong> :<\/strong> Never sign out of your main admin window to test <code>labuser1<\/code>. Keeping your main browser as Admin and a separate Incognito window ( <code>Ctrl<\/code> <code>+<\/code> <code>Shift<\/code> <code>+<\/code> <code>N<\/code> in Chrome/Edge) as <code>labuser1<\/code> lets you switch roles and test instantaneously.<\/p><p class=\"li sub\">• <strong>Copy the full username and generated password in Part A:<\/strong> Your test user’s full login is <code>labuser1@YOURDOMAIN.onmicrosoft.com<\/code> (where <code>YOURDOMAIN<\/code> is your Primary Domain from Step 1). Paste it into your Lab Record Table immediately.<\/p><p class=\"li sub\">• <strong>Conditional Access requires a Microsoft Entra ID P1 (or P2) license:<\/strong> In a personal test tenant, you can activate a <strong>free 30-day trial<\/strong> directly inside Entra ID (exact click path included in Part C, Step 3 below)—no paid purchase is needed.<\/p><p class=\"li sub\">• <strong>Zero-cost warning on Clean-up:<\/strong> Users, groups, and policies cost $0, but the storage account in <code>rg-lab6-ROLLNO<\/code> should be deleted at the end—and always delete <code>labuser1<\/code>, <code>grp-lab-readers<\/code>, and <code>CA-Require-MFA-Lab<\/code> if you are working in a shared tenant.<\/p><\/div>\n<h2>1. Plain-English Overview: Identity &amp; Access Security in Azure<\/h2>\n<p>As a Cyber Forensics &amp; Information Security student, Lab 6 is one of the most important practicals in the syllabus. Here is how the four security pillars in this lab fit together:<\/p>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Security Feature<\/th><th>Plain-English Meaning<\/th><th>What You Build in Lab 6<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Microsoft Entra ID<\/strong> <em>(formerly Azure AD)<\/em><\/td><td>Cloud identity directory that stores user accounts, passwords, and groups— answers <em>“Who are you?”<\/em> (Authentication).<\/td><td>Inspect your Tenant, create user <code>labuser1<\/code>, and add them to security group <code>grp-lab-readers<\/code>.<\/td><\/tr>\n<tr><td><strong>Azure RBAC<\/strong> <em>(Role-Based Access<\/em> <em>Control)<\/em><\/td><td>Permission system that controls what a signed-in user can do to Azure resources —answers <em>“What are you allowed to<\/em> <em>do?”<\/em> (Authorization).<\/td><td>Assign <code>Reader<\/code> (view-only) and then <code>Contributor<\/code> (create/edit) roles on <code>rg-lab6-ROLLNO<\/code> and test live.<\/td><\/tr>\n<tr><td><strong>MFA<\/strong> <em>(Multifactor<\/em> <em>Authentication)<\/em><\/td><td>Requires a second proof of identity beyond a password (such as approving a number on your phone’s Authenticator app).<\/td><td>Review Security Defaults and register Microsoft Authenticator for <code>labuser1<\/code> at <em>My Security Info<\/em>.<\/td><\/tr>\n<tr><td><strong>Conditional Access<\/strong><\/td><td>Smart <em>“If–Then”<\/em> security rules (e.g., <em>IF a<\/em> <em>user in grp-lab-readers opens Azure<\/em> <em>Management, THEN require MFA<\/em>).<\/td><td>Create policy <code>CA-Require-MFA-Lab<\/code> in <code>Report-only<\/code> mode and inspect Sign-in logs.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Create Users and Groups in Microsoft Entra ID (Portal)<\/h2>\n<h2>Step 1: Open Microsoft Entra ID and Record Your Tenant Details<\/h2>\n<p>1. Sign in at <code>portal.azure.com<\/code> using your main admin/student account.<\/p>\n<p>2. Click the top-center Global Search Bar, type <code>Microsoft<\/code> <code>Entra<\/code> <code>ID<\/code>, and click <strong>Microsoft Entra ID<\/strong> under Services (blue diamond-pyramid icon).<\/p>\n<p>3. You land on the <strong>Overview<\/strong> blade. Under the <strong>Basic information<\/strong> section in the center of the page, find and copy these three exact values into your Lab Record Table (Section 5): <strong>Name (Tenant Name):<\/strong> e.g., <em>Default Directory<\/em> (or your university name).<\/p>\n<p class=\"li sub\">• <strong>Tenant ID:<\/strong> Long letters-and-numbers GUID (use the copy icon next to it).<\/p>\n<p class=\"li sub\">• <strong>Primary domain:<\/strong> Looks like <code>yournamegmail.onmicrosoft.com<\/code> — <strong>you will need this exact<\/strong> <strong>domain for Part B!<\/strong><\/p>\n<div class=\"callout tip\"><p><strong>Permission Check:<\/strong> Look at the left vertical menu under <em>Manage<\/em> → <em>Users<\/em>. If the <strong>+ New user<\/strong> button is clickable, proceed with Steps 2–3. If it is grayed out because your college IT manages the tenant, switch to a personal free tenant (or record your instructor’s demonstration).<\/p><\/div>\n<h2>Step 2: Create User labuser1 with a Generated Password<\/h2>\n<p>1. In the left vertical menu of Microsoft Entra ID, expand <strong>Manage<\/strong> and click <strong>Users<\/strong>.<\/p>\n<p>2. At the top toolbar of the Users page, click <strong>+ New user<\/strong>, then select <strong>Create new user<\/strong> from the dropdown.<\/p>\n<hr class=\"pg\">\n<p>3. On the <strong>Basics<\/strong> tab, fill in the required fields: <strong>User principal name:<\/strong> Type <code>labuser1<\/code> in the left box. Confirm the domain dropdown on the right shows your Primary Domain ( <code>@YOURDOMAIN.onmicrosoft.com<\/code>).<\/p>\n<p class=\"li sub\">• <strong>Display name:<\/strong> Type <code>labuser1<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Password:<\/strong> Leave <strong>Auto-generate password<\/strong> checked! Click the small <strong>copy icon<\/strong> (or eye icon) next to the generated password box and <strong>save this temporary password in your Lab Record<\/strong> <strong>Table immediately<\/strong>—you cannot view it again after clicking Create.<\/p>\n<p class=\"li sub\">• <strong>Account enabled:<\/strong> Leave checked (Yes).<\/p>\n<p>4. Click the blue <strong>Review + create<\/strong> button at the bottom-left, verify the summary, and click <strong>Create<\/strong>. Wait 10 seconds and click <strong>Refresh<\/strong> to see <code>labuser1<\/code> in your Users list.<\/p>\n<h2>Step 3: Create Security Group grp-lab-readers and Add labuser1<\/h2>\n<p>1. In the left vertical menu of Microsoft Entra ID (under <strong>Manage<\/strong>), click <strong>Groups<\/strong>.<\/p>\n<p>2. Click <strong>+ New group<\/strong> near the top-left toolbar.<\/p>\n<p>3. Fill in the New Group form carefully: <strong>Group type:<\/strong> Leave set to <strong>Security<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Group name:<\/strong> Type <code>grp-lab-readers<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Group description:<\/strong> Optional (e.g., <em>Lab 6 RBAC Reader test group<\/em>).<\/p>\n<p class=\"li sub\">• <strong>Membership type:<\/strong> Leave set to <strong>Assigned<\/strong>.<\/p>\n<p>4. Under the <strong>Members<\/strong> row, click the blue link <strong>No members selected<\/strong>.<\/p>\n<p>5. A side panel opens on the right. Type <code>labuser1<\/code> in the search box, click the checkbox next to <strong>labuser1<\/strong>, and click the blue <strong>Select<\/strong> button at the bottom of the panel.<\/p>\n<p>6. Verify it now says <em>1 member selected<\/em>, then click the blue <strong>Create<\/strong> button at the bottom-left. Wait 10 seconds and click <strong>Refresh<\/strong> to confirm <code>grp-lab-readers<\/code> appears.<\/p>\n<h2>3. Part B: Role-Based Access Control — RBAC (Portal and CLI)<\/h2>\n<h2>Step 1: Create Resource Group rg-lab6-ROLLNO with One Storage Account<\/h2>\n<p>1. In the top-center Global Search Bar, type <code>Resource<\/code> <code>groups<\/code> → click <strong>Resource groups<\/strong> → click <strong>+<\/strong> <strong>Create<\/strong>.<\/p>\n<p>2. Set <strong>Resource group<\/strong> to <code>rg-lab6-ROLLNO<\/code> (replace <code>ROLLNO<\/code> with your lowercase roll number) and <strong>Region<\/strong> to <strong>(Asia Pacific) Central India<\/strong>. Click <strong>Review + create<\/strong> → <strong>Create<\/strong>.<\/p>\n<p>3. Open <code>rg-lab6-ROLLNO<\/code> → click <strong>+ Create<\/strong> → search for <strong>Storage account<\/strong> → click <strong>Create<\/strong>.<\/p>\n<p>4. Create one Standard LRS storage account inside <code>rg-lab6-ROLLNO<\/code> (e.g., name <code>stlab6rollno<\/code>, all lowercase, Central India, Standard, LRS) → <strong>Review + create<\/strong> → <strong>Create<\/strong>. Wait ~30 seconds for deployment to finish.<\/p>\n<hr class=\"pg\">\n<h2>Step 2: Assign the Reader Role to grp-lab-readers (Portal)<\/h2>\n<p>1. Open your resource group <strong>rg-lab6-ROLLNO<\/strong>.<\/p>\n<p>2. In the left vertical menu of <code>rg-lab6-ROLLNO<\/code>, click <strong>Access control (IAM)<\/strong> (near the top, directly below Activity log).<\/p>\n<p>3. Click the <strong>+ Add<\/strong> button on the top toolbar, then click <strong>Add role assignment<\/strong>.<\/p>\n<p>4. On the <strong>Role<\/strong> tab (under <em>Job function roles<\/em>): Type <code>Reader<\/code> in the Search box.<\/p>\n<p class=\"li sub\">• Click the row named <strong>Reader<\/strong> (description: <em>View all resources, but does not allow you to make<\/em> <em>any changes<\/em>) so it highlights blue.<\/p>\n<p class=\"li sub\">• Click <strong>Next<\/strong> at the bottom-left.<\/p>\n<p>5. On the <strong>Members<\/strong> tab: Confirm <strong>Assign access to<\/strong> is set to <strong>User, group, or service principal<\/strong>.<\/p>\n<p class=\"li sub\">• Click <strong>+ Select members<\/strong>. In the right-hand search panel, type <code>grp-lab-readers<\/code>, click on <strong>grp-<\/strong><strong>lab-readers<\/strong>, and click <strong>Select<\/strong>.<\/p>\n<p>6. Click <strong>Review + assign<\/strong> twice (first to review, second to confirm). Note that the Scope is automatically set to <code>rg-lab6-ROLLNO<\/code> (<em>This resource<\/em>).<\/p>\n<p>7. Click the <strong>Role assignments<\/strong> tab inside <em>Access control (IAM)<\/em> to confirm <code>grp-lab-readers<\/code> appears under the <strong>Reader<\/strong> role. <strong>Take Screenshot #1 of this Role assignments list!<\/strong><\/p>\n<h2>Step 3: Sign In as labuser1 in a Private Window and Test Reader Restrictions<\/h2>\n<p>1. Open a brand-new <strong>Private / Incognito browser window<\/strong> (press <code>Ctrl<\/code> <code>+<\/code> <code>Shift<\/code> <code>+<\/code> <code>N<\/code> in Chrome or Edge) and go to <code>portal.azure.com<\/code>.<\/p>\n<p>2. Sign in with <code>labuser1@YOURDOMAIN.onmicrosoft.com<\/code> and the auto-generated password from Part A, Step 2.<\/p>\n<p>3. <strong>First-login prompts:<\/strong> Azure will immediately ask you to <strong>Update your password<\/strong>: paste the temporary password in <em>Current password<\/em>, enter a new strong password you will remember twice, and click <strong>Sign in<\/strong>.<\/p>\n<p class=\"li sub\">• If a screen says <em>“More information required”<\/em> (asking to set up Microsoft Authenticator because Security Defaults are enabled), click <strong>Ask later<\/strong> (if shown) for now—or complete the Authenticator setup right here (which also satisfies Part C, Step 2!).<\/p>\n<p>4. Once inside the Portal as <code>labuser1<\/code>, search for <strong>Resource groups<\/strong> and click <strong>rg-lab6-ROLLNO<\/strong>. <strong>Verify Read access:<\/strong> Confirm <code>labuser1<\/code> <em>can<\/em> open <code>rg-lab6-ROLLNO<\/code> and view your storage account inside it!<\/p>\n<p class=\"li sub\">• <strong>Verify Create/Delete is blocked:<\/strong> Inside <code>rg-lab6-ROLLNO<\/code>, click <strong>+ Create<\/strong> and try to create a tiny Storage Account (or try clicking the storage account → <strong>Delete<\/strong>). Azure will block you with a red error banner: <em>“You do not have permission to create/delete resources in this resource<\/em> <em>group”<\/em> (or <code>AuthorizationFailed<\/code>). <strong>Take Screenshot #2 of this failed create/delete attempt<\/strong> <strong>by Reader!<\/strong><\/p>\n<p>5. <strong>Keep this Incognito window open<\/strong> for Step 4.<\/p>\n<hr class=\"pg\">\n<h2>Step 4: Change Role to Contributor , Retest &amp; Use Check Access<\/h2>\n<p>1. Switch back to your <strong>main Admin browser window<\/strong> on <code>rg-lab6-ROLLNO<\/code> → <strong>Access control<\/strong> <strong>(IAM)<\/strong> → <strong>Role assignments<\/strong> tab.<\/p>\n<p>2. First add the <strong>Contributor<\/strong> role: click <strong>+ Add<\/strong> → <strong>Add role assignment<\/strong> → click the <strong>Privileged<\/strong> <strong>administrator roles<\/strong> tab (important! <em>Contributor<\/em> lives under <strong>Privileged administrator roles<\/strong>, not Job function roles!) → select <strong>Contributor<\/strong> → Next → select member <strong>grp-lab-readers<\/strong> → <strong>Review<\/strong> <strong>+ assign<\/strong>.<\/p>\n<p>3. Optional clean swap: check the box beside the old <code>Reader<\/code> assignment for <code>grp-lab-readers<\/code> and click <strong>Remove<\/strong> on the toolbar so only <code>Contributor<\/code> remains.<\/p>\n<p>4. Wait ~60 seconds for RBAC cache propagation, then switch to your <strong>Incognito window<\/strong> <strong>(<\/strong> <code>labuser1<\/code><strong> )<\/strong>, refresh the browser (<strong>F5<\/strong>), and retry creating a resource or adding a Tag inside <code>rg-lab6-ROLLNO<\/code> —it now succeeds! (Note: a Contributor can create/edit/delete resources, but still cannot assign RBAC roles to others—only an <em>Owner<\/em> can.)<\/p>\n<p>5. <strong>Inspect Effective Permissions with Check Access:<\/strong> In your Admin window on <code>rg-lab6-ROLLNO<\/code> → <strong>Access control (IAM)<\/strong>, click the <strong>Check access<\/strong> tab at the top (or click the <strong>View access to this<\/strong> <strong>resource<\/strong> → <strong>Check access<\/strong> button). Search for and click <strong>labuser1<\/strong>. A side panel opens showing <code>labuser1<\/code> ’s exact effective role (<strong>Contributor<\/strong>) and clearly states <em>“Inherited via group membership<\/em> <em>(grp-lab-readers)”<\/em>.<\/p>\n<h2>Step 5: Practice RBAC Role Assignment via Azure CLI (Cloud Shell)<\/h2>\n<p>In your Admin browser window, click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> in the top-right bar (Bash mode) and run these three commands from your manual (replace <code>ROLLNO<\/code> and <code>YOURDOMAIN<\/code> with your exact values):<\/p>\n<pre class=\"code\"><code>az group create --name rg-lab6-ROLLNO --location centralindia\naz role assignment create --assignee labuser1@YOURDOMAIN.onmicrosoft.com --role\nReader --resource-group rg-lab6-ROLLNO\naz role assignment list --resource-group rg-lab6-ROLLNO --output table<\/code><\/pre>\n<p class=\"li\">• <strong>Command 1:<\/strong> Confirms <code>rg-lab6-ROLLNO<\/code> exists in Central India (safe to run even if you already created it in the Portal—Azure simply updates/confirms it).<\/p>\n<p class=\"li\">• <strong>Command 2:<\/strong> Directly assigns the <code>Reader<\/code> role to <code>labuser1<\/code> at the <code>rg-lab6-ROLLNO<\/code> scope.<\/p>\n<p class=\"li\">• <strong>Command 3:<\/strong> Prints a clean table of every RBAC role assignment on <code>rg-lab6-ROLLNO<\/code> (showing Principal, Role, and Scope). <em>You can also screenshot this CLI table as extra verification evidence!<\/em><\/p>\n<hr class=\"pg\">\n<h2>4. Part C: MFA, Security Defaults and Conditional Access (Portal)<\/h2>\n<h2>Step 1: Review Security Defaults in Microsoft Entra ID<\/h2>\n<p>1. In your Admin browser window, open <strong>Microsoft Entra ID<\/strong>.<\/p>\n<p>2. In the left vertical menu, scroll down under <strong>Manage<\/strong> and click <strong>Properties<\/strong>.<\/p>\n<p>3. Scroll all the way to the very bottom of the Properties page and click the blue link <strong>Manage<\/strong> <strong>security defaults<\/strong>.<\/p>\n<p>4. A panel slides out on the right. Read the summary carefully—<strong>Security Defaults<\/strong> is Microsoft’s free baseline protection bundle that automatically enforces: Requiring <strong>all users to register for Microsoft Entra Multifactor Authentication (MFA)<\/strong> within 14 days.<\/p>\n<p class=\"li sub\">• Requiring administrators to perform MFA on every sign-in.<\/p>\n<p class=\"li sub\">• <strong>Blocking legacy authentication protocols<\/strong> (such as older POP3, IMAP, SMTP Basic Auth clients that cannot support MFA).<\/p>\n<p class=\"li sub\">• Protecting privileged activities such as accessing the Azure Portal, Azure CLI, or PowerShell.<\/p>\n<p>5. <em>Note for Step 3 below:<\/em> Keep Security Defaults <strong>Enabled<\/strong> during Step 2. (When you create a Conditional Access policy in Step 3, Azure lets you save it in <code>Report-only<\/code> mode, or asks you to temporarily disable Security Defaults if switching Conditional Access to <em>On<\/em>—because Security Defaults and custom Conditional Access policies cannot both be active simultaneously.)<\/p>\n<h2>Step 2: Register Microsoft Authenticator as labuser1 and Trigger MFA<\/h2>\n<p>1. Switch to your <strong>Incognito browser window<\/strong> where you are signed in as <code>labuser1<\/code>.<\/p>\n<p>2. In that Incognito window, open a new tab and navigate to: <code>https://mysignins.microsoft.com/security-info<\/code> (the <strong>My Security Info<\/strong> page).<\/p>\n<p>3. Click <strong>+ Add sign-in method<\/strong> → choose <strong>Microsoft Authenticator<\/strong> → click <strong>Add<\/strong>.<\/p>\n<p>4. Follow the on-screen wizard: Open the <strong>Microsoft Authenticator<\/strong> app on your smartphone → tap <strong>+<\/strong> (Add account) → choose <strong>Work or school account<\/strong> → tap <strong>Scan a QR code<\/strong>.<\/p>\n<p class=\"li sub\">• Scan the QR code shown on your laptop screen, approve the test 2-digit number prompt on your phone, and click <strong>Done<\/strong>.<\/p>\n<p>5. Sign out of <code>labuser1<\/code> (top-right profile icon → <em>Sign out<\/em>), close and reopen a fresh Incognito window, go to <code>portal.azure.com<\/code>, and sign back in as <code>labuser1<\/code>.<\/p>\n<p>6. <strong>Observe the MFA prompt:<\/strong> After entering your password, Azure displays an <em>“Approve sign in<\/em> <em>request”<\/em> screen with a 2-digit number to enter in your phone’s Authenticator app! <strong>Take<\/strong><\/p>\n<h3>Screenshot #3 of this live MFA prompt!<\/h3>\n<h2>Step 3: Create Conditional Access Policy CA-Require-MFA-Lab (Report-only)<\/h2>\n<p><em>Licensing Note (Entra ID P1 Trial):<\/em> Conditional Access requires <strong>Microsoft Entra ID P1 or P2<\/strong>. If clicking <em>+ Create new policy<\/em> is grayed out in your personal tenant, activate the free trial first: in Microsoft Entra ID left menu → <strong>Billing<\/strong> → <strong>Licenses<\/strong> → <strong>All products<\/strong> → click <strong>+ Try/Buy<\/strong> → activate the free trial for <strong>Microsoft Entra ID P2<\/strong> (or P1), wait 2 minutes, and refresh the page.<\/p>\n<hr class=\"pg\">\n<p>1. In your Admin window inside <strong>Microsoft Entra ID<\/strong>, look at the left vertical menu under <strong>Protection<\/strong> (or <strong>Manage → Security<\/strong>) and click <strong>Security<\/strong> → <strong>Conditional Access<\/strong> (or search <code>Conditional<\/code> <code>Access<\/code> directly in the top Global Search Bar).<\/p>\n<p>2. Click <strong>Policies<\/strong> in the left menu, then click <strong>+ Create new policy<\/strong> at the top toolbar.<\/p>\n<p>3. Configure each section of the new policy exactly as specified in your manual: <strong>Name:<\/strong> Type <code>CA-Require-MFA-Lab<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Assignments → Users:<\/strong> Click <em>0 users and groups selected<\/em> → under <strong>Include<\/strong> select <strong>Select<\/strong> <strong>users and groups<\/strong> → check <strong>Users and groups<\/strong> → search for and select <strong>grp-lab-readers<\/strong> → click <strong>Select<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Target resources:<\/strong> Click <em>No target resources selected<\/em> → keep dropdown on <em>Resources<\/em> <em>(formerly cloud apps)<\/em> → under <strong>Include<\/strong> click <strong>Select resources<\/strong> → click <em>None<\/em> → search for <code>Microsoft<\/code> <code>Azure<\/code> <code>Management<\/code> → check <strong>Microsoft Azure Management<\/strong> → click <strong>Select<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Access controls → Grant:<\/strong> Click <em>0 controls selected<\/em> → ensure <strong>Grant access<\/strong> is selected → check <strong>Require multifactor authentication<\/strong> → click <strong>Select<\/strong> at the bottom.<\/p>\n<p class=\"li sub\">• <strong>Enable policy (bottom of page):<\/strong> Click <strong>Report-only<\/strong>! <em>(Safety best practice: Report-only<\/em> <em>evaluates the policy silently on every login without risking locking anyone out.)<\/em><\/p>\n<p>4. Click the blue <strong>Create<\/strong> button. Wait ~10 seconds until <code>CA-Require-MFA-Lab<\/code> appears in the Policies list with State = <em>Report-only<\/em>. <strong>Take Screenshot #4 of the Conditional Access policy<\/strong> <strong>summary!<\/strong><\/p>\n<p>5. <strong>Review Sign-in Logs:<\/strong> In Microsoft Entra ID left menu under <strong>Monitoring<\/strong>, click <strong>Sign-in logs<\/strong>. Sign in once more as <code>labuser1<\/code> in Incognito, wait 2–3 minutes, click <strong>Refresh<\/strong> in Sign-in logs, click the <code>labuser1<\/code> sign-in entry, and open the <strong>Report-only<\/strong> tab at the top of the details drawer to see how <code>CA-Require-MFA-Lab<\/code> evaluated that login!<\/p>\n<h2>5. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Tenant Name<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Tenant ID<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Primary Domain<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Full <\/strong><code>labuser1<\/code><strong> Login &amp;<\/strong> <strong>Password<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Conditional Access Status / Note<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>6. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Role assignment list<\/td><td>Portal → <code>rg-lab6-ROLLNO<\/code> → <strong>Access control (IAM) → Role<\/strong> <strong>assignments<\/strong> showing <code>grp-lab-readers<\/code> (and/or Cloud Shell output of <code>az<\/code> <code>role<\/code> <code>assignment<\/code> <code>list<\/code>).<\/td><\
