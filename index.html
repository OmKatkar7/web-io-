rtical menu, click <strong>Health history<\/strong>.<\/p>\n<p>4. Use the <strong>Region<\/strong> filter dropdown at the top to filter specifically for <strong>Central India<\/strong> and record any recent incidents, planned maintenance, or advisories (or <em>“No recent events”<\/em>) in Section 6.<\/p>\n<h2>4. Part C: Switch Between Bash and PowerShell in Cloud Shell<\/h2>\n<p>Azure Cloud Shell lets you manage Azure using either <strong>Bash (Azure CLI)<\/strong> or <strong>PowerShell (Az<\/strong> <strong>PowerShell module)<\/strong> inside the exact same browser window:<\/p>\n<p>1. Open <strong>Cloud Shell (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right bar of the Portal. Confirm the top-left dropdown of the terminal toolbar currently shows <strong>Bash<\/strong>.<\/p>\n<p>2. Run the Azure CLI command to list all your resource groups:<\/p>\n<pre class=\"code\"><code>az group list --output table<\/code><\/pre>\n<p>3. Now click the <strong>Bash<\/strong> dropdown at the top-left corner of the Cloud Shell toolbar and select <strong>PowerShell<\/strong>. Click <strong>Confirm<\/strong> in the popup dialog.<\/p>\n<p>4. Wait ~10 seconds until the prompt changes to <code>PS<\/code> <code>/home/user&gt;<\/code>, then run the equivalent Azure PowerShell cmdlet:<\/p>\n<pre class=\"code\"><code>Get-AzResourceGroup | Format-Table ResourceGroupName, Location<\/code><\/pre>\n<p>5. Compare both outputs—they query the exact same Azure Resource Manager backend and list the same resource groups in different formats!<\/p>\n<p>6. <strong>Important:<\/strong> Click the <strong>PowerShell<\/strong> dropdown at the top-left of Cloud Shell and switch back to <strong>Bash<\/strong> before starting Part D.<\/p>\n<h2>5. Part D: Declarative Deployment with an ARM Template (CLI + Portal)<\/h2>\n<p>Instead of clicking through the Portal to build a Storage Account, you will now write an <strong>Azure<\/strong> <strong>Resource Manager (ARM) JSON template<\/strong> and deploy it twice to observe <strong>idempotency<\/strong>.<\/p>\n<hr class=\"pg\">\n<h2>Step 1: Create storage.json in the Cloud Shell Code Editor<\/h2>\n<p>1. In Cloud Shell (<strong>Bash<\/strong> mode), run this command to open the built-in browser code editor:<\/p>\n<pre class=\"code\"><code>code storage.json<\/code><\/pre>\n<p>2. A visual text editor panel opens inside Cloud Shell. Copy and paste this exact JSON template into the editor:<\/p>\n<pre class=\"code\"><code>{\n&quot;$schema&quot;: &quot;https://schema.management.azure.com/schemas/2019-04-\n01/deploymentTemplate.json#&quot;,\n&quot;contentVersion&quot;: &quot;1.0.0.0&quot;,\n&quot;parameters&quot;: {\n&quot;storagePrefix&quot;: { &quot;type&quot;: &quot;string&quot;, &quot;defaultValue&quot;: &quot;stlab9&quot;, &quot;maxLength&quot;: 11\n}\n},\n&quot;variables&quot;: {\n&quot;storageName&quot;: &quot;[concat(parameters(&#x27;storagePrefix&#x27;),\nuniqueString(resourceGroup().id))]&quot;\n},\n&quot;resources&quot;: [\n{\n&quot;type&quot;: &quot;Microsoft.Storage/storageAccounts&quot;,\n&quot;apiVersion&quot;: &quot;2023-01-01&quot;,\n&quot;name&quot;: &quot;[variables(&#x27;storageName&#x27;)]&quot;,\n&quot;location&quot;: &quot;[resourceGroup().location]&quot;,\n&quot;sku&quot;: { &quot;name&quot;: &quot;Standard_LRS&quot; },\n&quot;kind&quot;: &quot;StorageV2&quot;,\n&quot;tags&quot;: { &quot;Course&quot;: &quot;E0416B&quot; }\n}\n],\n&quot;outputs&quot;: {\n&quot;storageAccountName&quot;: { &quot;type&quot;: &quot;string&quot;, &quot;value&quot;: &quot;\n[variables(&#x27;storageName&#x27;)]&quot; }\n}\n}<\/code><\/pre>\n<p>3. <strong>How to save and close the editor:<\/strong> Press <code>Ctrl<\/code> <code>+<\/code> <code>S<\/code> (to save), then press <code>Ctrl<\/code> <code>+<\/code> <code>Q<\/code> (to close the editor)—or click the <strong>...<\/strong> (three dots) icon at the top-right corner of the editor panel → click <strong>Save<\/strong> → click <strong>Close Editor<\/strong>.<\/p>\n<p>4. Verify the file saved cleanly by running <code>cat<\/code> <code>storage.json<\/code> in Bash.<\/p>\n<h2>Step 2: Deploy the ARM Template Twice &amp; Verify Deployment History<\/h2>\n<p>Run the deployment command the <strong>first time<\/strong> (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<hr class=\"pg\">\n<pre class=\"code\"><code>az deployment group create --resource-group rg-lab9-ROLLNO --template-file\nstorage.json<\/code><\/pre>\n<p class=\"li\">• Wait ~30 seconds. Azure generates a deterministic unique storage name starting with <code>stlab9...<\/code> (using <code>uniqueString(resourceGroup().id)<\/code>), creates the Storage Account with tag <code>Course=E0416B<\/code>, and prints the generated name in the <code>outputs<\/code> section at the bottom of the JSON response!<\/p>\n<p>Now run the <strong>exact same deployment command a second time<\/strong> and list the deployments:<\/p>\n<pre class=\"code\"><code>az deployment group create --resource-group rg-lab9-ROLLNO --template-file\nstorage.json\naz deployment group list --resource-group rg-lab9-ROLLNO --output table<\/code><\/pre>\n<p class=\"li\">• <strong>Observe Idempotency:<\/strong> The second deployment finishes in just a few seconds with <code>ProvisioningState:<\/code> <code>Succeeded<\/code>, and it <strong>does NOT create a second duplicate storage<\/strong> <strong>account<\/strong>—because ARM checks the current state, sees the exact desired storage account already exists, and leaves it intact!<\/p>\n<h3>Verify in the Azure Portal:<\/h3>\n<p>1. Open <strong>Resource groups<\/strong> → <strong>rg-lab9-ROLLNO<\/strong>.<\/p>\n<p>2. On the <strong>Overview<\/strong> blade, verify your newly created <code>stlab9...<\/code> storage account appears alongside <code>vm-mon<\/code>.<\/p>\n<p>3. In the left vertical menu of <code>rg-lab9-ROLLNO<\/code>, click <strong>Deployments<\/strong> (under <em>Settings<\/em>) to view the deployment history showing <code>storage<\/code> with Status: <em>Succeeded<\/em>. <strong>Take Screenshot #3 right<\/strong> <strong>here!<\/strong><\/p>\n<p>4. <em>(Optional — Export template):<\/em> Open <code>vm-mon<\/code> → scroll down the left menu to <strong>Automation<\/strong> → click <strong>Export template<\/strong> to inspect the full ARM JSON blueprint Azure automatically generates for any existing resource!<\/p>\n<h2>6. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><code>vm-mon<\/code><strong> Public IP &amp; Peak CPU %<\/strong> <strong>Observed<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Alert Rule Name &amp; Action Group<\/strong> <strong>Email<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Service Health History (Central India)<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>ARM Template Output Storage<\/strong> <strong>Account Name<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<h2>7. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>CPU metric spike &amp; Alert rule<\/td><td>Portal → <code>vm-mon<\/code> → <strong>Monitoring → Metrics<\/strong> showing the <em>Percentage CPU<\/em> spike jumping near 100%, plus screenshot of the <code>High-CPU-Alert-Lab9<\/code> rule in <strong>Alerts<\/strong>.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>Alert email received<\/td><td>Your email inbox showing the fired Azure Monitor alert notification email triggered by Action Group <code>ag-lab9<\/code>.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>Successful ARM deployment &amp; created storage account<\/td><td>Portal → <code>rg-lab9-ROLLNO<\/code> → <strong>Deployments<\/strong> showing <em>Succeeded<\/em> (and <strong>Overview<\/strong> showing the <code>stlab9...<\/code> storage account created by <code>storage.json<\/code>).<\/td><\/tr>\n<\/tbody><\/table>\n<h2>8. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these structured, exam-ready answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: What is Infrastructure as Code? List two benefits of ARM templates over clicking through the portal.<\/h2>\n<div class=\"callout tip\"><p><strong>Infrastructure as Code (IaC)<\/strong> is the practice of defining, provisioning, and managing cloud infrastructure (networks, VMs, storage accounts, security rules) using human-readable, machine-executable configuration files (such as JSON or Bicep) rather than manual interactive clicks in a web portal.<\/p><strong class=\"callout-title\">Two key benefits of ARM templates over clicking through the Portal:<\/strong><p>1. <strong>Consistency &amp; Repeatability (Eliminates Human Error):<\/strong> The exact same template can deploy identical Dev, Test, and Production environments hundreds of times without anyone forgetting a tag, region, or security setting.<\/p><p>2. <strong>Version Control &amp; Automated CI/CD Integration:<\/strong> Templates can be stored in Git repositories for peer code review, change history tracking, rollback, and automated deployment via Azure DevOps or GitHub Actions—plus Azure orchestrates parallel resource creation automatically.<\/p><\/div>\n<h2>Question 2: Why does deploying the same template twice not create duplicate resources (idempotency)?<\/h2>\n<div class=\"callout tip\"><p>ARM templates use a <strong>declarative<\/strong> model rather than an imperative script. Instead of telling Azure <em>“step 1: create a new storage account”<\/em>, the template declares the <strong>desired end state<\/strong> (<em>“ensure a<\/em> <em>storage account with this exact name, SKU, and tags exists in this resource group”<\/em>). Because ARM deployments are <strong>idempotent<\/strong>, when you run the template a second time, Azure Resource Manager compares the template’s declared state against the resources already existing in the resource group. Seeing that the storage account already exists and matches the specification, Azure leaves it untouched (or applies only changed properties) instead of creating a duplicate.<\/p><\/div>\n<hr class=\"pg\">\n<h2>Question 3: Compare Azure Monitor, Azure Advisor and Azure Service Health in one line each.<\/h2>\n<table>\n<thead>\n<tr><th>Azure Service<\/th><th>One-Line Comparison<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Azure Monitor<\/strong><\/td><td>Collects, analyzes, and alerts on real-time <strong>telemetry (metrics, logs, and activity<\/strong> <strong>logs)<\/strong> from <em>your own<\/em> deployed Azure applications and resources.<\/td><\/tr>\n<tr><td><strong>Azure Advisor<\/strong><\/td><td>Analyzes your resource configurations and usage to provide personalized <strong>best-<\/strong><strong>practice recommendations<\/strong> across Cost, Security, Reliability, Operational Excellence, and Performance.<\/td><\/tr>\n<tr><td><strong>Azure Service Health<\/strong><\/td><td>Provides personalized notifications and status reports about outages, planned maintenance, and health advisories affecting <strong>Microsoft’s underlying global Azure<\/strong> <strong>platform and regions<\/strong>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 4: What does Azure Arc add for servers running on-premises or in another cloud?<\/h2>\n<div class=\"callout tip\"><p><strong>Azure Arc<\/strong> extends the <strong>Azure Resource Manager (ARM) control plane<\/strong> outside of Azure so that physical servers and VMs running in your on-premises datacenter, on edge devices, or in other public clouds (such as AWS or Google Cloud) appear as <strong>first-class projected resources inside<\/strong> <strong>the Azure Portal<\/strong>. Once connected via the lightweight Azure Connected Machine agent, you can organize, tag, govern with <strong>Azure Policy<\/strong>, monitor with <strong>Azure Monitor / Log Analytics<\/strong>, manage updates, and apply <strong>RBAC<\/strong> across hybrid and multi-cloud servers from one unified Azure dashboard.<\/p><\/div>\n<h2>9. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>Once all screenshots are saved in your lab journal, run this command in <strong>Cloud Shell (Bash)<\/strong> (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab9-ROLLNO --yes --no-wait<\/code><\/pre>\n<p class=\"li\">• Because both <code>High-CPU-Alert-Lab9<\/code> and <code>ag-lab9<\/code> were created inside <code>rg-lab9-ROLLNO<\/code>, deleting the resource group removes the VM, storage account, alert rule, and action group together!<\/p>\n<p class=\"li\">• <em>Double-check:<\/em> Open <strong>Monitor → Alerts → Alert rules<\/strong> and <strong>Action groups<\/strong> in the Portal to confirm no leftover alert rules or action groups remain in any other resource group, and run <code>az<\/code> <code>group<\/code> <code>list<\/code> <code>--output<\/code> <code>table<\/code> to confirm your subscription is completely clean.<\/p>\n<hr class=\"pg\">\n<h2>10. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Alert email does not arrive after 5 minutes<\/td><td>Check two things: (1) Look in your email’s <strong>Spam / Junk<\/strong> folder for <code>azure-noreply@microsoft.com<\/code>; (2) Confirm you created the Alert rule <em>before<\/em> running <code>yes<\/code> <code>&gt;<\/code> <code>/dev/null<\/code> <code>&amp;<\/code> and let <code>sleep<\/code> <code>300<\/code> run for the full 5 minutes.<\/td><\/tr>\n<tr><td><code>code<\/code> <code>storage.json<\/code> shows JSON syntax error on deploy<\/td><td>Make sure every opening brace <code>{<\/code> and bracket <code>[<\/code> was copied intact from Part D, Step 1, and that you pressed <code>Ctrl<\/code> <code>+<\/code> <code>S<\/code> before closing the editor.<\/td><\/tr>\n<tr><td><code>az<\/code> <code>deployment<\/code> <code>group<\/code> <code>create<\/code> says command not found<\/td><td>You forgot to switch Cloud Shell back from <strong>PowerShell<\/strong> to <strong>Bash<\/strong> after Part C! Click the top-left dropdown in Cloud Shell and select <strong>Bash<\/strong>.<\/td><\/tr>\n<tr><td><code>kill<\/code> <code>%1<\/code> says <em>no such job<\/em><\/td><td>The background <code>yes<\/code> job already stopped or you opened a new terminal session. Run <code>pkill<\/code> <code>yes<\/code> inside <code>vm-mon<\/code> (or exit SSH) to be 100% sure CPU load has stopped.<\/td><\/tr>\n<\/tbody><\/table>"}</script>
  <script>
    const labs = JSON.parse(document.getElementById('labs-data').textContent);
    const btns = document.getElementById('btns');
    const content = document.getElementById('content');
    const open = document.getElementById('open');
    const hint = document.getElementById('hint');

    for (let i = 1; i <= 9; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = i;
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => {
        for (const b of btns.children) b.setAttribute('aria-pressed', String(b === btn));
        hint.hidden = true;
        content.hidden = false;
        content.innerHTML = labs[String(i)];
        open.hidden = false;
        open.href = encodeURI(`Lab ${i} Step-by-Step Beginner Guide (E0416B).pdf`);
        window.scrollTo(0, 0);
      };
      btns.appendChild(btn);
    }
  </script>
