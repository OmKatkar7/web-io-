/tr>\n<tr><td><strong>2<\/strong><\/td><td>Failed create attempt by <code>Reader<\/code><\/td><td>Incognito window signed in as <code>labuser1<\/code> showing the authorization error when attempting to create or delete a resource inside <code>rg-lab6-ROLLNO<\/code>.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>MFA prompt<\/td><td>Incognito sign-in screen showing the Microsoft Authenticator 2-digit number MFA prompt for <code>labuser1<\/code> (or My Security Info confirmation).<\/td><\/tr>\n<tr><td><strong>4<\/strong><\/td><td>Conditional Access policy summary<\/td><td>Portal → Microsoft Entra ID → <strong>Conditional Access → Policies<\/strong> showing <code>CA-Require-MFA-Lab<\/code> assigned to <code>grp-lab-readers<\/code> targeting <em>Microsoft Azure Management<\/em> in <code>Report-only<\/code> mode (plus optional Sign-in log Report-only evaluation).<\/td><\/tr>\n<\/tbody><\/table>\n<h2>7. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these clear, exam-ready answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: Compare authentication and authorization with an example from this lab.<\/h2>\n<table>\n<thead>\n<tr><th>Aspect<\/th><th>Authentication (AuthN)<\/th><th>Authorization (AuthZ)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Core Question<\/strong><\/td><td><em>“Who are you?”<\/em> — Verifying the identity of a user or service.<\/td><td><em>“What are you allowed to do?”<\/em> — Determining which actions and resources the verified identity can access.<\/td><\/tr>\n<tr><td><strong>Azure Service<\/strong><\/td><td>Handled by <strong>Microsoft Entra ID<\/strong> (passwords, MFA, passwordless login).<\/td><td>Handled by <strong>Azure RBAC<\/strong> (role assignments like Reader, Contributor, Owner).<\/td><\/tr>\n<tr><td><strong>Order<\/strong><\/td><td>Always happens <strong>first<\/strong> (sign-in).<\/td><td>Happens <strong>second<\/strong> (after identity is confirmed).<\/td><\/tr>\n<tr><td><strong>Example from Lab<\/strong> <strong>6<\/strong><\/td><td><code>labuser1<\/code> entering their username, password, and approving the <strong>Microsoft<\/strong> <strong>Authenticator MFA prompt<\/strong> to prove who they are.<\/td><td>Azure RBAC allowing <code>labuser1<\/code> to <strong>view<\/strong> <code>rg-lab6-ROLLNO<\/code> as a <code>Reader<\/code>, blocking resource creation, and then permitting creation once changed to <code>Contributor<\/code>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 2: What does the scope of a role assignment mean? Name the four levels of scope.<\/h2>\n<div class=\"callout tip\"><p>The <strong>scope<\/strong> of a role assignment defines the exact <strong>set of Azure resources to which the assigned<\/strong> <strong>permissions apply<\/strong>. Scope follows a strict top-down inheritance hierarchy: any role granted at a parent level automatically flows downward to every child inside it, following the principle of <strong>Least<\/strong> <strong>Privilege<\/strong> (assign roles at the narrowest scope needed, such as a single Resource Group rather than an entire Subscription).<\/p><\/div>\n<hr class=\"pg\">\n<div class=\"callout info\"><p><strong>1. Management Group<\/strong> — Broadest scope; permissions apply to all Subscriptions under that management group.<\/p><p><strong>2. Subscription<\/strong> — Permissions apply to all Resource Groups and resources inside that subscription.<\/p><p><strong>3. Resource Group<\/strong> — Permissions apply to all resources inside one folder (e.g., <code>rg-lab6-ROLLNO<\/code> used in Lab 6).<\/p><p><strong>4. Resource<\/strong> — Narrowest scope; permissions apply to one single resource (e.g., a single Storage Account).<\/p><\/div>\n<h2>Question 3: How does Conditional Access support the Zero Trust principle “verify explicitly”?<\/h2>\n<div class=\"callout tip\"><p>The Zero Trust principle <strong>“Verify explicitly”<\/strong> states that you must <em>never trust a user or connection<\/em> <em>automatically<\/em> (even inside a corporate network)—every access request must be continuously authenticated and authorized using all available real-time data points. <strong>Conditional Access<\/strong> enforces this principle dynamically at every sign-in by acting as an automated policy engine:<\/p><p class=\"li\">• <strong>Evaluates Live Signals:<\/strong> Before granting access, it inspects multiple signals—<em>who the<\/em> <em>user/group is<\/em> ( <code>grp-lab-readers<\/code>), <em>which sensitive app they are opening<\/em> ( <code>Microsoft<\/code> <code>Azure<\/code> <code>Management<\/code>), <em>their device compliance, IP location, and real-time sign-in risk<\/em>.<\/p><p class=\"li\">• <strong>Enforces Adaptive Decisions:<\/strong> Based on those signals, it explicitly demands stronger verification—such as <strong>Require multifactor authentication<\/strong>—or blocks risky/uncompliant access entirely instead of relying on a static username and password alone.<\/p><\/div>\n<h2>Question 4: Name two passwordless authentication methods.<\/h2>\n<div class=\"callout tip\"><p>1. <strong>Windows Hello for Business:<\/strong> Replaces passwords on Windows PCs with device-bound cryptographic keys unlocked locally using biometrics (fingerprint or facial recognition) or a device PIN.<\/p><p>2. <strong>FIDO2 Security Keys (Passkeys):<\/strong> Standards-based physical hardware keys (such as a USB/NFC YubiKey) or synced device passkeys that use public-key cryptography to sign in without typing any password (phishing-resistant). <em>Third valid method (useful for Viva):<\/em> <strong>Microsoft Authenticator Phone Sign-in<\/strong> (passwordless push notification with number matching directly on a registered smartphone).<\/p><\/div>\n<h2>8. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>First delete the resource group and storage account using <strong>Cloud Shell (Bash)<\/strong> in your Admin window (replace <code>ROLLNO<\/code> with your roll number):<\/p>\n<pre class=\"code\"><code>az group delete --name rg-lab6-ROLLNO --yes --no-wait<\/code><\/pre>\n<hr class=\"pg\">\n<p>Next, clean up the Microsoft Entra ID objects (especially important if working in a shared tenant):<\/p>\n<p>1. <strong>Delete Conditional Access Policy:<\/strong> Open <strong>Microsoft Entra ID<\/strong> → <strong>Security<\/strong> → <strong>Conditional<\/strong> <strong>Access<\/strong> → <strong>Policies<\/strong> → click the <code>...<\/code> menu on <code>CA-Require-MFA-Lab<\/code> → click <strong>Delete<\/strong> → <strong>Yes<\/strong>.<\/p>\n<p>2. <strong>Delete Security Group:<\/strong> Open <strong>Microsoft Entra ID<\/strong> → <strong>Groups<\/strong> → check <code>grp-lab-readers<\/code> → click <strong>Delete<\/strong> → <strong>Yes<\/strong>.<\/p>\n<p>3. <strong>Delete Test User:<\/strong> Open <strong>Microsoft Entra ID<\/strong> → <strong>Users<\/strong> → check <code>labuser1<\/code> → click <strong>Delete<\/strong> → <strong>OK<\/strong>.<\/p>\n<h2>9. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><em>+ New user<\/em> or <em>+ New group<\/em> is grayed out<\/td><td>Your college IT manages your university tenant and restricts student accounts from creating directory users. Use a personal free Azure account/tenant, or document the instructor’s live demo as instructed in the manual.<\/td><\/tr>\n<tr><td>Cannot find <code>Contributor<\/code> role under <em>Add role assignment<\/em><\/td><td>Azure moved <em>Owner<\/em>, <em>Contributor<\/em>, and <em>User Access Administrator<\/em> to the second tab labeled <strong>Privileged administrator roles<\/strong> (right next to <em>Job<\/em> <em>function roles<\/em>).<\/td><\/tr>\n<tr><td><code>labuser1<\/code> still cannot create a resource after changing to <code>Contributor<\/code><\/td><td>RBAC changes take 1–3 minutes to propagate across Azure tokens. Wait 60 seconds, then sign out and sign back in (or refresh the Portal) inside the Incognito window.<\/td><\/tr>\n<tr><td><em>+ Create new policy<\/em> is grayed out in Conditional Access<\/td><td>Your tenant is on Microsoft Entra ID Free. Go to <strong>Entra ID → Billing →<\/strong> <strong>Licenses → All products → + Try/Buy<\/strong> and activate the free 30-day <strong>Microsoft Entra ID P2<\/strong> trial.<\/td><\/tr>\n<tr><td><code>az<\/code> <code>role<\/code> <code>assignment<\/code> <code>create<\/code> says user not found<\/td><td>Double-check that you replaced <code>YOURDOMAIN.onmicrosoft.com<\/code> with your exact Primary Domain from Part A, Step 1 (no extra spaces).<\/td><\/tr>\n<\/tbody><\/table>", "7": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 7: Azure Policy and Resource Locks<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO4  |  <strong>Theory Alignment:<\/strong> Unit 4  |  <strong>Estimated Time:<\/strong> 2 Hours<\/p>\n<p><strong>Aim:<\/strong> Enforce organizational standards with Azure Policy and protect resources from accidental deletion using locks.<\/p>\n<p><strong>Prerequisites:<\/strong> Labs 1 and 2 completed; access to the Azure Portal and Cloud Shell (Bash). <em>Important timing note:<\/em> A newly created Azure Policy assignment can take <strong>5 to 30 minutes<\/strong> to start enforcing across Azure’s backend, so always start <strong>Part A<\/strong> first before doing anything else!<\/p>\n<div class=\"callout info\"><strong class=\"callout-title\">Before You Start: 4 Essential Beginner Tips for Lab 7<\/strong><p class=\"li sub\">• <strong>Always select the Resource Group Scope (NOT the whole Subscription):<\/strong> When assigning policies in Part A, double-check that the <strong>Scope<\/strong> includes <code>rg-lab7-ROLLNO<\/code>. Accidentally assigning a policy to your entire Subscription will block future labs unless removed!<\/p><p class=\"li sub\">• <strong>Notice why Part B includes <\/strong><code>--tags<\/code> <code>Course=E0416B<\/code><strong> :<\/strong> Because your second policy requires every new resource in <code>rg-lab7-ROLLNO<\/code> to have tag <code>Course<\/code> <code>=<\/code> <code>E0416B<\/code>, Azure would block creating the storage account in Part B if that tag were missing!<\/p><p class=\"li sub\">• <strong>You do NOT actually spend credits creating the large VM in Step 4:<\/strong> Your test VM ( <code>Standard_D4s_v3<\/code>) will be blocked during the <em>Validation<\/em> screen before Azure ever creates or charges for it. (If validation unexpectedly passes, do <strong>not<\/strong> click Create—wait another 5 minutes for the policy to finish activating.)<\/p><p class=\"li sub\">• <strong>You MUST delete all locks before deleting the resource group:<\/strong> During Clean-up, remove both the CLI <code>CanNotDelete<\/code> lock AND any Portal <code>ReadOnly<\/code> lock you tested, then delete the two Policy assignments.<\/p><\/div>\n<h2>1. Plain-English Overview: Cloud Governance Guardrails<\/h2>\n<p>In Lab 6, you used <strong>RBAC<\/strong> to control <em>who<\/em> can access Azure resources. In Lab 7, you add two automated safety guardrails that apply even to administrators and Owners:<\/p>\n<table>\n<thead>\n<tr><th>Governance Tool<\/th><th>Plain-English Analogy<\/th><th>What You Configure in Lab 7<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Azure Policy<\/strong><\/td><td><strong>Company building rules:<\/strong> Controls <em>what<\/em> <em>properties<\/em> resources must follow (e.g., “Only cheap B-series VMs allowed” and “Every resource must carry a Course tag”).<\/td><td>Assign two built-in policies on <code>rg-lab7-ROLLNO<\/code>, verify Azure denies an expensive <code>Standard_D4s_v3<\/code> VM, and inspect the Compliance dashboard.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Governance Tool<\/th><th>Plain-English Analogy<\/th><th>What You Configure in Lab 7<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Resource Locks<\/strong><\/td><td><strong>Physical padlock on a switch:<\/strong> Prevents accidental deletion or modification of critical cloud resources— even if an Owner runs a delete command by mistake!<\/td><td>Put a <code>CanNotDelete<\/code> lock on <code>rg-lab7-ROLLNO<\/code> via CLI (triggering <code>ScopeLocked<\/code>), then test a <code>ReadOnly<\/code> lock on your storage account in the Portal.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Policy Assignments &amp; Compliance (Azure Portal)<\/h2>\n<h2>Step 1: Create Resource Group rg-lab7-ROLLNO<\/h2>\n<p>1. Sign in at <code>portal.azure.com<\/code>.<\/p>\n<p>2. Click the top-center Global Search Bar, type <code>Resource<\/code> <code>groups<\/code>, and click <strong>Resource groups<\/strong>.<\/p>\n<p>3. Click <strong>+ Create<\/strong> near the top-left.<\/p>\n<p>4. Set <strong>Resource group<\/strong> to <code>rg-lab7-ROLLNO<\/code> (replace <code>ROLLNO<\/code> with your lowercase roll number, e.g., <code>rg-lab7-cfis042<\/code>) and <strong>Region<\/strong> to <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p>5. Click <strong>Review + create<\/strong> → <strong>Create<\/strong>.<\/p>\n<h2>Step 2: Assign Policy #1 — Allowed virtual machine size SKUs<\/h2>\n<p>1. Click the top-center Global Search Bar, type <code>Policy<\/code>, and click <strong>Policy<\/strong> under Services (green checkmark shield icon).<\/p>\n<p>2. In the left vertical menu of Azure Policy, look under the <strong>Authoring<\/strong> section and click <strong>Definitions<\/strong>.<\/p>\n<p>3. At the top of the Definitions list, click inside the <strong>Search<\/strong> box, type <code>Allowed<\/code> <code>virtual<\/code> <code>machine<\/code> <code>size<\/code> <code>SKUs<\/code>, and press <strong>Enter<\/strong>.<\/p>\n<p>4. Click on the built-in policy row named <strong>Allowed virtual machine size SKUs<\/strong> (Category: <em>Compute<\/em>).<\/p>\n<p>5. <em>Quick check for Step 3’s note:<\/em> Glance at the JSON preview on screen and scroll to the bottom <code>&quot;then&quot;:<\/code> <code>{<\/code> <code>&quot;effect&quot;:<\/code> <code>&quot;deny&quot;<\/code> <code>}<\/code> —this policy uses the <strong>Deny<\/strong> effect, meaning it actively blocks non-compliant VMs from being created.<\/p>\n<p>6. Click the blue <strong>Assign policy<\/strong> button at the top-left toolbar.<\/p>\n<p>7. On the <strong>Basics<\/strong> tab, set the <strong>Scope<\/strong> carefully: Click the blue <strong>...<\/strong> (ellipsis) button on the right side of the <strong>Scope<\/strong> box.<\/p>\n<p class=\"li sub\">• A Scope panel slides out from the right. Keep your <strong>Subscription<\/strong> selected, then open the <strong>Resource Group<\/strong> dropdown and choose <strong>rg-lab7-ROLLNO<\/strong>.<\/p>\n<p class=\"li sub\">• Click the blue <strong>Select<\/strong> button at the bottom of the slide-out panel. Confirm the Scope box now shows <code>Your<\/code> <code>Subscription<\/code> <code>/<\/code> <code>rg-lab7-ROLLNO<\/code>.<\/p>\n<p class=\"li sub\">• Confirm <strong>Policy enforcement<\/strong> is set to <strong>Enabled<\/strong>.<\/p>\n<p>8. Click <strong>Next<\/strong> (or click the <strong>Parameters<\/strong> tab at the top).<\/p>\n<hr class=\"pg\">\n<p>9. On the <strong>Parameters<\/strong> tab, open the <strong>Allowed size SKUs<\/strong> dropdown list: Type <code>Standard_B1s<\/code> in the dropdown’s filter box and check the box next to <strong>Standard_B1s<\/strong>.<\/p>\n<p class=\"li sub\">• Clear the filter text, type <code>Standard_B2s<\/code>, and check the box next to <strong>Standard_B2s<\/strong>.<\/p>\n<p class=\"li sub\">• Click outside the dropdown and verify it says <em>2 selected<\/em> (only <code>Standard_B1s<\/code> and <code>Standard_B2s<\/code>).<\/p>\n<p>10. Click <strong>Review + create<\/strong> at the bottom-left, check the summary, and click <strong>Create<\/strong>.<\/p>\n<h2>Step 3: Assign Policy #2 — Require a tag and its value on resources<\/h2>\n<p>1. In the left vertical menu of Azure Policy (under <strong>Authoring<\/strong>), click <strong>Definitions<\/strong> again.<\/p>\n<p>2. In the Search box, type <code>Require<\/code> <code>a<\/code> <code>tag<\/code> <code>and<\/code> <code>its<\/code> <code>value<\/code> <code>on<\/code> <code>resources<\/code> and press <strong>Enter<\/strong>.<\/p>\n<p>3. Click the built-in policy named <strong>Require a tag and its value on resources<\/strong> (Category: <em>Tags<\/em>). <strong>Record the Effect used by both policies (Manual Step 3):<\/strong> Both <em>Allowed virtual machine size<\/em> <em>SKUs<\/em> and <em>Require a tag and its value on resources<\/em> use the <strong>Deny<\/strong> effect! (A <strong>Deny<\/strong> policy completely blocks creation of non-compliant resources, whereas an <strong>Audit<\/strong> policy allows creation to succeed and merely logs a warning in the Compliance dashboard.)<\/p>\n<p>4. Click the blue <strong>Assign policy<\/strong> button at the top-left.<\/p>\n<p>5. On the <strong>Basics<\/strong> tab: Click the <strong>...<\/strong> button next to <strong>Scope<\/strong> → select your Subscription → select Resource Group <strong>rg-<\/strong><strong>lab7-ROLLNO<\/strong> → click <strong>Select<\/strong>.<\/p>\n<p class=\"li sub\">• Confirm <strong>Policy enforcement<\/strong> is <strong>Enabled<\/strong>.<\/p>\n<p>6. Click the <strong>Parameters<\/strong> tab at the top and type the exact required values: <strong>Tag Name:<\/strong> <code>Course<\/code><\/p>\n<p class=\"li sub\">• <strong>Tag Value:<\/strong> <code>E0416B<\/code><\/p>\n<p>7. Click <strong>Review + create<\/strong> → <strong>Create<\/strong>.<\/p>\n<div class=\"callout tip\"><p><strong>Smart Time-Saver:<\/strong> Azure takes 5–15 minutes to activate newly assigned policies. While waiting, you can start reading Part B or fill in your Lab Record Table—then come back to Step 4 below to trigger the policy denial!<\/p><\/div>\n<h2>Step 4: Test Policy Enforcement by Trying to Create a Standard_D4s_v3 VM<\/h2>\n<p>1. After waiting <strong>5 to 10 minutes<\/strong>, click the top-center Global Search Bar, type <code>Virtual<\/code> <code>machines<\/code>, and click <strong>Virtual machines<\/strong>.<\/p>\n<p>2. Click <strong>+ Create<\/strong> → <strong>Azure virtual machine<\/strong>.<\/p>\n<p>3. Fill in the <strong>Basics<\/strong> tab just enough to reach validation: <strong>Resource group:<\/strong> Select <code>rg-lab7-ROLLNO<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Virtual machine name:<\/strong> Type <code>vm-policy-test<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Region:<\/strong> Select <strong>(Asia Pacific) Central India<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Image:<\/strong> Keep Ubuntu 22.04 LTS (default).<\/p>\n<p class=\"li sub\">• <strong>Size:<\/strong> Click the dropdown (or <em>See all sizes<\/em>) and choose <strong>Standard_D4s_v3<\/strong> (4 vCPUs, 16 GiB RAM — intentionally <em>outside<\/em> our allowed B1s/B2s list!).<\/p>\n<hr class=\"pg\">\n<p>4. <strong>Authentication type:<\/strong> Select <strong>Password<\/strong>, enter any test username (e.g., <code>azureuser<\/code>) and a valid password (we will never actually deploy this VM!).<\/p>\n<p>5. <em>Pro Tip for a Crystal-Clear VM SKU Denial:<\/em> Click the <strong>Tags<\/strong> tab and add <code>Course<\/code> = <code>E0416B<\/code> so your test satisfies Policy #2 and isolates Policy #1 cleanly. <em>(If you skip adding the tag, Azure will<\/em> <em>list BOTH policy violations at once—either way triggers <\/em><code>RequestDisallowedByPolicy<\/code><em> !)<\/em><\/p>\n<p>6. Click the blue <strong>Review + create<\/strong> button at the bottom-left.<\/p>\n<p>7. <strong>Observe the Red Denial Banner:<\/strong> Instead of green <em>Validation passed<\/em>, Azure shows a red banner:<\/p>\n<h3>Validation failed. Required information is missing or not valid.<\/h3>\n<p>8. Click the blue <strong>Click here to view details<\/strong> link inside the red banner (or open the <em>Raw Error<\/em> tab in the right-hand slide-out panel). You will see the exact error code: <code>&quot;code&quot;:<\/code> <code>&quot;RequestDisallowedByPolicy&quot;<\/code><\/p>\n<p class=\"li sub\">• <code>&quot;message&quot;:<\/code> <code>&quot;Resource<\/code> <code>&#x27;vm-policy-test&#x27;<\/code> <code>was<\/code> <code>disallowed<\/code> <code>by<\/code> <code>policy.<\/code> <code>Policy<\/code><\/p>\n<p class=\"li sub\">• <code>identifiers:<\/code> <code>...<\/code> <code>Allowed<\/code> <code>virtual<\/code> <code>machine<\/code> <code>size<\/code> <code>SKUs<\/code> <code>...&quot;<\/code><\/p>\n<p>9. <strong>Take Screenshot #1 right now showing the red Validation failed banner AND the<\/strong> <code>RequestDisallowedByPolicy<\/code><strong> details!<\/strong> Then close the Create VM wizard (click the <strong>X<\/strong> at top-right → <em>OK<\/em> to discard) without creating any VM.<\/p>\n<h2>Step 5: Review the Azure Policy Compliance Dashboard<\/h2>\n<p>1. Click the top-center Global Search Bar, type <code>Policy<\/code>, and click <strong>Policy<\/strong>.<\/p>\n<p>2. In the left vertical menu of Azure Policy, click <strong>Compliance<\/strong> (directly under Overview).<\/p>\n<p>3. At the top of the Compliance page, use the <strong>Scope<\/strong> filter to narrow the view to <code>rg-lab7-ROLLNO<\/code> (or scroll through the table to find your two assignments: <em>Allowed virtual machine size SKUs<\/em> and <em>Require a tag and its value on resources<\/em>).<\/p>\n<p>4. Observe the <strong>Compliance state<\/strong> column (e.g., <em>Compliant<\/em>, <em>Not started<\/em> if still scanning, or <em>Non-<\/em><em>compliant<\/em> if any pre-existing resource inside the group lacked the tag). Click either policy assignment name to view its breakdown and list of non-compliant resources (if any).<\/p>\n<p>5. <strong>Take Screenshot #2 of the Policy Compliance dashboard showing both assignments!<\/strong><\/p>\n<h2>3. Part B: Resource Locks (Cloud Shell CLI + Portal ReadOnly Test)<\/h2>\n<p>Now you will create a compliant storage account inside <code>rg-lab7-ROLLNO<\/code>, lock the resource group against deletion via CLI, prove that deletion fails with <code>ScopeLocked<\/code>, and then test a <strong>ReadOnly<\/strong> lock in the Portal.<\/p>\n<h2>Step 1: Create Storage Account &amp; Apply CanNotDelete Lock (Cloud Shell)<\/h2>\n<p>1. Click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> in the top-right blue bar of the Azure Portal and select <strong>Bash<\/strong>.<\/p>\n<p>2. Run these four commands one by one (replace <code>ROLLNO<\/code> with your lowercase roll number):<\/p>\n<hr class=\"pg\">\n<pre class=\"code\"><code>az storage account create --name stlab7$RANDOM --resource-group rg-lab7-ROLLNO --\nlocation centralindia --sku Standard_LRS --tags Course=E0416B\naz lock create --name lock-nodelete --lock-type CanNotDelete --resource-group rg-\nlab7-ROLLNO\naz group delete --name rg-lab7-ROLLNO --yes\naz lock list --resource-group rg-lab7-ROLLNO --output table<\/code><\/pre>\n<p class=\"li\">• <strong>Command 1:<\/strong> Creates a storage account with a random unique name ( <code>stlab7xxxxx<\/code>) and attaches <code>--tags<\/code> <code>Course=E0416B<\/code> so it passes Policy #2! Wait ~25 seconds for it to finish.<\/p>\n<p class=\"li\">• <strong>Command 2:<\/strong> Attaches a <code>CanNotDelete<\/code> lock named <code>lock-nodelete<\/code> to the entire resource group <code>rg-lab7-ROLLNO<\/code>.<\/p>\n<p class=\"li\">• <strong>Command 3:<\/strong> Attempts to delete <code>rg-lab7-ROLLNO<\/code>. Because of the lock, Azure immediately rejects it with a red error message: <code>(ScopeLocked)<\/code> <code>The<\/code> <code>scope<\/code> <code>&#x27;/subscriptions/.../resourceGroups/rg-lab7-ROLLNO&#x27;<\/code> <code>cannot<\/code> <code>perform<\/code> <code>delete<\/code> <code>operation<\/code><\/p>\n<p class=\"li\">• <code>because<\/code> <code>following<\/code> <code>scope(s)<\/code> <code>are<\/code> <code>locked...<\/code> <code>Please<\/code> <code>remove<\/code> <code>the<\/code> <code>lock<\/code> <code>and<\/code> <code>try<\/code> <code>again.<\/code><\/p>\n<p class=\"li\">• <strong>Command 4:<\/strong> Displays a clean table listing <code>lock-nodelete<\/code> with level <code>CanNotDelete<\/code>.<\/p>\n<h3>Take Screenshot #3 of your Cloud Shell terminal showing the <code>ScopeLocked<\/code> error and the <code>az<\/code> <code>lock<\/code> <code>list<\/code> table!<\/h3>\n<h2>Step 2: Inspect Locks &amp; Test a ReadOnly Lock in the Azure Portal<\/h2>\n<p>1. Minimize Cloud Shell and navigate to <strong>Resource groups<\/strong> → click <strong>rg-lab7-ROLLNO<\/strong>.<\/p>\n<p>2. In the left vertical menu of <code>rg-lab7-ROLLNO<\/code>, scroll down to the <strong>Settings<\/strong> section and click <strong>Locks<\/strong>. Notice that <code>lock-nodelete<\/code> (Type: <em>Delete<\/em>) is listed here—and notice the <strong>Delete<\/strong> button on the resource group Overview will also fail if clicked!<\/p>\n<p>3. Now click <strong>Overview<\/strong> on <code>rg-lab7-ROLLNO<\/code> and open your storage account ( <code>stlab7xxxxx<\/code>).<\/p>\n<p>4. In the left vertical menu of the <strong>storage account<\/strong>, scroll down to <strong>Settings<\/strong> and click <strong>Locks<\/strong>. (Notice you already see <code>lock-nodelete<\/code> inherited from the parent resource group!)<\/p>\n<p>5. Click <strong>+ Add<\/strong> at the top-left of the storage account’s Locks page: <strong>Lock name:<\/strong> Type <code>lock-readonly<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Lock type:<\/strong> Select <strong>Read-only<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Notes:<\/strong> Type <code>Lab<\/code> <code>7<\/code> <code>read-only<\/code> <code>test<\/code>.<\/p>\n<p class=\"li sub\">• Click <strong>OK<\/strong>.<\/p>\n<p>6. <strong>Observe what actions are blocked by a <\/strong><code>Read-only<\/code><strong> lock:<\/strong> <strong>Try modifying Tags:<\/strong> Click <strong>Tags<\/strong> in the storage account’s left menu, try adding a new tag (e.g., <code>Test=1<\/code>), and click <strong>Apply<\/strong> → blocked with <code>ScopeLocked<\/code> !<\/p>\n<p class=\"li sub\">• <strong>Try viewing Access Keys or Containers:<\/strong> Click <strong>Security + networking → Access keys<\/strong> (or <strong>Data storage → Containers<\/strong>). Surprisingly, Azure even blocks listing storage access keys and creating containers because Azure implements those operations as HTTP <code>POST<\/code> write-style actions!<\/p>\n<p class=\"li sub\">• <strong>Try deleting the storage account:<\/strong> Also blocked with <code>ScopeLocked<\/code>.<\/p>\n<hr class=\"pg\">\n<p>7. Record the blocked actions in Section 4 below, then <strong>immediately delete <\/strong><code>lock-readonly<\/code> right now so you don’t forget during Clean-up: go back to the storage account → <strong>Settings → Locks<\/strong> → click <strong>Delete<\/strong> on the right side of the <code>lock-readonly<\/code> row.<\/p>\n<h2>4. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Effect Used by Policy #1 &amp; Policy<\/strong> <strong>#2<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Exact Error Code When Creating<\/strong> <code>Standard_D4s_v3<\/code><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Policy Compliance State<\/strong> <strong>Observed<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Actions Blocked by <\/strong><code>ReadOnly<\/code> <strong>Lock<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>5. Verification &amp; Screenshot Checklist<\/h2>\n<p>Capture and paste these three screenshots (with date and CLI commands used) into your lab journal before running Clean-up:<\/p>\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Policy denial message<\/td><td>Create VM Validation screen showing red <em>Validation failed<\/em> and the error details displaying <code>RequestDisallowedByPolicy<\/code> for <code>Standard_D4s_v3<\/code>.<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>Compliance dashboard<\/td><td>Azure Portal → <strong>Policy → Compliance<\/strong> showing both policy assignments scoped to <code>rg-lab7-ROLLNO<\/code> and their compliance states.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td><code>ScopeLocked<\/code> error<\/td><td>Cloud Shell terminal showing <code>az<\/code> <code>group<\/code> <code>delete<\/code> <code>--name<\/code> <code>rg-lab7-ROLLNO<\/code> <code>--yes<\/code> failing with <code>(ScopeLocked)<\/code> alongside <code>az<\/code> <code>lock<\/code> <code>list<\/code> (plus optional Portal screenshot of <code>ReadOnly<\/code> lock blocking a tag update).<\/td><\/tr>\n<\/tbody><\/table>\n<h2>6. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these structured, exam-ready answers for your lab journal and viva preparation:<\/p>\n<hr class=\"pg\">\n<h2>Question 1: Distinguish an Azure Policy from RBAC. Which one answers the question “what can this user do”?<\/h2>\n<table>\n<thead>\n<tr><th>Aspect<\/th><th>Azure RBAC (Role-Based Access Control)<\/th><th>Azure Policy<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Core Focus<\/strong><\/td><td>Focuses on <strong>user/identity actions<\/strong> (who is allowed to perform operations at a given scope).<\/td><td>Focuses on <strong>resource properties &amp;<\/strong> <strong>compliance<\/strong> during deployment and on existing resources.<\/td><\/tr>\n<tr><td><strong>Question<\/strong> <strong>Answered<\/strong><\/td><td><strong>“What can this user do?”<\/strong><\/td><td><em>“Does this resource comply with our<\/em> <em>organizational rules and standards?”<\/em><\/td><\/tr>\n<tr><td><strong>How It Works<\/strong><\/td><td>Grants permissions through roles like <code>Reader<\/code>, <code>Contributor<\/code>, and <code>Owner<\/code>.<\/td><td>Evaluates rules using effects like <code>Deny<\/code>, <code>Audit<\/code>, <code>Modify<\/code>, or <code>DeployIfNotExists<\/code> —applies even to Owners!<\/td><\/tr>\n<tr><td><strong>Lab Example<\/strong><\/td><td>Allowing <code>labuser1<\/code> to create VMs as a <code>Contributor<\/code> (Lab 6).<\/td><td>Blocking even an Owner from creating a <code>Standard_D4s_v3<\/code> VM or deploying without tag <code>Course=E0416B<\/code> (Lab 7).<\/td><\/tr>\n<\/tbody><\/table>\n<p><strong>Direct Answer:<\/strong> <strong>Azure RBAC<\/strong> answers the question <em>“What can this user do?”<\/em><\/p>\n<h2>Question 2: What is a policy initiative and when would you use one?<\/h2>\n<div class=\"callout tip\"><p>A <strong>Policy Initiative<\/strong> (also called a <em>Policy Set Definition<\/em>) is a <strong>grouped collection of multiple<\/strong> <strong>individual Azure Policy definitions<\/strong> combined together toward a single overarching governance or compliance goal. Instead of assigning and tracking 20 or 100 policies one by one, you assign one single initiative at a Management Group, Subscription, or Resource Group scope. <strong>When to use one:<\/strong> You use a policy initiative whenever you need to enforce a multi-rule standard or regulatory compliance framework as a single unified package—for example, grouping VM size limits, required billing tags, allowed regions, and storage encryption into a single <em>“CFIS Lab<\/em> <em>Governance”<\/em> initiative, or applying built-in regulatory initiatives like <strong>ISO 27001<\/strong>, <strong>NIST SP 800-53<\/strong>, <strong>PCI-DSS<\/strong>, or the <strong>Microsoft Cloud Security Benchmark<\/strong> to monitor overall compliance percentage on one dashboard.<\/p><\/div>\n<h2>Question 3: Compare the CanNotDelete and ReadOnly lock types.<\/h2>\n<table>\n<thead>\n<tr><th>Action / Aspect<\/th><th><code>CanNotDelete<\/code> (Delete Lock)<\/th><th><code>ReadOnly<\/code> (Read-only Lock)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Read / View Resource<\/strong><\/td><td><strong>Allowed<\/strong><\/td><td><strong>Allowed<\/strong> (strictly GET read operations only)<\/td><\/tr>\n<tr><td><strong>Modify / Update<\/strong> <strong>Resource<\/strong><\/td><td><strong>Allowed<\/strong> (e.g., edit tags, resize VM, upload blobs)<\/td><td><strong>Blocked!<\/strong> (Prevents changes to tags, settings, and even some POST read actions like listing storage keys)<\/td><\/tr>\n<tr><td><strong>Delete Resource<\/strong><\/td><td><strong>Blocked!<\/strong> (Returns <code>ScopeLocked<\/code>)<\/td><td><strong>Blocked!<\/strong> (Returns <code>ScopeLocked<\/code>)<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Action / Aspect<\/th><th><code>CanNotDelete<\/code> (Delete Lock)<\/th><th><code>ReadOnly<\/code> (Read-only Lock)<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Best Use Case<\/strong><\/td><td>Production VMs, databases, and VNets that still need routine updates/patching but must never be deleted accidentally.<\/td><td>Immutable forensic evidence archives, finalized compliance configurations, or critical master templates that must never be altered.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 4: Can a user with the Owner role delete a locked resource? Explain.<\/h2>\n<div class=\"callout tip\"><p><strong>No — not directly while the lock is in place.<\/strong> Resource locks override every user’s RBAC permissions, including an <strong>Owner<\/strong> or <strong>Contributor<\/strong>. If an Owner runs a delete command on a locked resource or resource group, Azure blocks the operation and returns a <code>ScopeLocked<\/code> error. This prevents accidental human mistakes even by top administrators. <strong>How an Owner proceeds intentionally:<\/strong> Only users who hold the <strong>Owner<\/strong> or <strong>User Access<\/strong> <strong>Administrator<\/strong> role (which include <code>Microsoft.Authorization/locks/*<\/code> permissions) have permission to <strong>explicitly delete the lock first<\/strong>, and <em>only after removing the lock<\/em> can they delete the underlying resource. (A regular <code>Contributor<\/code> cannot even remove locks!)<\/p><\/div>\n<h2>7. Clean-up (Mandatory — 3 Important Steps!)<\/h2>\n<p>Do <strong>not<\/strong> skip Step 3 below—leaving Policy assignments active can cause confusing errors in future labs!<\/p>\n<h2>Step 1: Delete the Locks<\/h2>\n<p>First ensure you deleted <code>lock-readonly<\/code> on the storage account in the Portal (from Part B, Step 2). Then open <strong>Cloud Shell (Bash)<\/strong> and delete <code>lock-nodelete<\/code>:<\/p>\n<pre class=\"code\"><code>az lock delete --name lock-nodelete --resource-group rg-lab7-ROLLNO<\/code><\/pre>\n<h2>Step 2: Delete the Resource Group<\/h2>\n<pre class=\"code\"><code>az group delete --name rg-lab7-ROLLNO --yes --no-wait<\/code><\/pre>\n<h2>Step 3: Remove Both Policy Assignments in the Portal<\/h2>\n<p>1. In the top-center Global Search Bar, search for <strong>Policy<\/strong> and open it.<\/p>\n<p>2. In the left vertical menu of Azure Policy (under <strong>Authoring<\/strong>), click <strong>Assignments<\/strong>.<\/p>\n<p>3. Locate your two assignments scoped to <code>rg-lab7-ROLLNO<\/code>: <em>Allowed virtual machine size SKUs<\/em><\/p>\n<p class=\"li sub\">• <em>Require a tag and its value on resources<\/em><\/p>\n<p>4. For each assignment, click the <strong>...<\/strong> (three dots) on the far right of its row → click <strong>Delete<\/strong> <strong>assignment<\/strong> → click <strong>Yes<\/strong>.<\/p>\n<hr class=\"pg\">\n<h2>8. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Creating <code>Standard_D4s_v3<\/code> says <em>Validation passed<\/em> instead of failing<\/td><td>Azure Policy takes 5–30 minutes to propagate. <strong>Do NOT click Create!<\/strong> Double-check that your assignment Scope is <code>rg-lab7-ROLLNO<\/code> and Enforcement is <em>Enabled<\/em>, wait 5 more minutes, and retry Validation.<\/td><\/tr>\n<tr><td>Part B storage account creation fails with <code>RequestDisallowedByPolicy<\/code><\/td><td>You left out <code>--tags<\/code> <code>Course=E0416B<\/code> (or misspelled <code>Course<\/code> / <code>E0416B<\/code> —tag names and values are case-sensitive in Azure Policy!). Re-run Command 1 with exact capitalization.<\/td><\/tr>\n<tr><td>Clean-up <code>az<\/code> <code>group<\/code> <code>delete<\/code> STILL fails with <code>ScopeLocked<\/code><\/td><td>You left <code>lock-readonly<\/code> attached to your storage account inside <code>rg-lab7-ROLLNO<\/code> ! Run <code>az<\/code> <code>lock<\/code> <code>list<\/code> <code>--resource-group<\/code> <code>rg-lab7-ROLLNO<\/code> <code>--output<\/code> <code>table<\/code> to see any remaining lock, delete it, then re-run <code>az<\/code> <code>group<\/code> <code>delete<\/code>.<\/td><\/tr>\n<tr><td>Policy Compliance dashboard shows <em>Not started<\/em><\/td><td>Initial compliance scans take 15–30 minutes after creating an assignment. You can trigger an immediate on-demand scan in Cloud Shell by running: <code>az<\/code> <code>policy<\/code> <code>state<\/code> <code>trigger-scan<\/code> <code>--resource-group<\/code> <code>rg-lab7-ROLLNO<\/code>.<\/td><\/tr>\n<\/tbody><\/table>", "8": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 8: Cost Management, Pricing and TCO Calculators, SLAs<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO5  |  <strong>Theory Alignment:<\/strong> Unit 4  |  <strong>Estimated Time:<\/strong> 2 Hours<\/p>\n<p><strong>Aim:<\/strong> Estimate and control cloud cost using the Pricing Calculator, TCO Calculator, Cost Management, budgets, alerts and tags, and calculate composite SLAs.<\/p>\n<p><strong>Prerequisites:<\/strong> Labs 1 and 2 completed (tagged resources from earlier labs make Cost Analysis grouping much easier to see, though you can still complete all steps even if earlier labs were already cleaned up).<\/p>\n<pre class=\"code\"><code>Before You Start: 4 Essential Beginner Tips for Lab 8\nParts A &amp; B cost $0 and require no Azure credits: Both the Azure Pricing Calculator and\nTCO Calculator are free public web tools—you do not even need to sign in to build and\nexport estimates.\nKeep currency consistent: At the bottom-left of the Pricing Calculator page, check the\nCurrency dropdown (default is US Dollar ($) , or you can switch to Indian Rupee (₹) ).\nUse the same currency across all comparisons.\nAzure for Students note for Part C: If you use an Azure for Students subscription,\nMicrosoft tracks your $100 credit in the Sponsorship portal, so standard Cost Analysis inside\nthe Azure Portal may display a sponsorship notice. Follow the exact Portal steps in Part C\nfirst—and if Cost Analysis shows a sponsorship redirect, capture that screen and check your\nSponsorship credit breakdown alongside creating your budget.\nClean-up is completely risk-free: Deleting budget-lab8 at the end simply removes the\nemail notification rule—it never deletes any cloud resources.<\/code><\/pre>\n<h2>1. Plain-English Overview: Cloud Financial Governance &amp; Reliability<\/h2>\n<p>In cloud computing, you pay only for what you configure and run. Lab 8 teaches you how to predict costs <em>before<\/em> deploying, track spending <em>while<\/em> running, and calculate application uptime guarantees:<\/p>\n<table>\n<thead>\n<tr><th>Lab Part &amp; Tool<\/th><th>Plain-English Purpose<\/th><th>What You Do in Lab 8<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part A: Pricing<\/strong> <strong>Calculator<\/strong><\/td><td>An online shopping cart for Azure services that estimates your <strong>monthly<\/strong> <strong>bill<\/strong> before you create anything.<\/td><td>Price a 5-component web solution, compare <em>Central India<\/em> vs. <em>East US<\/em>, compare <em>Pay-as-you-go<\/em> vs. <em>Reserved<\/em> &amp; <em>Spot<\/em>, and export Excel files.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Lab Part &amp; Tool<\/th><th>Plain-English Purpose<\/th><th>What You Do in Lab 8<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part B: TCO Calculator<\/strong><\/td><td>Compares the 3-to-5-year cost of running your own physical server room vs. migrating to Azure.<\/td><td>Model 10 on-premises servers (8 cores, 32 GB RAM) + 5 TB storage and inspect savings in hardware, electricity, IT labor, and space.<\/td><\/tr>\n<tr><td><strong>Part C: Cost<\/strong> <strong>Management &amp;<\/strong> <strong>Advisor<\/strong><\/td><td>Tracks actual spending by tag/group, sends budget warning emails, and flags idle resources.<\/td><td>Group costs by Resource Group, Tag ( <code>Course<\/code>), and Service; create <code>budget-lab8<\/code> (80% Actual / 100% Forecasted alerts); check Advisor Cost tips.<\/td><\/tr>\n<tr><td><strong>Part D: Composite<\/strong> <strong>SLA<\/strong><\/td><td>Calculates combined uptime percentage and allowed monthly downtime when multiple services depend on each other.<\/td><td>Multiply App Service ( <code>99.95%<\/code>) × Azure SQL ( <code>99.99%<\/code>) × a third service ( <code>99.9%<\/code>) and convert to allowed minutes of downtime.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Azure Pricing Calculator (Browser Walkthrough)<\/h2>\n<h2>Step 1: Open the Calculator &amp; Build the 5-Item Web Solution Estimate<\/h2>\n<p>1. Open a new browser tab, search Google/Bing for <code>Azure<\/code> <code>Pricing<\/code> <code>Calculator<\/code>, and open the official Microsoft page ( <code>azure.microsoft.com/pricing/calculator<\/code>).<\/p>\n<p>2. Click <strong>Clear estimate<\/strong> (if any sample items are already loaded at the bottom) so you start with a clean $0 estimate.<\/p>\n<p>3. Add and configure each of the <strong>five required components<\/strong> using the search box under <em>Products<\/em>:<\/p>\n<table>\n<thead>\n<tr><th>Component<\/th><th>How to Add &amp; Configure in Calculator<\/th><th>Key Settings to Verify<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1. Windows VM<\/strong> <strong>(<\/strong> <code>Standard_B2s<\/code><strong> )<\/strong><\/td><td>Click <strong>Virtual Machines<\/strong> in Products → scroll down to its card.<\/td><td>Region: <strong>Central India<\/strong> | OS: <strong>Windows<\/strong> | Type: <strong>OS only<\/strong> | Tier: <strong>Standard<\/strong> | Instance: <strong>B2s<\/strong> (2 vCPUs, 4 GiB RAM) | VMs: <code>1<\/code> × <code>730<\/code> hrs | Savings: <strong>Pay-as-you-<\/strong><strong>go<\/strong>.<\/td><\/tr>\n<tr><td><strong>2. Managed Disk<\/strong><\/td><td>Inside the same VM card, expand <strong>Managed<\/strong> <strong>Disks<\/strong> (or search and add <em>Storage Accounts →<\/em> <em>Managed Disks<\/em> separately).<\/td><td>Tier: <strong>Standard SSD<\/strong> (or Standard HDD) | Disk size: <strong>E10 (128 GiB)<\/strong> (or S10) | Number of disks: <code>1<\/code>.<\/td><\/tr>\n<tr><td><strong>3. Storage Account<\/strong> <strong>(100 GB, LRS, Hot)<\/strong><\/td><td>Search <code>Storage<\/code> <code>Accounts<\/code> in Products → click to add its card below.<\/td><td>Region: <strong>Central India<\/strong> | Type: <strong>Block Blob Storage<\/strong> (or General Purpose v2) | Redundancy: <strong>LRS<\/strong> | Access Tier: <strong>Hot<\/strong> | Capacity: <code>100<\/code> GB.<\/td><\/tr>\n<tr><td><strong>4. App Service Plan<\/strong> <strong>(Basic B1)<\/strong><\/td><td>Search <code>App<\/code> <code>Service<\/code> in Products → click to add its card below.<\/td><td>Region: <strong>Central India<\/strong> | OS: <strong>Windows<\/strong> (or Linux) | Tier: <strong>Basic<\/strong> | Instance: <strong>B1<\/strong> (1 Core, 1.75 GB RAM) | Instances: <code>1<\/code> × <code>730<\/code> hrs.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Component<\/th><th>How to Add &amp; Configure in Calculator<\/th><th>Key Settings to Verify<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>5. Outbound Data<\/strong> <strong>Transfer (50 GB)<\/strong><\/td><td>Search <code>Bandwidth<\/code> in Products → click to add its card below.<\/td><td>Source Region: <strong>Central India<\/strong> | Data transfer type: <strong>Internet<\/strong> <strong>egress<\/strong> | Outbound Data Transfer: <code>50<\/code> GB <em>(note: first 100<\/em> <em>GB/month is free = $0.00!)<\/em>.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Step 2: Record Central India Total, Switch to East US &amp; Export<\/h2>\n<p>1. Scroll to the bottom of the Pricing Calculator page and note the <strong>Estimated monthly cost<\/strong> for <strong>Central India<\/strong>. Write it into your Lab Record Table (Section 5).<\/p>\n<p>2. Click the <strong>Export<\/strong> button at the bottom of the page to download an Excel spreadsheet ( <code>ExportedEstimate.xlsx<\/code>). Rename this downloaded file to <code>Estimate_CentralIndia.xlsx<\/code> so you can attach it to your lab journal.<\/p>\n<p>3. Now scroll back up through each item card and change the <strong>Region<\/strong> dropdown from <strong>Central India<\/strong> to <strong>East US<\/strong>.<\/p>\n<p>4. Scroll down to the bottom and record the new <strong>East US<\/strong> monthly total in Section 5. Notice that <strong>East<\/strong> <strong>US is slightly lower<\/strong> than Central India because US flagship regions have massive scale and lower local power/infrastructure costs.<\/p>\n<p>5. Change the regions back to <strong>Central India<\/strong> before doing Step 3.<\/p>\n<h2>Step 3: Compare VM Billing Options (Pay-as-you-go vs. 1-Year Reserved vs. Spot)<\/h2>\n<p>1. Scroll to your <strong>Windows Virtual Machine (<\/strong> <code>B2s<\/code><strong> )<\/strong> card and look at the <strong>Savings options<\/strong> (billing) section on the right side of the VM card: <strong>Baseline — Pay-as-you-go:<\/strong> Note the VM’s standalone monthly price (e.g., ~$30–$36/month depending on OS license inclusion).<\/p>\n<p class=\"li sub\">• <strong>1-year reserved:<\/strong> Click the <strong>1 year reserved<\/strong> radio button. Record the new monthly VM price and calculate the percentage/dollar saving (typically <strong>~30% to 41% cheaper<\/strong> than Pay-as-you-go in exchange for a 1-year commitment).<\/p>\n<p class=\"li sub\">• <strong>Spot (where offered):<\/strong> Click the <strong>Azure Spot<\/strong> radio button (if offered for <code>B2s<\/code> in that region; if grayed out for <code>B2s<\/code>, temporarily check East US or a D-series SKU to observe Spot pricing). Spot uses spare Azure capacity at massive discounts (often <strong>~60% to 80% cheaper<\/strong>), with the trade-off that Azure can evict (stop) the VM whenever capacity is needed elsewhere.<\/p>\n<p>2. Set the VM back to <strong>1 year reserved<\/strong>, click <strong>Export<\/strong> at the bottom of the page, and save that second spreadsheet as <code>Estimate_Reserved_Comparison.xlsx<\/code> for your Verification submission!<\/p>\n<hr class=\"pg\">\n<h2>3. Part B: Azure TCO (Total Cost of Ownership) Calculator<\/h2>\n<p>1. Open a new browser tab, search for <code>Azure<\/code> <code>TCO<\/code> <code>Calculator<\/code>, and open Microsoft’s Total Cost of Ownership Calculator ( <code>azure.microsoft.com/pricing/tco/calculator<\/code>).<\/p>\n<p>2. <strong>Step 1 of Wizard — Define your workloads:<\/strong> Under <strong>Servers<\/strong>, click <strong>+ Add server workload<\/strong> and enter: Workload = <em>General<\/em> | Environment = <em>Virtual Machines<\/em> (or Physical Servers) | OS = <em>Windows<\/em> | VMs/Servers = <code>10<\/code> | Virtualization = <em>Hyper-V<\/em> (or VMware) | Cores = <code>8<\/code> | RAM (GB) = <code>32<\/code>.<\/p>\n<p class=\"li sub\">• Under <strong>Storage<\/strong>, click <strong>+ Add storage<\/strong> and enter: Storage type = <em>Local Disk/SAN<\/em> | Disk type = <em>HDD<\/em> | Capacity = <code>5<\/code> <strong>TB<\/strong> (verify the unit dropdown says <code>TB<\/code>, or enter <code>5000<\/code> if set to <code>GB<\/code>).<\/p>\n<p class=\"li sub\">• Click the blue <strong>Next<\/strong> button at the bottom.<\/p>\n<p>3. <strong>Step 2 of Wizard — Adjust assumptions:<\/strong> Review the default industry assumptions for electricity cost per kWh, storage maintenance, and IT labor hourly rates, then click <strong>Next<\/strong>.<\/p>\n<p>4. <strong>Step 3 of Wizard — View report:<\/strong> At the top of the report, set <strong>Timeframe<\/strong> to <strong>3 Years<\/strong> and <strong>Region<\/strong> to <strong>Central India<\/strong> (or East US).<\/p>\n<p class=\"li sub\">• Examine the big comparison chart showing <strong>Estimated On-Premises Cost<\/strong> vs. <strong>Estimated<\/strong> <strong>Azure Cost<\/strong> and the <strong>Total 3-Year Savings<\/strong>.<\/p>\n<p class=\"li sub\">• Scroll down to the <strong>Cost Breakdown<\/strong> table and note which on-premises categories drop to <strong>$0<\/strong> <strong>in Azure<\/strong>: <strong>Compute/Server Hardware<\/strong> (buying/replacing physical servers), <strong>Electricity (Power<\/strong> <strong>&amp; Cooling)<\/strong>, and <strong>Datacenter Space / Facilities<\/strong> (rack floor space), alongside major reductions in <strong>IT Labor<\/strong> (hardware maintenance/patching) and <strong>Networking<\/strong>!<\/p>\n<p class=\"li sub\">• Click <strong>Download<\/strong> (or Print to PDF / take a screenshot) at the top-right of the report to save your <strong>TCO Summary<\/strong> for your lab journal.<\/p>\n<h2>4. Part C: Cost Management, Budgets, Alerts &amp; Advisor (Azure Portal)<\/h2>\n<h2>Step 1: Analyze Costs in Cost Analysis (Group by Resource Group, Tag &amp; Service)<\/h2>\n<p>1. Sign in at <code>portal.azure.com<\/code>.<\/p>\n<p>2. Click the top-center Global Search Bar, type <code>Cost<\/code> <code>Management<\/code> <code>+<\/code> <code>Billing<\/code>, and click <strong>Cost<\/strong> <strong>Management + Billing<\/strong> under Services.<\/p>\n<p>3. In the left vertical menu, click <strong>Cost Management<\/strong> (or expand the <strong>Cost Management<\/strong> section in the left sidebar and click <strong>Cost analysis<\/strong>).<\/p>\n<p>4. Once the Cost Analysis chart loads, look at the filter/grouping toolbar directly above the chart and find the <strong>Group by<\/strong> dropdown: Click <strong>Group by<\/strong> → select <strong>Resource group<\/strong> (shows which lab folders consumed credits).<\/p>\n<p class=\"li sub\">• Click <strong>Group by<\/strong> → select <strong>Tag<\/strong> → choose <strong>Course<\/strong> (shows spending grouped by your <code>Course=E0416B<\/code> tag!). <strong>Take Screenshot #1 right here showing Cost analysis grouped by<\/strong><\/p>\n<h3>Tag!<\/h3>\n<p class=\"li sub\">• Click <strong>Group by<\/strong> → select <strong>Service name<\/strong> (shows spending split across Virtual Machines, Storage, Bandwidth, etc.).<\/p>\n<hr class=\"pg\">\n<div class=\"callout tip\"><p><strong>If you use an Azure for Students account:<\/strong> Azure for Students uses a Sponsorship offer where detailed Cost Analysis may show a banner redirecting to <code>microsoftazuresponsorships.com<\/code>. If that occurs, open the Sponsorship portal to view your service-by-service credit usage and capture a screenshot of both screens for your journal.<\/p><\/div>\n<h2>Step 2 &amp; Step 3: Create Budget budget-lab8 with 80% Actual &amp; 100% Forecasted Alerts<\/h2>\n<p>1. In the left vertical menu under <strong>Cost Management<\/strong>, click <strong>Budgets<\/strong>.<\/p>\n<p>2. Click the <strong>+ Add<\/strong> button at the top-left toolbar.<\/p>\n<p>3. On the <strong>Create a budget<\/strong> screen, fill in the details: <strong>Scope:<\/strong> Verify your active Subscription is shown at the top.<\/p>\n<p class=\"li sub\">• <strong>Name:<\/strong> Type <code>budget-lab8<\/code>.<\/p>\n<p class=\"li sub\">• <strong>Reset period:<\/strong> Select <strong>Monthly<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Creation date &amp; Expiration date:<\/strong> Leave the default start date (1st of current month) and expiration date (1–2 years ahead).<\/p>\n<p class=\"li sub\">• <strong>Budget amount:<\/strong> Enter a realistic monthly cap for your student/free account (for example, <code>20<\/code> if your account is in USD, or <code>1000<\/code> if in INR).<\/p>\n<p>4. Click the blue <strong>Next<\/strong> button at the bottom-left to open the <strong>Set alerts<\/strong> screen.<\/p>\n<p>5. Under <strong>Alert conditions<\/strong>, enter the two exact rows required by your manual: <strong>Row 1:<\/strong> Type = <strong>Actual<\/strong> | <code>%<\/code> <code>of<\/code> <code>budget<\/code> = <code>80<\/code> <em>(Azure automatically calculates the dollar/rupee<\/em> <em>threshold)<\/em>.<\/p>\n<p class=\"li sub\">• <strong>Row 2:<\/strong> Type = <strong>Forecasted<\/strong> | <code>%<\/code> <code>of<\/code> <code>budget<\/code> = <code>100<\/code>.<\/p>\n<p>6. Scroll down to <strong>Alert recipients (email)<\/strong>, type your personal/college email address, and press <strong>Enter<\/strong> (or Tab) so it locks into the box.<\/p>\n<p>7. <strong>Take Screenshot #2 right now showing the budget alert conditions (80% Actual &amp; 100%<\/strong> <strong>Forecasted) and your email recipient!<\/strong> Then click the blue <strong>Create<\/strong> button.<\/p>\n<h2>Step 4: Review Cost Recommendations in Azure Advisor<\/h2>\n<p>1. Click the top-center Global Search Bar, type <code>Advisor<\/code>, and click <strong>Advisor<\/strong> under Services.<\/p>\n<p>2. In the left vertical menu of Azure Advisor (or by clicking the <strong>Cost<\/strong> summary card on the Overview page), click <strong>Cost<\/strong>.<\/p>\n<p>3. Review any active recommendations (such as <em>Right-size or shut down underutilized virtual<\/em> <em>machines<\/em>, <em>Delete unattached disks<\/em>, or <em>Consider Reserved Instances<\/em>). If all previous lab VMs were properly cleaned up, Advisor will display <em>“No recommendations”<\/em> (confirming good cost hygiene!). Record what you see in Section 5.<\/p>\n<h2>5. Part D: Composite SLA &amp; Allowed Downtime Calculation<\/h2>\n<p>When multiple cloud services work together in series so that <em>all<\/em> of them must stay up for your web application to work, you multiply their individual availability percentages (expressed as decimals) to find the <strong>Composite SLA<\/strong>:<\/p>\n<hr class=\"pg\">\n<pre class=\"code\"><code>Given Individual Service SLAs:\nService 1 — Azure App Service: 99.95% = 0.9995\nService 2 — Azure SQL Database: 99.99% = 0.9999\nService 3 — Third Dependent Service: 99.9% = 0.999\nStep 1 — Calculate the 3-Service Composite SLA:\nComposite SLA = 0.9995 × 0.9999 × 0.999\nComposite SLA = 0.99940005 × 0.999 = 0.99840065 → 99.84% (exact: 99.8401% )\nStep 2 — Calculate Allowed Monthly Downtime:\nUnavailability fraction = 1 − 0.99840065 = 0.00159935 (or 0.1599% downtime)\nUsing a standard 30-day month ( 30 × 24 × 60 = 43,200 minutes ):\nAllowed Downtime = 43,200 × 0.00159935 = 69.09 minutes → ~69.1 minutes (1 hour 9\nminutes) per month.\nUsing an average 30.44-day month ( 365 ÷ 12 × 24 × 60 = 43,830 minutes ):\nAllowed Downtime = 43,830 × 0.00159935 = 70.10 minutes → ~70.1 minutes (1 hour\n10 minutes) per month.<\/code><\/pre>\n<h2>6. Lab Record Table (Fill During Practical)<\/h2>\n<table>\n<thead>\n<tr><th>Lab Item to Record<\/th><th>Your Recorded Value / Observation<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Pricing Calculator: Central India<\/strong> <strong>Monthly Total<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Pricing Calculator: East US Monthly<\/strong> <strong>Total &amp; Difference<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>VM Savings: 1-Year Reserved vs. Spot<\/strong> <strong>Pricing<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>TCO Calculator: 3-Year On-Premises<\/strong> <strong>vs. Azure Cost<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<tr><td><strong>Advisor → Cost Recommendation<\/strong> <strong>Observed<\/strong><\/td><td>&nbsp;<\/td><\/tr>\n<\/tbody><\/table>\n<h2>7. Verification &amp; Screenshot Checklist<\/h2>\n<p>Attach these exported files and screenshots (with date) to your lab journal before running Clean-up:<\/p>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>No.<\/th><th>Manual Verification Requirement<\/th><th>Exact File / Screenshot to Capture<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>1<\/strong><\/td><td>Exported Pricing Calculator estimates<\/td><td>Both downloaded Excel/PDF exports: <code>Estimate_CentralIndia.xlsx<\/code> (region comparison) and <code>Estimate_Reserved_Comparison.xlsx<\/code> (reserved comparison).<\/td><\/tr>\n<tr><td><strong>2<\/strong><\/td><td>TCO Calculator summary<\/td><td>Downloaded PDF or full-page screenshot of the 3-year TCO comparison report showing reduced hardware, electricity, IT labor, and datacenter space costs.<\/td><\/tr>\n<tr><td><strong>3<\/strong><\/td><td>Cost analysis grouped by tag<\/td><td>Azure Portal → <strong>Cost Management → Cost analysis<\/strong> grouped by Tag ( <code>Course<\/code>) (or Sponsorship usage breakdown if on Student offer).<\/td><\/tr>\n<tr><td><strong>4<\/strong><\/td><td>Budget with alert conditions<\/td><td>Azure Portal → <strong>Cost Management → Budgets<\/strong> showing <code>budget-lab8<\/code> with <strong>80% Actual<\/strong> and <strong>100% Forecasted<\/strong> email alerts configured.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>8. Observation Questions &amp; Complete Answers<\/h2>\n<p>Use these structured, exam-ready answers for your lab journal and viva preparation:<\/p>\n<h2>Question 1: List four factors that affect the cost of Azure resources.<\/h2>\n<div class=\"callout tip\"><p>1. <strong>Resource Type &amp; Tier / SKU Size:<\/strong> Choosing higher compute capacity (e.g., <code>Standard_D4s_v3<\/code> vs. <code>Standard_B1s<\/code>), premium SSD storage over standard HDD, or higher App Service tiers ( <code>S1<\/code> vs. <code>B1<\/code>) directly increases hourly/monthly rates.<\/p><p>2. <strong>Usage Meter &amp; Duration:<\/strong> How long a resource runs (billed per second/hour for VMs) and how much capacity or transactions it consumes (GB stored, function executions, or operations).<\/p><p>3. <strong>Azure Region (Location):<\/strong> Infrastructure, power, tax, and real estate costs differ by geography —for example, deploying in <em>East US<\/em> costs slightly less than <em>Central India<\/em> for the same SKU.<\/p><p>4. <strong>Bandwidth (Outbound Data Transfer / Egress):<\/strong> Inbound traffic (ingress) into Azure datacenters is free, whereas outbound data leaving Azure datacenters over the internet (beyond the monthly free tier) or across regions incurs per-GB egress charges. <em>Additional factors (useful for Viva):<\/em> <strong>Billing/Purchasing Model<\/strong> (Pay-as-you-go vs. Reserved vs. Spot) and <strong>Storage Redundancy Level<\/strong> (LRS vs. ZRS vs. GRS/GZRS).<\/p><\/div>\n<h2>Question 2: Compare Pay-as-you-go, Reserved Instances and Spot pricing, with a suitable workload for each.<\/h2>\n<table>\n<thead>\n<tr><th>Pricing Model<\/th><th>How It Works &amp; Discount<\/th><th>Commitment / Risk<\/th><th>Suitable Workload<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Pay-as-you-go<\/strong> <strong>(PAYG)<\/strong><\/td><td>Pay standard list rate per second/hour with 0% upfront commitment; start or stop anytime.<\/td><td>No long-term commitment; highest unit price.<\/td><td>Short-term student labs, unpredictable traffic spikes, or new dev/test apps with unknown runtime.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Pricing Model<\/th><th>How It Works &amp; Discount<\/th><th>Commitment / Risk<\/th><th>Suitable Workload<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Reserved<\/strong> <strong>Instances (RIs)<\/strong><\/td><td>Commit to a specific VM family/region for <strong>1 year or 3<\/strong> <strong>years<\/strong> for up to <strong>~72% savings<\/strong>.<\/td><td>1- or 3-year financial commitment; guaranteed capacity.<\/td><td>Steady-state, 24×7 production workloads such as core databases, domain controllers, or always-on web servers.<\/td><\/tr>\n<tr><td><strong>Azure Spot VMs<\/strong><\/td><td>Purchase unused Azure datacenter capacity at steep discounts (up to <strong>~90% off<\/strong>).<\/td><td><strong>Can be evicted<\/strong> <strong>(interrupted)<\/strong> with 30 seconds notice whenever Azure needs capacity back.<\/td><td>Stateless, fault-tolerant batch jobs, video rendering, big-data analytics, or CI/CD build agents.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>Question 3: How do tags help with chargeback and billing?<\/h2>\n<div class=\"callout tip\"><p>Azure <strong>Tags<\/strong> are customizable <code>Name=Value<\/code> metadata pairs (such as <code>Course=E0416B<\/code>, <code>Dept=CFIS<\/code>, or <code>CostCenter=IT-101<\/code>) attached to resources and resource groups. In Azure Cost Management, every billing line item records the tags attached to that resource, enabling two key financial governance practices:<\/p><p class=\"li\">• <strong>Showback &amp; Chargeback:<\/strong> Finance and IT teams can filter, group, and export monthly spending by department, project, or cost center tag—allowing an organization to transparently report usage (<em>showback<\/em>) or accurately bill internal departments for the exact cloud resources they consumed (<em>chargeback<\/em>).<\/p><p class=\"li\">• <strong>Cross-Group Cost Visibility &amp; Budgets:<\/strong> Even when a single project’s VMs, storage accounts, and databases span multiple resource groups or subscriptions, filtering by a shared tag aggregates total project spend in one view and allows setting tag-scoped budgets and alerts.<\/p><\/div>\n<h2>Question 4: Does adding more dependent services increase or decrease the composite SLA? Why?<\/h2>\n<div class=\"callout tip\"><p>Adding more dependent services in series <strong>decreases<\/strong> the composite SLA. Mathematically, availability is represented as a probability strictly less than 1 (for example, <code>0.9995<\/code> and <code>0.9999<\/code>), and multiplying numbers less than 1 always yields a smaller product ( <code>0.9995<\/code> <code>×<\/code> <code>0.9999<\/code> <code>×<\/code> <code>0.999<\/code> <code>=<\/code> <code>0.9984<\/code>, or <code>99.84%<\/code>). Architecturally, when services are chained sequentially, <strong>each service<\/strong> <strong>becomes a potential single point of failure<\/strong>—if <em>any one<\/em> of the dependent services experiences an outage, the entire application fails, increasing total allowed downtime.<\/p><\/div>\n<h2>9. Clean-up (Mandatory Before Closing Portal)<\/h2>\n<p>1. <strong>Delete <\/strong><code>budget-lab8<\/code><strong> :<\/strong> In the Azure Portal, open <strong>Cost Management + Billing<\/strong> → <strong>Cost<\/strong> <strong>Management<\/strong> → <strong>Budgets<\/strong> → click the <code>...<\/code> menu (or open <code>budget-lab8<\/code> and click <strong>Delete<\/strong> <strong>budget<\/strong> at the top toolbar) → confirm <strong>Yes<\/strong>.<\/p>\n<p>2. <strong>Verify zero leftover resource groups from Labs 1–7:<\/strong> Open <strong>Cloud Shell (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right bar and run:<\/p>\n<pre class=\"code\"><code>az group list --output table<\/code><\/pre>\n<hr class=\"pg\">\n<p>If any old lab resource group ( <code>rg-lab1-...<\/code> through <code>rg-lab7-...<\/code>) still appears in that table, delete it right now with <code>az<\/code> <code>group<\/code> <code>delete<\/code> <code>--name<\/code> <code>RESOURCE_GROUP_NAME<\/code> <code>--yes<\/code> <code>--no-wait<\/code> so your remaining free credits are preserved for Lab 9 and your practical exam.<\/p>\n<h2>10. Beginner Troubleshooting Quick Reference<\/h2>\n<table>\n<thead>\n<tr><th>Common Beginner Issue<\/th><th>Why It Happens &amp; How to Fix It<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td>Cost Analysis says <em>“You do not<\/em> <em>have permission”<\/em> or redirects to Sponsorship<\/td><td>On <em>Azure for Students<\/em> accounts, subscription billing is managed through the Microsoft Azure Sponsorship portal ( <code>microsoftazuresponsorships.com<\/code>). Capture a screenshot of the Portal view and use the Sponsorship Balance/Usage page for your cost breakdown.<\/td><\/tr>\n<tr><td><code>Spot<\/code> radio button is grayed out on <code>Standard_B2s<\/code> in Pricing Calculator<\/td><td>Burstable B-series VMs do not support Spot pricing in all regions. Note that Spot is unavailable for <code>B2s<\/code> in Central India, or temporarily select a General Purpose SKU (like <code>D2s<\/code> <code>v3<\/code>) to record the Spot percentage saving.<\/td><\/tr>\n<tr><td>Budget <em>+ Add<\/em> button is disabled<\/td><td>Ensure your Scope at the top of the Budgets page is set to your active <strong>Subscription<\/strong> (not a Management Group or unsupported offer scope).<\/td><\/tr>\n<tr><td>Cost Analysis grouped by Tag shows <em>Untagged<\/em><\/td><td>Earlier lab resource groups were either already deleted during Clean-up or individual resources inside them lacked tags (remember Lab 1: resource group tags do not auto-copy to child resources).<\/td><\/tr>\n<\/tbody><\/table>", "9": "<p class=\"eyebrow\">COURSE CODE: E0416B • CLOUD COMPUTING LAB • MICROSOFT AZURE (AZ-900 ALIGNED)<\/p>\n<h1>Lab 9: Azure Monitor, Advisor, Cloud Shell and ARM Templates<\/h1>\n<p>Complete Beginner’s Step-by-Step Practical Guide &amp; Observation Solutions<\/p>\n<p><strong>Outcome:<\/strong> CO5  |  <strong>Theory Alignment:<\/strong> Unit 5  |  <strong>Estimated Time:<\/strong> 3 Hours<\/p>\n<p><strong>Aim:<\/strong> Monitor a VM with Azure Monitor metrics and alerts, review Advisor and Service Health, and deploy resources declaratively with an ARM template.<\/p>\n<p><strong>Prerequisites:<\/strong> Lab 2 skills (Ubuntu VM creation and SSH); access to the Azure Portal and Cloud Shell.<\/p>\n<div class=\"callout info\"><strong class=\"callout-title\">Before You Start: 4 Essential Beginner Tips for Lab 9<\/strong><p class=\"li sub\">• <strong>Create the Alert Rule BEFORE running the CPU load command:<\/strong> Azure Monitor evaluates CPU over a 5-minute window. Set up the alert rule and email Action Group first, then run the 5-minute stress command (`sleep 300`) inside <code>vm-mon<\/code> so the alert fires reliably.<\/p><p class=\"li sub\">• <strong>Check your Spam / Promotions folder for the Azure Monitor email:<\/strong> The alert email arrives from <code>azure-noreply@microsoft.com<\/code> about 5 to 8 minutes after CPU crosses 80%.<\/p><p class=\"li sub\">• <strong>Do NOT forget <\/strong><code>kill<\/code> <code>%1<\/code><strong> after <\/strong><code>sleep<\/code> <code>300<\/code><strong> finishes:<\/strong> Running <code>yes<\/code> <code>&gt;<\/code> <code>/dev/null<\/code> <code>&amp;<\/code> pins the VM’s CPU at 100% until you run <code>kill<\/code> <code>%1<\/code> to stop it.<\/p><p class=\"li sub\">• <strong>Switch back to Bash before Part D:<\/strong> Part C asks you to switch Cloud Shell from Bash to PowerShell—remember to switch the dropdown back to <strong>Bash<\/strong> before running the <code>az<\/code> <code>deployment<\/code> commands in Part D!<\/p><\/div>\n<h2>1. Plain-English Overview: Monitoring, Operations &amp; Automation<\/h2>\n<p>In this final lab of the course, you learn how cloud engineers keep running applications healthy and automate deployments using code instead of manual portal clicks:<\/p>\n<table>\n<thead>\n<tr><th>Lab Part &amp; Tool<\/th><th>Plain-English Purpose<\/th><th>What You Do in Lab 9<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part A: Azure Monitor<\/strong><\/td><td>Collects live performance graphs (Metrics), records who did what (Activity Log), and sends email/SMS alerts on spikes.<\/td><td>Launch <code>vm-mon<\/code>, graph <em>Percentage<\/em> <em>CPU<\/em>, create an Alert Rule (&gt; 80% for 5 min) + Action Group <code>ag-lab9<\/code>, stress-test CPU, and inspect Activity Log.<\/td><\/tr>\n<tr><td><strong>Part B: Advisor &amp;<\/strong> <strong>Service Health<\/strong><\/td><td><strong>Advisor<\/strong> gives personalized best-practice tips; <strong>Service Health<\/strong> reports outages in Microsoft’s own datacenters.<\/td><td>Check Advisor’s 5 pillars and check Service Health → Health history for <em>Central India<\/em>.<\/td><\/tr>\n<\/tbody><\/table>\n<hr class=\"pg\">\n<table>\n<thead>\n<tr><th>Lab Part &amp; Tool<\/th><th>Plain-English Purpose<\/th><th>What You Do in Lab 9<\/th><\/tr>\n<\/thead>\n<tbody>\n<tr><td><strong>Part C: Cloud Shell<\/strong> <strong>Shells<\/strong><\/td><td>Browser terminal supporting both Linux-style <strong>Azure CLI (Bash)<\/strong> and Windows-style <strong>Azure PowerShell<\/strong>.<\/td><td>Switch between Bash and PowerShell and run equivalent commands to list your resource groups.<\/td><\/tr>\n<tr><td><strong>Part D: ARM Templates<\/strong><\/td><td><strong>Infrastructure as Code (IaC):<\/strong> JSON blueprint that deploys identical Azure resources repeatably.<\/td><td>Write <code>storage.json<\/code> in Cloud Shell editor, deploy it <strong>twice<\/strong> to prove idempotency, and inspect deployment history.<\/td><\/tr>\n<\/tbody><\/table>\n<h2>2. Part A: Monitor a VM with Metrics, Alerts &amp; Activity Log<\/h2>\n<h2>Step 1: Deploy vm-mon in Cloud Shell (Bash)<\/h2>\n<p>1. Sign in at <code>portal.azure.com<\/code>, click the <strong>Cloud Shell icon (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> at the top-right of the blue header bar, and confirm you are in <strong>Bash<\/strong> mode.<\/p>\n<p>2. Run these three commands one by one (replace <code>ROLLNO<\/code> with your lowercase roll number; if <code>Standard_B1s<\/code> is unavailable in Central India, substitute another B-series size such as <code>Standard_B2s<\/code>):<\/p>\n<pre class=\"code\"><code>az group create --name rg-lab9-ROLLNO --location centralindia\naz vm create --resource-group rg-lab9-ROLLNO --name vm-mon --image Ubuntu2204 --\nsize Standard_B1s --admin-username azureuser --generate-ssh-keys\naz vm list-ip-addresses --resource-group rg-lab9-ROLLNO --output table<\/code><\/pre>\n<p>Write down the <strong>PublicIPAddresses<\/strong> value for <code>vm-mon<\/code> in Section 6—you will SSH into it in Step 4.<\/p>\n<h2>Step 2: Open Azure Monitor Metrics and Add Percentage CPU<\/h2>\n<p>1. Minimize Cloud Shell (click <code>_<\/code> on its top bar). In the top-center Global Search Bar, type <code>Virtual<\/code> <code>machines<\/code> and click <strong>Virtual machines<\/strong> → click <strong>vm-mon<\/strong>.<\/p>\n<p>2. In the left vertical menu of <code>vm-mon<\/code>, scroll down to the <strong>Monitoring<\/strong> section and click <strong>Metrics<\/strong>.<\/p>\n<p>3. A chart builder opens with <strong>Scope<\/strong> already set to <code>vm-mon<\/code> and <strong>Metric Namespace<\/strong> set to <em>Virtual<\/em> <em>Machine Host<\/em>: Open the <strong>Metric<\/strong> dropdown and select <strong>Percentage CPU<\/strong>.<\/p>\n<p class=\"li sub\">• Leave <strong>Aggregation<\/strong> set to <strong>Avg<\/strong>.<\/p>\n<p class=\"li sub\">• Look at the top-right corner of the chart area (blue pill button showing <em>Local time: Last 24<\/em> <em>hours<\/em>), click it, select <strong>Last hour<\/strong>, and click <strong>Apply<\/strong>.<\/p>\n<p>4. Observe the flat baseline CPU line (around 1%–5%) currently running on your idle VM.<\/p>\n<hr class=\"pg\">\n<h2>Step 3: Create an Alert Rule (&gt; 80% CPU) and Email Action Group ag-lab9<\/h2>\n<p>1. In the left vertical menu of <code>vm-mon<\/code> (under <strong>Monitoring<\/strong>), click <strong>Alerts<\/strong>.<\/p>\n<p>2. At the top-left toolbar of the Alerts page, click <strong>+ Create<\/strong> → select <strong>Alert rule<\/strong>.<\/p>\n<p>3. <strong>Tab 1 — Condition:<\/strong> Under <em>Signal name<\/em>, click <strong>See all signals<\/strong> (or click directly on <strong>Percentage CPU<\/strong> if already listed). In the side panel, select <strong>Percentage CPU<\/strong> and click <strong>Apply<\/strong>.<\/p>\n<p class=\"li sub\">• Scroll down to the <strong>Alert logic<\/strong> section and set:<\/p>\n<h3>Threshold: Static<\/h3>\n<h3>Operator: Greater than<\/h3>\n<h3>Aggregation type: Average<\/h3>\n<p class=\"li sub\">• <strong>Threshold value:<\/strong> Type <code>80<\/code> (for 80%).<\/p>\n<p class=\"li sub\">• <strong>Check every (Frequency):<\/strong> <strong>1 minute<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Lookback period (Aggregation granularity):<\/strong> <strong>5 minutes<\/strong>.<\/p>\n<p class=\"li sub\">• Click <strong>Next : Actions &gt;<\/strong> at the bottom-left.<\/p>\n<p>4. <strong>Tab 2 — Actions (Create Action Group <\/strong><code>ag-lab9<\/code><strong> ):<\/strong> Click the <strong>+ Create action group<\/strong> button.<\/p>\n<p class=\"li sub\">• <strong>Basics tab:<\/strong> Resource group = <code>rg-lab9-ROLLNO<\/code> | Action group name = <code>ag-lab9<\/code> | Display name = <code>aglab9<\/code>. Click <strong>Next : Notifications &gt;<\/strong>.<\/p>\n<p class=\"li sub\">• <strong>Notifications tab:<\/strong> Open the <em>Notification type<\/em> dropdown → select <strong>Email/SMS<\/strong> <strong>message/Push/Voice<\/strong>.<\/p>\n<p class=\"li sub\">• In the right-hand slide-out panel, check the <strong>Email<\/strong> checkbox, enter <strong>your email address<\/strong>, click <strong>OK<\/strong>, and enter Name = <code>EmailMe<\/code>.<\/p>\n<p class=\"li sub\">• Click <strong>Review + create<\/strong> → <strong>Create<\/strong>. Confirm <code>ag-lab9<\/code> now appears selected under Actions!<\/p>\n<p>5. <strong>Tab 3 — Details:<\/strong> <strong>Severity:<\/strong> Select <strong>2 - Warning<\/strong> (or <em>1 - Error<\/em>).<\/p>\n<p class=\"li sub\">• <strong>Alert rule name:<\/strong> Type <code>High-CPU-Alert-Lab9<\/code>.<\/p>\n<p>6. Click <strong>Review + create<\/strong> → <strong>Create<\/strong>. Wait ~30 seconds until the alert rule finishes saving. <strong>Take a<\/strong> <strong>screenshot of the Alert rule summary (or Alerts → Alert rules list) for Verification!<\/strong><\/p>\n<h2>Step 4: SSH into vm-mon , Generate a 5-Minute CPU Spike &amp; Check Email<\/h2>\n<p>1. Restore your <strong>Cloud Shell (<\/strong> <code>&gt;_<\/code><strong> )<\/strong> terminal at the bottom of the screen and SSH into <code>vm-mon<\/code> using its Public IP from Step 1:<\/p>\n<pre class=\"code\"><code>ssh azureuser@VM_PUBLIC_IP<\/code><\/pre>\n<p><em>(Type <\/em><code>yes<\/code><em> if asked about the host fingerprint.)<\/em><\/p>\n<p>2. Once your prompt says <code>azureuser@vm-mon:~$<\/code>, run these three lines from your manual to generate 100% CPU load for 5 minutes (300 seconds) and then stop it:<\/p>\n<hr class=\"pg\">\n<pre class=\"code\"><code>yes &gt; /dev/null &amp;\nsleep 300\nkill %1<\/code><\/pre>\n<h3>What each line does:<\/h3>\n<p class=\"li sub\">• <code>yes<\/code> <code>&gt;<\/code> <code>/dev/null<\/code> <code>&amp;<\/code> starts the Linux <code>yes<\/code> command in the background ( <code>&amp;<\/code>), continuously writing output to <code>/dev/null<\/code> and driving CPU usage to <strong>100%<\/strong>.<\/p>\n<p class=\"li sub\">• <code>sleep<\/code> <code>300<\/code> pauses the terminal for exactly <strong>300 seconds (5 minutes)<\/strong> while the CPU spike builds up across the 5-minute alert window.<\/p>\n<p class=\"li sub\">• Once 5 minutes pass and your prompt returns, run <code>kill<\/code> <code>%1<\/code> to terminate the background CPU stress job cleanly, then type <code>exit<\/code> to leave SSH.<\/p>\n<p class=\"li\">• <strong>Watch the Metrics graph rise:<\/strong> While <code>sleep<\/code> <code>300<\/code> is running, look at <code>vm-mon<\/code> → <strong>Monitoring →<\/strong> <strong>Metrics<\/strong> (with <em>Percentage CPU<\/em> and <em>Last hour<\/em> selected) and click <strong>Refresh<\/strong> every minute. You will see the blue line jump sharply from ~2% up to <strong>~100%<\/strong>! <strong>Take Screenshot #1 of this CPU spike<\/strong> <strong>graph!<\/strong><\/p>\n<p class=\"li\">• <strong>Check your Email Inbox (and Spam folder):<\/strong> Within 5–8 minutes, you will receive an automated email from <strong>Microsoft Azure<\/strong> with subject <em>“Azure: Activated Severity: 2 High-CPU-Alert-Lab9”<\/em>.<\/p>\n<h3>Take Screenshot #2 of this alert email!<\/h3>\n<p class=\"li\">• <strong>Inspect the Activity Log:<\/strong> In the left vertical menu of <code>vm-mon<\/code>, scroll near the top and click <strong>Activity log<\/strong>. Expand the operation entries (such as <em>Create or Update Virtual Machine<\/em> / <code>Microsoft.Compute/virtualMachines/write<\/code>) to see who created the VM, its timestamp, and status (<em>Succeeded<\/em>).<\/p>\n<div class=\"callout tip\"><p><strong>Optional Step 5 (Log Analytics Workspace &amp; KQL Query):<\/strong> If you have extra time, search for <strong>Log<\/strong> <strong>Analytics workspaces<\/strong> → <strong>+ Create<\/strong> inside <code>rg-lab9-ROLLNO<\/code>. Then open your Subscription (or VM) → <strong>Activity log → Export Activity Logs → + Add diagnostic setting<\/strong>, check <em>Administrative<\/em>, and send to your Log Analytics workspace. After ~10 minutes, open the workspace → <strong>Logs<\/strong> and run <code>AzureActivity<\/code> <code>|<\/code> <code>take<\/code> <code>10<\/code> to query live activity events using Kusto Query Language (KQL).<\/p><\/div>\n<h2>3. Part B: Review Azure Advisor &amp; Service Health (Portal)<\/h2>\n<h2>Step 1: Review the 5 Pillars of Azure Advisor<\/h2>\n<p>1. In the top-center Global Search Bar, type <code>Advisor<\/code> and click <strong>Advisor<\/strong> under Services.<\/p>\n<p>2. On the Advisor <strong>Overview<\/strong> dashboard, examine the five recommendation pillars and click into each one in the left vertical menu: <strong>Cost:<\/strong> Identifies idle/underutilized VMs, unattached disks, or Reserved Instance savings opportunities.<\/p>\n<p class=\"li sub\">• <strong>Security:<\/strong> Integrates with Microsoft Defender for Cloud to flag open ports, missing MFA, or unencrypted storage.<\/p>\n<p class=\"li sub\">• <strong>Reliability:<\/strong> Recommends Availability Zones, VM backups, or disk redundancy to prevent downtime.<\/p>\n<hr class=\"pg\">\n<p>3. <strong>Operational excellence:<\/strong> Suggests process improvements like Azure Policy governance, tagging, and Service Health alerts.<\/p>\n<p class=\"li sub\">• <strong>Performance:<\/strong> Flags CPU/memory bottlenecks, slow storage tiers, or database index improvements.<\/p>\n<h2>Step 2: Check Service Health &amp; Health History for Central India<\/h2>\n<p>1. In the top-center Global Search Bar, type <code>Service<\/code> <code>Health<\/code> and click <strong>Service Health<\/strong> under Services.<\/p>\n<p>2. In the left vertical menu of Service Health (under <strong>Active events<\/strong>), check <strong>Service issues<\/strong>, <strong>Planned<\/strong> <strong>maintenance<\/strong>, and <strong>Health advisories<\/strong>.<\/p>\n<p>3. Next, under <strong>History<\/strong> in the left ve
